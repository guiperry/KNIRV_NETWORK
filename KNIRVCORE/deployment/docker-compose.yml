version: '3.8'

services:
  knirvbase-node:
    build: ..
    container_name: knirvbase-node
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      - ./data:/var/lib/knirvbase
      - ./config.yaml:/root/config.yaml
      - ./wallet.key:/etc/knirvbase/wallet.key
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - knirvbase-network

  redis:
    image: redis:7-alpine
    container_name: knirvbase-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - knirvbase-network

  postgres:
    image: postgres:15-alpine
    container_name: knirvbase-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=knirvbase
      - POSTGRES_USER=knirv
      - POSTGRES_PASSWORD=secure_password_here
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - knirvbase-network

  prometheus:
    image: prom/prometheus:latest
    container_name: knirvbase-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - knirvbase-network

  grafana:
    image: grafana/grafana:latest
    container_name: knirvbase-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - knirvbase-network

volumes:
  redis-data:
  postgres-data:
  prometheus-data:
  grafana-data:

networks:
  knirvbase-network:
    driver: bridge