# KNIRV-ROUTER Testnet Configuration
network:
  node_id: "router-testnet-1"
  listen_addr: "0.0.0.0:8086"
  external_addr: "localhost:8086"

connectivity:
  proof_interval: "300s"  # Generate connectivity proofs every 5 minutes (reduced from 1 minute)
  target_paths: 5         # Test 5 different network paths (reduced from 10)
  timeout: "30s"
  measurement_interval: "120s"  # Measure peer connectivity every 2 minutes (reduced from 30s)

nrn_minting:
  enabled: true
  knirvoracle_endpoint: "http://localhost:1317"
  mint_rate: 100  # NRN per successful proof

p2p:
  dht_enabled: true
  bootstrap_nodes: []
  protocols: ["/knirv/router/1.0.0"]

turn_server:
  enabled: true
  port: 3478
  realm: "knirv-testnet"

api:
  host: "0.0.0.0"
  port: 8086
  endpoints:
    - "/connectivity/proof"
    - "/nrn/mint"
    - "/status"
    - "/peers"

logging:
  level: "warn"  # Reduced from "info" to "warn" to reduce log verbosity
  file: "./logs/knirvrouter.log"
  connectivity_logs: false  # Disable verbose connectivity measurement logs
