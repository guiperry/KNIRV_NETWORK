# KNIRV-SERVER Testnet Configuration
cluster:
  name: "testnet-cluster"
  nodes: 2
  load_balancing: "round_robin"

node:
  id: "nexus-{NODE_ID}"
  host: "0.0.0.0"
  port: 808{NODE_ID}  # 8082, 8083
  
tee:
  simulation_mode: true  # No real TEE in testnet
  validation_timeout: "30s"
  max_concurrent_validations: 5

clean:
  cognitive_engine: "simple"
  adaptability_orchestrator: "basic"
  security_stack: "simulated"

validation:
  skill_validation: true
  llm_validation: true
  proof_generation: true
  zkTLS_enabled: false  # Simplified for testnet

storage:
  results_path: "./data/knirvserver/validations"
  cache_size: "50MB"

staking:
  required_nrn: 1000
  reward_rate: 0.1
  slashing_rate: 0.05

api:
  endpoints:
    - "/validate/skill"
    - "/validate/llm"
    - "/status"
    - "/metrics"
