syntax = "proto3";

package knirv.graph.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/guiperry/KNIRV_NETWORK/pkg/gen/knirv/graph/v1;graphv1";

// ErrorContext is the rich data payload sent by a KNIRV agent to KNIRVGRAPH
// when it encounters an error. The graph uses this to find similar ErrorNodes.
message ErrorContext {
  // Agent information
  string agent_id = 1;
  string agent_version = 2;
  string base_model_id = 3;

  // Environment information
  string os = 4;
  string architecture = 5;
  string runtime_environment = 6; // "browser", "native_host", "knirv-nexus-dve"

  // Error details
  string error_type = 7;
  string error_message = 8;
  string stack_trace = 9;
  string source_code_snippet = 10;

  // Task context
  string task_description = 11;
  string input_data_hash = 12;
  string skill_invoked_id = 13;

  // State and metadata
  string agent_state_hash = 14;
  google.protobuf.Timestamp timestamp = 15;
  google.protobuf.Struct additional_context = 16;
}

// Request to query KNIRVGRAPH for similar error clusters
message ErrorClusterQueryRequest {
  ErrorContext error_context = 1;
  int32 max_results = 2;
  float similarity_threshold = 3;
}

// Response from KNIRVGRAPH error cluster query
message ErrorClusterQueryResponse {
  QueryStatus status = 1;
  string error_message = 2;
  SkillNodeResult skill_node_result = 3;
  repeated ErrorCluster similar_clusters = 4;
}

// Skill node result from KNIRVGRAPH
message SkillNodeResult {
  string skill_uri = 1;
  string skill_node_id = 2;
  string cluster_id = 3;
  float confidence = 4;
  map<string, string> metadata = 5;
}

// Error cluster information
message ErrorCluster {
  string cluster_id = 1;
  string error_type = 2;
  int32 error_count = 3;
  float average_severity = 4;
  repeated string tags = 5;
  int64 bounty_amount = 6;
}

// Request to submit a new error node to KNIRVGRAPH
message ErrorNodeSubmissionRequest {
  ErrorContext error_context = 1;
  int64 bounty_amount = 2;
  ErrorPriority priority = 3;
}

// Response from error node submission
message ErrorNodeSubmissionResponse {
  SubmissionStatus status = 1;
  string error_message = 2;
  string error_node_id = 3;
  string cluster_id = 4;
}

// Query status enumeration
enum QueryStatus {
  QUERY_STATUS_UNSPECIFIED = 0;
  QUERY_SUCCESS = 1;
  QUERY_FAILED = 2;
  QUERY_NO_MATCH = 3;
  QUERY_PARTIAL_MATCH = 4;
}

// Submission status enumeration
enum SubmissionStatus {
  SUBMISSION_STATUS_UNSPECIFIED = 0;
  SUBMISSION_SUCCESS = 1;
  SUBMISSION_FAILED = 2;
  SUBMISSION_DUPLICATE = 3;
  SUBMISSION_INVALID = 4;
}

// Error priority enumeration
enum ErrorPriority {
  ERROR_PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  MEDIUM = 2;
  HIGH = 3;
  CRITICAL = 4;
}

// ---------------------------------------------------------------------------
// Canonical node types
//
// ErrorNode is THE canonical error node, shared by every package that records,
// clusters, validates, or mints from errors (KNIRVGRAPH's drq/nrv, KNIRVCHAIN's
// types, KNIRVARENA). It exists to end the divergence that previously left three
// incompatible Go structs and three overlapping proto messages
// (chain/v1.ErrorNode, lora/v1.ErrorContext, graph/v1.ErrorContext) describing
// the same thing — both of which were removed when this definition landed.
//
// Relationship to ErrorContext above: ErrorContext is the inbound *rich payload*
// an agent submits when it hits an error. ErrorNode is what the graph persists
// from that payload and what flows onward through clustering, validation and
// uLoRA minting. Nodes are created from a context, not equal to one.
//
// Everything DRQ needs is carried on the node itself: identity, classification,
// provenance, the Clustering group (cluster_id, embedding, priority,
// queue_position), payload, lifecycle, resolution, Red Queen dynamics and
// timestamps. A consumer can therefore reproduce or extend DRQ's clustering,
// scheduling and evolutionary state without reaching back into the graph.
message ErrorNode {
  // Identity
  string id = 1;
  string nrv_source = 2;

  // Classification
  string error_type = 3;
  string error_signature = 4;
  string description = 5;
  string domain = 6;
  int32 complexity = 7;
  int32 severity = 8;

  // Provenance
  string model_origin = 9;
  string resolved_by = 10;

  // Clustering. embedding is the semantic vector the node was clustered by,
  // priority is the DRQ queue priority score, and queue_position is the node's
  // place in the distributed queue. These travel with the node so a consumer
  // can reproduce or extend the clustering and scheduling state rather than
  // recomputing it from scratch.
  string cluster_id = 11;
  repeated double embedding = 12;
  double priority = 13;
  int32 queue_position = 14;

  // Payload. failure_context carries the raw bytes the node was derived from;
  // context carries the structured execution context, and is the input half of
  // what a uLoRA compile transmutes into adapter weights.
  bytes failure_context = 15;
  google.protobuf.Struct context = 16;
  google.protobuf.Struct metadata = 17;

  // Lifecycle. status is a string, not an enum, because that is the wire
  // format KNIRVCHAIN already persists: internal/graph/node_store.go stores
  // nodes with plain json.Marshal into LevelDB, and KNIRVCHAIN's NodeStatus is
  // a string type whose values are "Open", "InProgress", "Resolved",
  // "Validated", "Rejected". A proto enum here would serialise as an integer
  // and silently break every previously stored row. Allowed values are exactly
  // those five strings.
  string status = 18;
  uint64 failure_count = 19;
  string nrn_bounty = 20;

  // Resolution
  ResolutionPath resolution = 21;

  // Red Queen dynamics tracking. These record how the node evolved across DRQ
  // rounds: which round produced it, how general it proved against a held-out
  // set, and how far its phenotype drifted from the cluster centroid. They ride
  // on the node so a consumer can audit or resume the evolutionary state.
  int32 adaptation_round = 22;
  double generation_score = 23;
  repeated double phenotype_drift = 24;

  // Timestamps. created_at is unix seconds for wire compatibility with the
  // existing chain-side field; timestamp is the authoritative event time.
  int64 created_at = 25;
  google.protobuf.Timestamp timestamp = 26;
}

// ContextNode is a node attached to an ErrorNode carrying one piece of the
// execution context the error occurred in. A node's context data is the input
// half of what a uLoRA compile transmutes into adapter weights.
message ContextNode {
  string id = 1;
  string error_id = 2;
  string node_type = 3;
  google.protobuf.Struct payload = 4;
  float confidence = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// ResolutionPath records how an error was resolved.
message ResolutionPath {
  repeated ResolutionStep steps = 1;
  float confidence = 2;
  float estimated_cost = 3;
}

// ResolutionStep is a single step within a ResolutionPath.
message ResolutionStep {
  string action = 1;
  google.protobuf.Struct parameters = 2;
  string skill_id = 3;
  float confidence = 4;
}

// NodeStatus is deliberately NOT defined as an enum here. KNIRVCHAIN persists
// nodes as JSON with a string status ("Open", "InProgress", "Resolved",
// "Validated", "Rejected"), so the canonical node carries `string status` and
// these five values are the contract. Declaring a proto enum would change the
// serialised form to an integer and break stored data.
