name: Build and Deploy KNIRV Network

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  AWS_REGION: us-east-1

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: knirvchain
            path: KNIRVCHAIN
            dockerfile: Dockerfile
          - name: knirvcontroller
            path: KNIRVCONTROLLER
            dockerfile: Dockerfile
          - name: knirvgraph
            path: KNIRVGRAPH
            dockerfile: Dockerfile
          - name: knirvnexus
            path: KNIRVNEXUS
            dockerfile: Dockerfile
          - name: knirvoracle
            path: KNIRVORACLE
            dockerfile: Dockerfile
          - name: knirvrouter
            path: KNIRVROUTER
            dockerfile: Dockerfile
          - name: knirvgateway
            path: KNIRVGATEWAY
            dockerfile: Dockerfile
          - name: knirvana
            path: KNIRVANA
            dockerfile: Dockerfile
          - name: knirvcortex
            path: KNIRVCORTEX
            dockerfile: Dockerfile
          - name: knirvengine
            path: KNIRVENGINE
            dockerfile: Dockerfile
          - name: knirvcli
            path: KNIRVSDK/KNIRVCLI
            dockerfile: Dockerfile
          - name: knirvtestnet-gateway
            path: KNIRVTESTNET
            dockerfile: testnet-gateway.Dockerfile

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_PREFIX }}/${{ matrix.component.name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ${{ matrix.component.path }}
        file: ${{ matrix.component.path }}/${{ matrix.component.dockerfile }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64,linux/arm64

  build-podman:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        component:
          - name: knirvgateway
            path: KNIRVGATEWAY
          - name: knirvana
            path: KNIRVANA
          - name: knirvcortex
            path: KNIRVCORTEX
          - name: knirvengine
            path: KNIRVENGINE

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Podman
      run: |
        sudo apt-get update
        sudo apt-get install -y podman

    - name: Log in to Container Registry (Podman)
      run: |
        echo ${{ secrets.GITHUB_TOKEN }} | podman login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

    - name: Build and push Podman image
      run: |
        cd ${{ matrix.component.path }}
        podman build -f Containerfile -t ${{ env.IMAGE_PREFIX }}/${{ matrix.component.name }}:podman-latest .
        podman push ${{ env.IMAGE_PREFIX }}/${{ matrix.component.name }}:podman-latest

  integration-test:
    needs: build-matrix
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose

    - name: Run integration tests
      run: |
        cd KNIRVTESTNET
        docker-compose up -d
        sleep 30
        # Run basic health checks
        curl -f http://localhost:10000/health || exit 1
        docker-compose down

  deploy:
    needs: [build-matrix, build-podman]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Deploy to staging
      run: |
        echo "Deployment would happen here"
        echo "Images built and pushed successfully"
        echo "Ready for Terraform deployment"
