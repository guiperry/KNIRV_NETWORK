<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting to KNIRV Network...</title>
    <meta http-equiv="refresh" content="5;url=/dashboard"> <!-- Fallback redirect to WebGUI after 5 seconds -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            text-align: center;
            padding: 20vh 20px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            background: url('/images/logo/logo.png') center/contain no-repeat;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #00d4ff, #7b68ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .details {
            font-size: 0.9rem;
            opacity: 0.6;
            max-width: 600px;
            line-height: 1.5;
        }

        .error {
            color: #ff6b6b;
            margin-top: 1rem;
        }

        .fallback-link {
            margin-top: 2rem;
        }

        .fallback-link a {
            color: #00d4ff;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #00d4ff;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .fallback-link a:hover {
            background: #00d4ff;
            color: #0f0f23;
        }
    </style>
</head>
<body>
    <div class="logo"></div>
    <h1>KNIRV Network</h1>
    <div class="spinner"></div>
    <div class="status" id="status">Connecting to the best available portal...</div>
    <div class="details" id="details">
        Checking primary site availability and routing you to the optimal gateway...
    </div>
    <div class="error" id="error" style="display: none;"></div>
    <div class="fallback-link">
        <a href="https://knirvgateway.onrender.com/dashboard"">Continue to Gateway Portal</a>
    </div>

    <script>
        // Configuration
        const PRIMARY_URL = '/dashboard';
        const FALLBACK_URL = 'https://knirvgateway.onrender.com/dashboard';
        const HEALTH_CHECK_TIMEOUT = 5000; // 5 seconds
        const MAX_RETRIES = 2;

        let retryCount = 0;

        // Update status display
        function updateStatus(message, isError = false) {
            const statusEl = document.getElementById('status');
            const errorEl = document.getElementById('error');

            if (isError) {
                errorEl.textContent = message;
                errorEl.style.display = 'block';
                statusEl.textContent = 'Connection failed';
            } else {
                statusEl.textContent = message;
                errorEl.style.display = 'none';
            }
        }

        // Update details display
        function updateDetails(message) {
            document.getElementById('details').textContent = message;
        }

        // Perform health check with timeout and retry logic
        async function performHealthCheck() {
            updateStatus('Checking primary site health...');
            updateDetails('Verifying knirv.network availability...');

            try {
                // Create AbortController for timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), HEALTH_CHECK_TIMEOUT);

                // Attempt to fetch the primary site
                // Using no-cors mode for cross-origin health check
                const response = await fetch(PRIMARY_URL, {
                    signal: controller.signal,
                    mode: 'no-cors',
                    method: 'HEAD' // Use HEAD to minimize data transfer
                });

                clearTimeout(timeoutId);

                // If we get here without throwing, the site is likely reachable
                updateStatus('Primary site is healthy. Redirecting...');
                updateDetails('Successfully connected to knirv.network. Redirecting now...');

                // Small delay to show success message
                setTimeout(() => {
                    window.location.replace(PRIMARY_URL);
                }, 1000);

            } catch (error) {
                console.error('Primary site health check failed:', error);

                if (retryCount < MAX_RETRIES) {
                    retryCount++;
                    updateStatus(`Retrying connection (${retryCount}/${MAX_RETRIES})...`);
                    updateDetails('Primary site unavailable. Retrying...');

                    // Retry after a short delay
                    setTimeout(performHealthCheck, 2000);
                } else {
                    // All retries failed, redirect to fallback
                    updateStatus('Using fallback gateway...', true);
                    updateDetails('Primary site is currently unavailable. Redirecting to local gateway portal...');
                    updateStatus('Redirecting to gateway portal...', false);

                    setTimeout(() => {
                        window.location.replace(FALLBACK_URL);
                    }, 2000);
                }
            }
        }

        // Start the health check process when page loads
        document.addEventListener('DOMContentLoaded', () => {
            // Small delay to show the loading screen
            setTimeout(performHealthCheck, 500);
        });

        // Fallback: if JavaScript fails, meta refresh will redirect after 10 seconds
    </script>
</body>
</html>
