[build]
  # Static site with Netlify Functions - smart build with health monitoring and app initialization
  publish = "."
  command = "npm run install-function-deps && npm run build:netlify-functions && npm run validate-function-names && npm run smart-build-no-recursion"
  functions = "netlify/functions"

# Documentation build context
[context.docs]
  base = "documentation/"
  publish = "documentation/docsify/"
  command = "npm install && npm run build"

# Agent Developer Portal build context
[context.portal]
  base = "agent-developer-portal/"
  publish = "agent-developer-portal/"
  command = "npm install"

# Gateway Functions build context
[context.gateway-functions]
  base = "gateway-functions/"
  publish = "gateway-functions/"
  command = "npm install"

# GraphChain Explorer build context
[context.graphchain-explorer]
  base = "graphchain-explorer/"
  publish = "graphchain-explorer/"
  command = "echo 'Static GraphChain Explorer - no build needed'"

# NEXUS Portal build context
[context.nexus]
  base = "nexus-portal/"
  publish = "nexus-portal/dist/"
  command = "npm install && npm run build"

  [context.nexus.environment]
    NODE_ENV = "production"
    VITE_API_BASE_URL = "/.netlify/functions"
    VITE_SSE_BASE_URL = "/.netlify/functions/gateway-sse"
    VITE_NEXUS_API_URL = "/.netlify/functions/gateway-sse"
    VITE_ENABLE_REAL_TIME = "true"
    VITE_TESTNET_MODE = "true"

# Presenter build context
[context.presenter]
  base = "presenter/"
  publish = "presenter/"
  command = "npm install"

# Forum build context
[context.forum]
  base = "forum/"
  publish = "forum/src/"
  command = "node ../scripts/init_discourse_database.js && echo 'Forum database initialized'"

# Support Desk build context
[context.support-desk]
  base = "support-desk/"
  publish = "support-desk/src/"
  command = "node ../scripts/init_support_database.js && echo 'Support desk database initialized'"

# Production build settings
[build.environment]
  NODE_VERSION = "18"

# Redirect rules for documentation
[[redirects]]
  from = "/docs/*"
  to = "/documentation/docsify/:splat"
  status = 200

[[redirects]]
