# Form handling (if needed)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = false
  minify = false

[build.processing.js]
  bundle = false
  minify = false

[build.processing.html]
  pretty_urls = true


# Testnet configuration (auto-generated by migration script)
[context.testnet]
