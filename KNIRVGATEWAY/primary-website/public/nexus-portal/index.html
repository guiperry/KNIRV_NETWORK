<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>KNIRV NEXUS - Redirecting...</title>
    <script>
        async function checkApiAndRedirect() {
            const apiEndpoint = 'https://nexus-api.knirv.com/api/health';
            const timeout = 5000;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);

                const response = await fetch(apiEndpoint, {
                    method: 'GET',
                    signal: controller.signal,
                    mode: 'cors'
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    window.location.href = './app.html';
                } else {
                    window.location.href = './landing.html';
                }
            } catch (error) {
                console.log('API unavailable, redirecting to landing page:', error.message);
                window.location.href = './landing.html';
            }
        }

        checkApiAndRedirect();
    </script>
</head>
<body>
    <p>Checking NEXUS availability...</p>
</body>
</html>
