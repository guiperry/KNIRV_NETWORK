    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ctx = document.getElementById('marketGrowthChart').getContext('2d');
            
            const gradientFill = ctx.createLinearGradient(0, 0, 0, 400);
            gradientFill.addColorStop(0, 'rgba(124, 58, 237, 0.4)');
            gradientFill.addColorStop(1, 'rgba(124, 58, 237, 0.05)');
            
            const marketGrowthChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['2025', '2026', '2027', '2028', '2029', '2030'],
                    datasets: [{
                        label: 'Blockchain AI Market ($B)',
                        data: [25, 40, 65, 105, 190, 335.8],
                        borderColor: '#7c3aed',
                        backgroundColor: gradientFill,
                        borderWidth: 3,
                        pointBackgroundColor: '#7c3aed',
                        pointRadius: 4,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#e0e0e0',
                                font: {
                                    size: 14,
                                    family: "'Montserrat', sans-serif"
                                }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(10, 25, 47, 0.8)',
                            titleColor: '#7c3aed',
                            bodyColor: '#ffffff',
                            titleFont: {
                                size: 16,
                                family: "'Montserrat', sans-serif"
                            },
                            bodyFont: {
                                size: 14,
                                family: "'Montserrat', sans-serif"
                            },
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `$${context.parsed.y}B`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#e0e0e0',
                                font: {
                                    family: "'Montserrat', sans-serif"
                                }
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#e0e0e0',
                                font: {
                                    family: "'Montserrat', sans-serif"
                                },
                                callback: function(value) {
                                    return '$' + value + 'B';
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
