<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to KNIRV Developer Portal</title>
    <meta http-equiv="refresh" content="0; url=index.html">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .redirect-message {
            text-align: center;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 1rem;
            border: 1px solid rgba(0, 192, 250, 0.3);
            backdrop-filter: blur(10px);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 192, 250, 0.3);
            border-top: 4px solid #00c0fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="redirect-message">
        <h1>KNIRV Developer Portal</h1>
        <div class="spinner"></div>
        <p>Redirecting to the new KNIRV Developer Portal...</p>
        <p><a href="index.html" style="color: #00c0fa;">Click here if you are not redirected automatically</a></p>
    </div>
    <script>
        // Immediate redirect
        window.location.href = 'index.html';
    </script>
</body>
</html>
