# API Gateway Configuration
# This file configures the KNIRV Network API Gateway

gateway:
  port: 8000
  host: "0.0.0.0"
  
  # Rate limiting configuration
  rate_limit:
    requests_per_minute: 100
    window_duration: "1m"
  
  # Authentication configuration
  auth:
    token_duration: "24h"
    default_admin_user: "admin"
    default_admin_password: "password"  # Change in production!
  
  # Health check configuration
  health_checks:
    interval: "30s"
    timeout: "10s"
  
  # WebSocket configuration
  websocket:
    enabled: true
    ping_interval: "30s"
  
  # CORS configuration
  cors:
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowed_headers: ["*"]
    allow_credentials: true

# Service configurations
services:
  knirvchain:
    name: "knirvchain"
    url: "http://localhost:8080"
    health_path: "/health"
    timeout: "30s"
    headers:
      X-Service: "knirvchain"
    routes:
      - path: "/wallets/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/nrn/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/skill/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/llm/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/blocks"
        methods: ["GET"]
        auth_required: false

  knirvgraph:
    name: "knirvgraph"
    url: "http://localhost:8081"
    health_path: "/health"
    timeout: "20s"
    headers:
      X-Service: "knirvgraph"
    routes:
      - path: "/height"
        methods: ["GET"]
        auth_required: false
      - path: "/node/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/edge/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/graph/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/account/*"
        methods: ["GET"]
        auth_required: false
      - path: "/transaction"
        methods: ["POST"]
        auth_required: true
      - path: "/nrv/*"
        methods: ["GET", "POST"]
        auth_required: true

  knirvnexus:
    name: "knirvnexus"
    url: "http://localhost:8082"
    health_path: "/health"
    timeout: "60s"
    headers:
      X-Service: "knirvnexus"
    routes:
      - path: "/api/v1/agents/*"
        methods: ["GET", "POST", "PUT", "DELETE"]
        auth_required: true
      - path: "/api/v1/workflows/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/api/v1/mcp/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/api/v1/inference/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/desktop/*"
        methods: ["GET"]
        auth_required: false

  knirvroot:
    name: "knirvroot"
    url: "http://localhost:5000"
    health_path: "/health"
    timeout: "30s"
    headers:
      X-Service: "knirvroot"
    routes:
      - path: "/chain"
        methods: ["GET"]
        auth_required: false
      - path: "/block"
        methods: ["POST"]
        auth_required: true
      - path: "/transaction"
        methods: ["POST"]
        auth_required: true
      - path: "/mcp/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/payment/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/bridge/*"
        methods: ["GET", "POST"]
        auth_required: true
      - path: "/test/faucet"
        methods: ["POST"]
        auth_required: false
      - path: "/ping"
        methods: ["GET"]
        auth_required: false

  knirvrouter:
    name: "knirvrouter"
    url: "http://localhost:3478"
    health_path: "/api/health"
    timeout: "15s"
    headers:
      X-Service: "knirvrouter"
    routes:
      - path: "/api/connectivity/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/api/proof/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/api/mint/*"
        methods: ["POST"]
        auth_required: true
      - path: "/api/stats/*"
        methods: ["GET"]
        auth_required: false
      - path: "/turn/*"
        methods: ["GET", "POST"]
        auth_required: false
      - path: "/ws"
        methods: ["GET"]
        auth_required: false

  economics:
    name: "economics"
    url: "http://localhost:8090"
    health_path: "/economics/health"
    timeout: "30s"
    headers:
      X-Service: "economics"
    routes:
      - path: "/economics/skill/invoke"
        methods: ["POST"]
        auth_required: true
      - path: "/economics/llm/register"
        methods: ["POST"]
        auth_required: true
      - path: "/economics/validation/reward"
        methods: ["POST"]
        auth_required: true
      - path: "/economics/fees/calculate"
        methods: ["POST"]
        auth_required: false
      - path: "/economics/metrics"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/transaction/*"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/transactions"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/burn/*"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/rules"
        methods: ["GET", "PUT"]
        auth_required: true
      - path: "/economics/service/*/metrics"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/integration/status"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/info"
        methods: ["GET"]
        auth_required: false
      - path: "/economics/health"
        methods: ["GET"]
        auth_required: false

# Logging configuration
logging:
  level: "info"
  format: "json"
  output: "stdout"

# Metrics configuration
metrics:
  enabled: true
  endpoint: "/gateway/metrics"
  retention_size: 1000  # Number of response times to keep
