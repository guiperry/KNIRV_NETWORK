<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KNIRV NEXUS Portal</title>
    <meta name="description" content="KNIRV NEXUS Portal - Decentralized Validation Environment Interface" />
    <style>
      /* Tailwind CSS base styles */
      @import url('https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/base.min.css');
      @import url('https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/components.min.css');
      @import url('https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/utilities.min.css');
      
      /* KNIRV branding */
      .knirv-gradient-text {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      
      .knirv-card-gradient {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        border: 1px solid rgba(102, 126, 234, 0.2);
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Loading state -->
      <div class="min-h-screen flex items-center justify-center">
        <div class="text-center space-y-4">
          <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto"></div>
          <h1 class="text-2xl font-bold knirv-gradient-text">KNIRV NEXUS Portal</h1>
          <p class="text-gray-600">Loading Decentralized Validation Environment...</p>
        </div>
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
