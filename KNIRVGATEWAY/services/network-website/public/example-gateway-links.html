<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNIRV Gateway Links Example</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .deployment-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .deployment-mode {
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .deployment-mode.private_testnet {
            color: #ffd700;
        }
        
        .deployment-mode.public_testnet {
            color: #00ff88;
        }
        
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .service-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .service-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(31, 38, 135, 0.5);
        }
        
        .service-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .service-url {
            word-break: break-all;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
        }
        
        .service-link {
            display: inline-block;
            background: linear-gradient(45deg, #00c0fa, #2b56f5);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            margin: 5px;
            transition: all 0.3s ease;
            font-weight: 500;
        }
        
        .service-link:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 192, 250, 0.4);
        }
        
        .health-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .health-status.healthy {
            background: #00ff88;
            color: #000;
        }
        
        .health-status.unhealthy {
            background: #ff4757;
            color: #fff;
        }
        
        .health-status.checking {
            background: #ffa502;
            color: #000;
        }
        
        .external-services {
            margin-top: 30px;
        }
        
        .external-services h2 {
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
        }
        
        .error {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
        }
        
        .refresh-btn {
            background: linear-gradient(45deg, #8b5cf6, #a855f7);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            margin: 10px;
            transition: all 0.3s ease;
        }
        
        .refresh-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(139, 92, 246, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 KNIRV Gateway Links</h1>
        
        <div class="deployment-info">
            <div>Deployment Mode: <span class="deployment-mode" data-deployment-mode>Loading...</span></div>
            <div style="margin-top: 10px; font-size: 0.9em; opacity: 0.8;">
                <span id="timestamp">Loading configuration...</span>
            </div>
            <button class="refresh-btn" onclick="refreshAll()">🔄 Refresh</button>
        </div>
        
        <div id="loading" class="loading">
            Loading gateway services...
        </div>
        
        <div id="error" class="error" style="display: none;">
            <strong>Error:</strong> <span id="error-message"></span>
        </div>
        
        <div id="services-container" style="display: none;">
            <h2>Gateway Services</h2>
            <div class="services-grid" id="services-grid">
                <!-- Services will be populated here -->
            </div>
            
            <div class="external-services">
                <h2>External Services</h2>
                <div id="external-services-list">
                    <!-- External services will be populated here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Include the gateway links library -->
    <script src="/js/gateway-links.js"></script>
    
    <script>
        let healthCheckInterval;
        
        async function loadServices() {
            try {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
                document.getElementById('services-container').style.display = 'none';
                
                // Wait for configuration to load
                await window.knirvGatewayLinks.loadPromise;
                
                // Update timestamp
                const config = window.knirvGatewayLinks.config;
                document.getElementById('timestamp').textContent = 
                    `Last updated: ${new Date(config.timestamp).toLocaleString()}`;
                
                // Load gateway services
                const gatewayServices = await window.knirvGatewayLinks.getAllServiceUrls();
                const servicesGrid = document.getElementById('services-grid');
                servicesGrid.innerHTML = '';
                
                for (const [serviceName, serviceConfig] of Object.entries(gatewayServices)) {
                    const serviceCard = createServiceCard(serviceName, serviceConfig);
                    servicesGrid.appendChild(serviceCard);
                }
                
                // Load external services
                const externalServices = await window.knirvGatewayLinks.config.external_services;
                const externalList = document.getElementById('external-services-list');
                externalList.innerHTML = '';
                
                for (const [serviceName, url] of Object.entries(externalServices)) {
                    const link = document.createElement('a');
                    link.href = url;
                    link.textContent = serviceName.replace('_', ' ').toUpperCase();
                    link.className = 'service-link';
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    externalList.appendChild(link);
                }
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('services-container').style.display = 'block';
                
                // Start health checks
                startHealthChecks();
                
            } catch (error) {
                console.error('Failed to load services:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error-message').textContent = error.message;
            }
        }
        
        function createServiceCard(serviceName, serviceConfig) {
            const card = document.createElement('div');
            card.className = 'service-card';
            card.innerHTML = `
                <div class="service-title">
                    ${serviceName.replace('_', ' ').toUpperCase()}
                    <span class="health-status checking" id="health-${serviceName}">Checking...</span>
                </div>
                <div class="service-url">${serviceConfig.base_url}</div>
                <a href="${serviceConfig.base_url}" class="service-link" target="_blank" rel="noopener noreferrer">
                    Open Service
                </a>
                <a href="${serviceConfig.health_url}" class="service-link" target="_blank" rel="noopener noreferrer">
                    Health Check
                </a>
            `;
            return card;
        }
        
        async function checkServiceHealth(serviceName) {
            try {
                const healthStatus = await window.knirvGatewayLinks.checkServiceHealth(serviceName);
                const statusElement = document.getElementById(`health-${serviceName}`);
                
                if (statusElement) {
                    if (healthStatus.healthy) {
                        statusElement.textContent = 'Healthy';
                        statusElement.className = 'health-status healthy';
                    } else {
                        statusElement.textContent = 'Unhealthy';
                        statusElement.className = 'health-status unhealthy';
                        statusElement.title = healthStatus.error || `Status: ${healthStatus.status}`;
                    }
                }
            } catch (error) {
                const statusElement = document.getElementById(`health-${serviceName}`);
                if (statusElement) {
                    statusElement.textContent = 'Error';
                    statusElement.className = 'health-status unhealthy';
                    statusElement.title = error.message;
                }
            }
        }
        
        async function startHealthChecks() {
            const gatewayServices = await window.knirvGatewayLinks.getAllServiceUrls();
            
            // Initial health check
            for (const serviceName of Object.keys(gatewayServices)) {
                checkServiceHealth(serviceName);
            }
            
            // Periodic health checks every 30 seconds
            if (healthCheckInterval) {
                clearInterval(healthCheckInterval);
            }
            
            healthCheckInterval = setInterval(async () => {
                for (const serviceName of Object.keys(gatewayServices)) {
                    checkServiceHealth(serviceName);
                }
            }, 30000);
        }
        
        async function refreshAll() {
            if (healthCheckInterval) {
                clearInterval(healthCheckInterval);
            }
            
            // Reload the configuration
            window.knirvGatewayLinks = new KNIRVGatewayLinks();
            await loadServices();
        }
        
        // Load services when page loads
        document.addEventListener('DOMContentLoaded', loadServices);
        
        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (healthCheckInterval) {
                clearInterval(healthCheckInterval);
            }
        });
    </script>
</body>
</html>
