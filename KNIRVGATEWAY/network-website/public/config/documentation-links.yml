# KNIRV Documentation Site Configuration
# This file contains routing and navigation configuration for the static HTML documentation site

# Main Documentation Site
documentation_site:
  base_url: "../documentation/"
  title: "KNIRV Network Documentation"
  description: "Comprehensive documentation for the KNIRV Decentralized Trusted Execution Network (D-TEN)"

# Navigation Links for Documentation Site
navigation:
  home: "../documentation/index.html"
  whitepapers: "../documentation/whitepapers/index.html"
  main_site: "../../index.html"
  developer_portal: "../agent-developer-portal/"
  support: "../support-desk/src/"

# Documentation Categories
categories:
  guides:
    title: "User Guides"
    description: "Step-by-step guides for using KNIRV Network components"
    icon: "📚"
    
  deployment:
    title: "Deployment"
    description: "Installation and deployment guides"
    icon: "🚀"
    
  development:
    title: "Development"
    description: "Developer resources and API documentation"
    icon: "💻"
    
  api:
    title: "API Reference"
    description: "Complete API documentation and references"
    icon: "🔌"
    
  security:
    title: "Security"
    description: "Security guidelines and best practices"
    icon: "🔒"
    
  architecture:
    title: "Architecture"
    description: "System architecture and design documents"
    icon: "🏗️"
    
  contribute:
    title: "How to Contribute"
    description: "Guidelines for contributing to KNIRV Network"
    icon: "🤝"
    
  legal:
    title: "Legal Documents"
    description: "Terms, privacy policy, and legal information"
    icon: "⚖️"

# Component-specific Documentation
components:
  knirvchain:
    title: "KNIRVCHAIN Documentation"
    description: "Blockchain layer documentation"
    icon: "⛓️"
    
  knirvgraph:
    title: "KNIRVGRAPH Documentation"
    description: "Graph database and analytics"
    icon: "📊"
    
  knirvnexus:
    title: "KNIRVNEXUS Documentation"
    description: "Development environment and tools"
    icon: "🔧"
    
  knirvoracle:
    title: "KNIRVORACLE Documentation"
    description: "Oracle network and consensus"
    icon: "🔮"
    
  knirvrouter:
    title: "KNIRVROUTER Documentation"
    description: "Network routing and communication"
    icon: "🌐"
    
  knirvsdk:
    title: "KNIRVSDK Documentation"
    description: "Software development kit"
    icon: "🛠️"
    
  knirvcortex:
    title: "KNIRVCORTEX Documentation"
    description: "AI and machine learning components"
    icon: "🧠"
    
  knirvengine:
    title: "KNIRVENGINE Documentation"
    description: "Core execution engine"
    icon: "⚙️"

# Whitepaper Configuration
whitepapers:
  title: "Technical Whitepapers"
  description: "In-depth technical specifications for all KNIRV Network components"
  icon: "📄"
  categories:
    core:
      title: "Core Components"
      papers:
        - "KNIRV-D-TEN_Whitepaper"
        - "KNIRV-ORACLE_Whitepaper"
        - "KNIRV-ROUTER_Whitepaper"
        - "KNIRV-CHAIN_Whitepaper"
    
    development:
      title: "Development Tools"
      papers:
        - "KNIRV-SDK_Whitepaper"
        - "KNIRV-NEXUS_Whitepaper"
        - "KNIRV-ENGINE_Whitepaper"
    
    applications:
      title: "Applications & Interfaces"
      papers:
        - "KNIRV-GATEWAY_Whitepaper"
        - "KNIRV-CORTEX_Whitepaper"
        - "KNIRVANA_Whitepaper"

# Footer Configuration
footer:
  legal_links:
    terms: "../documentation/legal/TERMS_AND_CONDITIONS.html"
    privacy: "../documentation/legal/PRIVACY_POLICY.html"
    code_of_conduct: "../documentation/legal/CODE_OF_CONDUCT.html"
  
  social_links:
    github: "https://github.com/knirv-network"
    discord: "https://discord.gg/knirv"
    twitter: "https://twitter.com/knirvnetwork"
    telegram: "https://t.me/knirvnetwork"
  
  resource_links:
    main_site: "../../index.html"
    developer_portal: "../agent-developer-portal/"
    support: "../support-desk/src/"
    blog: "https://blog.knirv.com"

# Search Configuration
search:
  enabled: true
  placeholder: "Search documentation..."
  categories_searchable: true
  whitepapers_searchable: true

# UI Theme Configuration
theme:
  primary_color: "#00c0fa"
  secondary_color: "#2b56f5"
  accent_color: "#8b5cf6"
  background_color: "#0a0a0a"
  surface_color: "#1a1a2e"
  text_color: "#e0e0e0"
  
# Feature Flags
features:
  breadcrumbs: true
  table_of_contents: true
  print_friendly: true
  dark_mode_toggle: false  # Always dark mode
  copy_code_buttons: true
  search_highlighting: true

# Analytics (if needed)
analytics:
  enabled: false
  google_analytics_id: ""
  
# SEO Configuration
seo:
  site_name: "KNIRV Network Documentation"
  default_description: "Comprehensive documentation for the KNIRV Decentralized Trusted Execution Network (D-TEN)"
  keywords: "KNIRV, blockchain, decentralized, trusted execution, documentation, D-TEN"
  author: "KNIRV Network"
