<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNIRV 90-Day Go-To-Market Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Source Sans Pro', sans-serif;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            aspect-ratio: 16/9;
            max-width: 100vw;
            max-height: 100vh;
            position: relative;
            background: linear-gradient(135deg, rgba(25, 25, 112, 0.85), rgba(102, 51, 153, 0.85));
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        /* Ensure 16:9 aspect ratio on all screen sizes */
        @media (max-aspect-ratio: 16/9) {
            .slide {
                width: calc(100vh * 16/9);
                height: 100vh;
                margin: 0 auto;
            }
        }

        @media (min-aspect-ratio: 16/9) {
            .slide {
                width: 100vw;
                height: calc(100vw * 9/16);
                margin: auto 0;
            }
        }
        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25;
            z-index: -1;
        }
        .content {
            width: 80%;
            max-width: 90vw;
            z-index: 2;
            padding: 2vh 2vw;
        }
        .title {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 700;
            margin-bottom: 2vh;
            line-height: 1.2;
        }
        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 400;
            margin-bottom: 4vh;
            opacity: 0.9;
            line-height: 1.4;
        }
        .logo-placeholder {
            position: absolute;
            bottom: 3vh;
            left: 4vw;
            font-size: clamp(1rem, 2vw, 1.2rem);
            display: flex;
            align-items: center;
        }
        .logo-placeholder i {
            margin-right: 0.5rem;
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
        }
        .date {
            position: absolute;
            bottom: 3vh;
            right: 4vw;
            font-size: clamp(1rem, 2vw, 1.2rem);
        }
    </style>
</head>
<body>
    <div class="slide">
        <img src="https://sfile.chatglm.cn/images-ppt/f2cc99fb2009.png" alt="AI Agent Technology Network" class="background-image">
        <div class="content">
            <h1 class="title">KNIRV 90-Day Go-To-Market Plan</h1>
            <h2 class="subtitle">From Infrastructure to Services: Fast Revenue While Building the Future</h2>
        </div>
        <div class="logo-placeholder">
            <i class="material-icons">business</i>
            KNIRV Network
        </div>
        <div class="date">August 2025</div>
    </div>
</body>
</html>
