openapi: 3.0.3
info:
  title: KNIRVENGINE API v1
  description: |
    Standardized REST API for the KNIRVENGINE platform.
    All endpoints follow consistent response patterns with standardized JSON structure.
  version: 1.0.0
  contact:
    name: KNIRVENGINE Team
    url: https://github.com/guiperry/KNIRV-Engine

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.knirv-engine.com/api/v1
    description: Production server

components:
  schemas:
    StandardResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates if the operation was successful
        data:
          type: object
          description: Response data (varies by endpoint)
        message:
          type: string
          description: Human-readable message
        error:
          type: string
          description: Error message (only present when success is false)
        code:
          type: string
          description: Error code (only present when success is false)
      required:
        - success
        - message

    Agent:
      type: object
      properties:
        id:
          type: string
          description: Unique agent identifier
        owner_id:
          type: integer
          format: int64
          description: ID of the agent owner
        name:
          type: string
          description: Agent name
        type:
          type: string
          description: Agent type (e.g., llm, wasm, plugin)
        config:
          type: string
          description: JSON-encoded agent configuration
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp

    AgentConfig:
      type: object
      properties:
        collection:
          type: string
          description: Agent collection name
        image_url:
          type: string
          description: Agent avatar image URL
        capabilities:
          type: array
          items:
            type: string
          description: List of agent capabilities
        target_types:
          type: array
          items:
            type: string
          description: List of supported target types
        status:
          type: string
          enum: [idle, active, busy, error]
          description: Current agent status

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error description

paths:
  /agents:
    get:
      summary: List all agents
      description: Retrieve a list of all agents in the system
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'
                      total:
                        type: integer
                        description: Total number of agents

    post:
      summary: Create a new agent
      description: Create a new agent in the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Agent name
                type:
                  type: string
                  description: Agent type
                config:
                  $ref: '#/components/schemas/AgentConfig'
              required:
                - name
                - type
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

  /agents/{id}:
    get:
      summary: Get agent by ID
      description: Retrieve a specific agent by its ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update agent
      description: Update an existing agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
                config:
                  $ref: '#/components/schemas/AgentConfig'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

    delete:
      summary: Delete agent
      description: Delete an agent from the system
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Agent deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          agent_id:
                            type: string

  /agents/{id}/stop:
    post:
      summary: Stop agent
      description: Stop a running agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Agent stopped successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          agent_id:
                            type: string

  /agents/discover:
    get:
      summary: Discover agents
      description: Discover all available agents in the system
      responses:
        '200':
          description: Agents discovered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'

  /agents/{id}/activate:
    post:
      summary: Activate agent
      description: Activate an agent to make it available for use
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Agent activated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

  /agents/{id}/deactivate:
    post:
      summary: Deactivate agent
      description: Deactivate an agent to make it unavailable
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Agent deactivated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

  /agents/{id}/config:
    get:
      summary: Get agent configuration
      description: Retrieve the configuration of a specific agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      responses:
        '200':
          description: Agent config retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentConfig'

    put:
      summary: Update agent configuration
      description: Update the configuration of a specific agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Agent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfig'
      responses:
        '200':
          description: Agent config updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AgentConfig'

  /agents/by-type/{type}:
    get:
      summary: Get agents by type
      description: Retrieve all agents of a specific type
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          description: Agent type
      responses:
        '200':
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'

  /agents/by-status/{status}:
    get:
      summary: Get agents by status
      description: Retrieve all agents with a specific status
      parameters:
        - name: status
          in: path
          required: true
          schema:
            type: string
            enum: [idle, active, busy, error]
          description: Agent status
      responses:
        '200':
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'

  /agents/by-build-target/{target}:
    get:
      summary: Get agents by build target
      description: Retrieve all agents that support a specific build target
      parameters:
        - name: target
          in: path
          required: true
          schema:
            type: string
          description: Build target (e.g., wasm, plugin, native)
      responses:
        '200':
          description: Agents retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'

  /agents/register:
    post:
      summary: Register agent
      description: Register a new agent with the system
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                name:
                  type: string
                type:
                  type: string
                config:
                  $ref: '#/components/schemas/AgentConfig'
                owner_id:
                  type: integer
                  format: int64
              required:
                - id
                - name
                - type
      responses:
        '201':
          description: Agent registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Agent'

  /agents/search:
    get:
      summary: Search agents
      description: Search for agents by name or type
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Search query
      responses:
        '200':
          description: Search completed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/StandardResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Agent'
