openapi: 3.1.0
info:
  title: KNIRV Unified API
  description: |
    Unified API specification for the KNIRV Network ecosystem, combining:
    - KNIRVORACLE MCP API: Blockchain operations and Model Context Protocol
    - Agentify API: Agent configuration and deployment platform
    
    This unified specification serves as the source of truth for all KNIRV SDK implementations
    and CLI tools. Wallet operations are primarily handled client-side via the SDK.
  version: "2.0.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com
    url: https://github.com/cloud-equities/KNIRV_NETWORK/tree/main/docs

servers:
  - url: http://localhost:5000
    description: Local KNIRVORACLE development server
  - url: http://localhost:3000/api
    description: Local Agentify development server
  - url: https://api.knirv.network/v1
    description: Production KNIRV API Gateway
  - url: https://api-staging.knirv.network/v1
    description: Staging KNIRV API Gateway

tags:
  # KNIRVORACLE MCP API Tags
  - name: blockchain
    description: Blockchain operations and state management
  - name: node
    description: Node information and management
  - name: uri
    description: URI generation and management
  - name: mcp
    description: Distributed Model Context Protocol operations
  
  # Agentify API Tags
  - name: agents
    description: Agent configuration and lifecycle management
  - name: tools
    description: Agent tools and capabilities management
  - name: compilation
    description: Agent compilation and deployment
  - name: testing
    description: Agent and tool testing operations
  - name: credentials
    description: Credential and authentication management
  - name: subagents
    description: Subagent management and orchestration

paths:
  # ========================================
  # KNIRVORACLE MCP API ENDPOINTS
  # ========================================
  
  # Blockchain Server Endpoints
  /chain:
    get:
      tags:
        - blockchain
      summary: Get blockchain state
      description: Retrieves the current state of the blockchain including blocks, transaction pool, and reflections
      operationId: getChain
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializableBlockchain'
        '500':
          description: Internal server error

  /block:
    post:
      tags:
        - blockchain
      summary: Submit a new block
      description: Submits a new block to the blockchain
      operationId: writeBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Block'
      responses:
        '200':
          description: Block successfully added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid block data
        '500':
          description: Internal server error

  /transaction:
    post:
      tags:
        - blockchain
        - mcp
      summary: Submit a Signed Transaction
      description: |
        Submits a pre-signed transaction to the blockchain network.
        This endpoint is used for various transaction types, including
        standard transfers and MCP operations like capability registration,
        invocation, or updates.
      operationId: writeTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '202':
          description: Transaction accepted by the node and broadcasted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  message:
                    type: string
                    example: "Transaction submitted to mempool"
        '400':
          description: Invalid transaction data
        '500':
          description: Internal server error

  /txn_pool:
    get:
      tags:
        - blockchain
      summary: Get transaction pool
      description: Retrieves the current transaction pool
      operationId: getTransactionPool
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '500':
          description: Internal server error

  /info:
    get:
      tags:
        - node
      summary: Get server information
      description: Retrieves information about the blockchain node
      operationId: getServerInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInfo'
        '500':
          description: Internal server error

  /health:
    get:
      tags:
        - node
      summary: Check node health
      description: Checks the health status of the blockchain node
      operationId: healthCheck
      responses:
        '200':
          description: Node is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Node is unhealthy

  /ping:
    get:
      tags:
        - node
      summary: Ping node
      description: Simple ping endpoint to check if the node is responsive
      operationId: ping
      responses:
        '200':
          description: Pong response
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /devs:
    get:
      tags:
        - node
      summary: Get connected devs
      description: Retrieves the list of connected devs
      operationId: getPeers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerList'
        '500':
          description: Internal server error

  /uriGenerator:
    post:
      tags:
        - uri
      summary: Generate and announce URI
      description: Generates a new URI and announces it to the network
      operationId: generateAndAnnounceURI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/URIGenerationRequest'
      responses:
        '200':
          description: URI successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URIGenerationResponse'
        '400':
          description: Invalid request data
        '500':
          description: Internal server error

  # MCP Capability Management
  /mcp/capability/prepare_registration:
    post:
      tags:
        - mcp
      summary: Prepare data for capability registration transaction
      description: |
        Allows a client to get the necessary data that needs to be signed
        to register a new MCP capability. The client signs this data locally
        and then submits the complete, signed transaction via /transaction.
      operationId: mcpPrepareCapabilityRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPPrepareCapabilityRegistrationRequest'
      responses:
        '200':
          description: Data for signing successfully prepared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPPrepareCapabilityRegistrationResponse'
        '400':
          description: Invalid request data
        '409':
          description: Capability already exists or pending
        '500':
          description: Internal server error

  /mcp/capability/invoke:
    post:
      tags:
        - mcp
      summary: Invoke a Capability
      description: |
        Submits a pre-signed transaction to invoke an existing capability.
        The Transaction.data should contain MCPInvokeCapabilityData.
      operationId: mcpInvokeCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInvokeCapabilityRequestWrapper'
      responses:
        '202':
          description: Capability invocation transaction accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  contextID:
                    type: string
                  message:
                    type: string
                    example: "Capability invocation submitted"
        '400':
          description: Invalid request data
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/capability/update:
    post:
      tags:
        - mcp
      summary: Update a Capability
      description: |
        Submits a pre-signed transaction to update an existing capability.
        The sender must be the owner of the capability.
      operationId: mcpUpdateCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPUpdateCapabilityRequestWrapper'
      responses:
        '202':
          description: Capability update transaction accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  message:
                    type: string
                    example: "Capability update submitted"
        '400':
          description: Invalid update request
        '403':
          description: Forbidden - not capability owner
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/capability/{capability_id}:
    get:
      tags:
        - mcp
      summary: Get capability
      description: Retrieves a specific capability by ID
      operationId: mcpGetCapability
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the capability to retrieve
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDescriptor'
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/capabilities:
    get:
      tags:
        - mcp
      summary: List capabilities
      description: Lists all registered capabilities
      operationId: mcpListCapabilities
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [RESOURCE, TOOL, PROMPT, MEMORY_SERVICE]
          description: Filter by capability type
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: Filter by owner address
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityDescriptor'
        '500':
          description: Internal server error

  # ========================================
  # AGENTIFY API ENDPOINTS
  # ========================================
  
  /agents:
    get:
      summary: List all agents
      description: Returns a list of all agent configurations
      operationId: listAgents
      tags:
        - agents
      responses:
        '200':
          description: A list of agent configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentSummary'
    post:
      summary: Create a new agent
      description: Creates a new agent configuration
      operationId: createAgent
      tags:
        - agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPluginConfig'
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPluginConfig'
        '400':
          description: Invalid agent configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # Common Error Schema
    Error:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string

    # KNIRVORACLE MCP API Schemas (truncated for space)
    SerializableBlockchain:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        transaction_pool:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        chain_address:
          type: string
        reflections:
          type: object
          additionalProperties:
            type: boolean
        chain_id:
          type: string

    Block:
      type: object
      properties:
        block_number:
          type: integer
          format: uint64
        prevHash:
          type: string
          format: byte
        timestamp:
          type: integer
          format: int64
        nonce:
          type: integer
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        hash:
          type: string
          format: byte
        proposer_address:
          type: string

    Transaction:
      type: object
      required:
        - version
        - id
        - timestamp
        - from
        - fee
        - type
        - signature
        - public_key
      properties:
        version:
          type: integer
          example: 1
        id:
          type: string
          description: Transaction hash/ID
        timestamp:
          type: integer
          format: int64
        from:
          type: string
          description: Sender address
        to:
          type: string
          nullable: true
          description: Recipient address
        value:
          type: string
          description: Amount of NRN transferred
        data:
          type: object
          additionalProperties: true
          description: Transaction payload
        status:
          type: string
          description: Transaction status
        transaction_hash:
          type: string
        public_key:
          type: string
        signature:
          type: string
          format: byte
        fee:
          type: string
        type:
          type: string

    # Agentify API Schemas (basic structure)
    AgentSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, inactive, deploying, error]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AgentPluginConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        config:
          type: object
          additionalProperties: true
        tools:
          type: array
          items:
            type: object
        capabilities:
          type: array
          items:
            type: string

    # Additional KNIRVORACLE MCP API Schemas
    NodeInfo:
      type: object
      properties:
        node_id:
          type: string
        version:
          type: string
        chain_height:
          type: integer
        dev_count:
          type: integer
        is_mining:
          type: boolean
        wallet_address:
          type: string
        uptime:
          type: integer
          format: int64

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        blockchain:
          type: boolean
        network:
          type: boolean
        database:
          type: boolean
        message:
          type: string

    PeerInfo:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        connected_since:
          type: integer
          format: int64

    PeerList:
      type: array
      items:
        $ref: '#/components/schemas/PeerInfo'

    URIGenerationRequest:
      type: object
      properties:
        resource_type:
          type: string
        content_hash:
          type: string
        owner:
          type: string
        metadata:
          type: object
          additionalProperties: true

    URIGenerationResponse:
      type: object
      properties:
        uri:
          type: string
        resource_id:
          type: string
        success:
          type: boolean
        message:
          type: string

    BaseDescriptor:
      type: object
      properties:
        id:
          type: string
        capabilityType:
          type: string
          enum: [RESOURCE, TOOL, PROMPT, MEMORY_SERVICE]
        name:
          type: string
        owner:
          type: string
        version:
          type: string
        description:
          type: string
        gasFeeNRN:
          type: integer
          format: uint64
        timestamp:
          type: integer
          format: int64
        customMetadata:
          type: object
          additionalProperties: true

    ResourceDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - resourceType
            - contentHash
          properties:
            resourceType:
              type: string
              enum: [FILE, API, PLUGIN, GENERATED_DOCUMENT, DATASET, MODEL_ARTIFACT, SERVICE]
            contentHash:
              type: string
            schema:
              $ref: '#/components/schemas/PluginSchemaDetail'

    PluginSchemaDetail:
      type: object
      properties:
        summary:
          type: string
        accessInfo:
          type: object
          additionalProperties: true
        locationHints:
          type: array
          items:
            type: string
        manifestFile:
          type: string
        executableFile:
          type: string
        outputDirectoryHint:
          type: string

    ToolDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - inputSchemaJSON
            - executionPointer
          properties:
            inputSchemaJSON:
              type: string
            outputSchemaJSON:
              type: string
            executionPointer:
              type: string

    PromptDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - template
            - parametersSchemaJSON
          properties:
            template:
              type: string
            parametersSchemaJSON:
              type: string

    MemoryServiceDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - graphSchema
          properties:
            graphSchema:
              type: string

    CapabilityDescriptor:
      oneOf:
        - $ref: '#/components/schemas/ResourceDescriptor'
        - $ref: '#/components/schemas/ToolDescriptor'
        - $ref: '#/components/schemas/PromptDescriptor'
        - $ref: '#/components/schemas/MemoryServiceDescriptor'
      discriminator:
        propertyName: capabilityType
        mapping:
          RESOURCE: '#/components/schemas/ResourceDescriptor'
          TOOL: '#/components/schemas/ToolDescriptor'
          PROMPT: '#/components/schemas/PromptDescriptor'
          MEMORY_SERVICE: '#/components/schemas/MemoryServiceDescriptor'

    MCPPrepareCapabilityRegistrationRequest:
      type: object
      required:
        - ownerAddress
        - capabilityDescriptor
        - fee
      properties:
        ownerAddress:
          type: string
        capabilityDescriptor:
          $ref: '#/components/schemas/CapabilityDescriptor'
        message:
          type: string
        fee:
          type: integer
          format: uint64

    MCPPrepareCapabilityRegistrationResponse:
      type: object
      required:
        - pendingTransactionHash
        - unsignedTransaction
      properties:
        pendingTransactionHash:
          type: string
        unsignedTransaction:
          $ref: '#/components/schemas/UnsignedTransactionDetails'

    MCPInvokeCapabilityRequestWrapper:
      type: object
      required:
        - signedTransaction
      properties:
        signedTransaction:
          $ref: '#/components/schemas/Transaction'

    MCPInvokeCapabilityData:
      type: object
      required:
        - contextRecord
      properties:
        contextRecord:
          $ref: '#/components/schemas/ContextRecord'

    MCPUpdateCapabilityRequestWrapper:
      type: object
      required:
        - signedTransaction
      properties:
        signedTransaction:
          $ref: '#/components/schemas/Transaction'

    MCPUpdateCapabilityData:
      type: object
      required:
        - capabilityID
        - updatedDescriptor
      properties:
        capability_id:
          type: string
        updatedDescriptor:
          $ref: '#/components/schemas/CapabilityDescriptor'

    UnsignedTransactionDetails:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
          nullable: true
        value:
          type: string
          example: "0"
        data:
          type: string
          format: base64
        timestamp:
          type: integer
          format: int64
        fee:
          type: string
        type:
          type: string
          example: "MCP_REGISTER_CAPABILITY"
        unsignedTransactionPayloadHash:
          type: string

    ContextRecord:
      type: object
      properties:
        id:
          type: string
        capabilityID:
          type: string
        interactionType:
          type: string
          enum: [CAPABILITY_REGISTRATION, CAPABILITY_INVOCATION, CAPABILITY_UPDATE, GENERAL_MESSAGE, TOOL_INVOCATION, PROMPT_USAGE, RESOURCE_ACCESS, PLUGIN_EXECUTION, SAMPLING_REQUEST_SENT, SAMPLING_RESPONSE_RECEIVED, MEMORY_WRITE]
        initiator:
          type: string
        timestamp:
          type: integer
          format: int64
        inputHash:
          type: string
        outputHash:
          type: string
        details:
          type: object
          additionalProperties: true
        signature:
          type: string
          format: byte
        status:
          type: string
          enum: [pending, success, failed, processing]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
