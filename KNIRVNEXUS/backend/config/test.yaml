# KNIRV-NEXUS Test Configuration

# Server settings
host: "127.0.0.1"
port: 8080
database_path: ":memory:"
serve_frontend: false
log_level: "debug"

# API Configuration
api:
  port: 8080
  host: "127.0.0.1"
  enable_cors: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
  jwt_secret: "test-jwt-secret-key-for-testing-only"
  rate_limit_rps: 1000
  request_timeout: "10s"

# Host Controller Configuration
host_controller:
  enable_monitoring: false
  monitoring_interval: "1s"
  enable_p2p: false
  p2p_port: 4001
  enable_tee: false
  tee_type: "none"
  container_runtime: "podman"
  enable_security_monitoring: false

# Data Engine Configuration
data_engine:
  retention_days: 1
  max_events_per_collection: 1000
  enable_compression: false
  backup_interval: "1h"
  backup_retention: 1

# Model Server Configuration
model_server:
  max_models: 10
  model_timeout: "30s"
  enable_isolation: false
  resource_limits:
    max_cpu_per_model: 0.5
    max_memory_per_model: 128000000  # 128MB
    max_disk_per_model: 536870912    # 512MB
  health_check_interval: "5s"

# Inference Service Configuration
inference:
  max_concurrent_requests: 5
  request_timeout: "10s"
  model_cache_size: 2
  enable_fine_tuning: false
  fine_tuning_config:
    max_concurrent_jobs: 1
    default_epochs: 1
    learning_rate: 0.001
    batch_size: 4

# CDE (Cloud Development Environment) Configuration
cde:
  base_image_path: "/tmp/test-images"
  workspace_root: "/tmp/test-workspaces"
  max_environments: 5
  default_timeout: "5m"
  max_cpu_per_env: 0.5
  max_memory_per_env: 536870912     # 512MB
  max_disk_per_env: 1073741824      # 1GB
  enable_sandboxing: false
  enable_network_isolation: false
  allowed_ports:
    - 8080
    - 3000
  session_timeout: "10m"
  max_sessions_per_user: 2
  max_projects_per_user: 5
  project_storage_path: "/tmp/test-projects"

# Authentication Configuration
auth:
  password_min_length: 6
  password_require_upper: false
  password_require_lower: false
  password_require_digit: false
  password_require_special: false
  token_expiration: "1h"
  refresh_token_expiration: "24h"
  max_login_attempts: 10
  lockout_duration: "1m"
  session_timeout: "30m"
  enable_two_factor: false

# Logging Configuration
logging:
  level: "debug"
  format: "text"
  output: "stdout"
  file: ""
  max_size: 10
  max_backups: 1
  max_age: 1
  compress: false

# Security Configuration
security:
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""
  enable_rate_limiting: false
  rate_limit_requests_per_minute: 1000
  enable_request_logging: true
  enable_security_headers: true

# Monitoring Configuration
monitoring:
  enable_metrics: false
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval: "5s"
  enable_alerts: false
  alert_webhook_url: ""

# Development Configuration
development:
  enable_debug: true
  enable_profiling: false
  profiling_port: 6060
  enable_hot_reload: false
  mock_external_services: true

# Test-specific Configuration
test:
  enable_test_mode: true
  test_data_path: "/tmp/test-data"
  cleanup_after_tests: true
  parallel_tests: true
  test_timeout: "30s"
