# KNIRV-NEXUS Production Configuration
# This is the consolidated production configuration file for KNIRV-NEXUS
# All data directories default to ~/.local/share/knirvnexus/backend_server (XDG Base Directory)

# Operational Mode
mode: headless  # headless | gui
environment: production  # production | development | staging
chain_id: knirv-nexus-mainnet
node_role: dve-manager
testnet: false

# Service Configuration (wrapper frontend)
service:
  host: "0.0.0.0"
  port: 8081
  bind_address: "0.0.0.0"
  name: "dve-manager"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8082
  address: "0.0.0.0"
  bind_address: "0.0.0.0"
  enable_cors: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "http://localhost:8082"
    - "http://localhost:8081"
    - "http://localhost:8082"
    - "https://nexus.knirv.com"
  jwt_secret: "${KNIRV_JWT_SECRET:your-jwt-secret-key-change-this-in-production}"
  rate_limit_rps: 100
  request_timeout: "30s"
  serve_frontend: true

# GUI Mode Configuration
gui:
  enabled: false
  port: 9080
  frontend_path: "./dist"  # Path to built Next.js frontend
  bind_address: "127.0.0.1"

# Database Configuration
database:
  path: ~/.local/share/knirvnexus/backend_server/data/nexus.db

# Security Configuration
security:
  auth_required: false  # false for testnet, true for production
  tls_enabled: false    # false for development, true for production
  tls_cert_file: ""
  tls_key_file: ""
  audit_logging: true
  jwt_secret: "${KNIRV_JWT_SECRET:testnet-jwt-secret-change-this-in-production}"
  enable_rate_limiting: true
  rate_limit_requests_per_minute: 60
  enable_request_logging: true
  enable_security_headers: true

# Authentication Configuration
auth:
  jwt_secret: "${KNIRV_JWT_SECRET}"
  token_expiry: "24h"
  refresh_token_expiry: "168h"  # 7 days
  enable_oauth: false
  oauth_providers: []
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_digit: true
  password_require_special: false
  max_login_attempts: 5
  lockout_duration: "15m"
  session_timeout: "30m"
  enable_two_factor: false

# User Roles and Permissions
roles:
  validator:
    permissions:
      - "node:read"
      - "node:update"
      - "tasks:read"
      - "results:read"
    scoped_access: true  # Only assigned nodes
  admin:
    permissions:
      - "*:*"  # Full access
    scoped_access: false
  observer:
    permissions:
      - "*:read"
    scoped_access: false

# Network Configuration
network:
  chain_id: "knirv-nexus-mainnet"
  p2p_port: 4001
  discovery_enabled: true

# P2P Configuration
p2p:
  port: 4001
  bootstraps: []

# Host Controller Configuration
host_controller:
  enable_monitoring: true
  monitoring_interval: "30s"
  enable_p2p: true
  p2p_port: 4001
  enable_tee: false
  tee_type: "none"
  container_runtime: "podman"
  enable_security_monitoring: true

# Validation Configuration
validation:
  timeout: "30s"
  max_concurrent: 10
  enable_tee: false

# TEE (Trusted Execution Environment) Configuration
tee:
  type: "software"  # sgx | sev-snp | tdx | software
  sgx:
    enclave_file: ""
    spid_file: ""
    ias_url: ""
  sev:
    policy_file: ""
    cert_chain: ""
  tdx:
    td_report_file: ""
    quote_file: ""
  software:
    enable_attestation: false
    key_file: ""

# Data Engine Configuration
data_engine:
  retention_days: 30
  max_events_per_collection: 10000
  enable_compression: true
  backup_interval: "24h"
  backup_retention: 7

# Model Server Configuration
model_server:
  max_models: 100
  model_timeout: "5m"
  enable_isolation: true
  resource_limits:
    max_cpu_per_model: 1.0
    max_memory_per_model: 512000000  # 512MB
    max_disk_per_model: 1073741824   # 1GB
  health_check_interval: "30s"

# Inference Service Configuration
inference:
  max_concurrent_requests: 10
  request_timeout: "30s"
  model_cache_size: 5
  enable_fine_tuning: true
  fine_tuning_config:
    max_concurrent_jobs: 2
    default_epochs: 3
    learning_rate: 0.0001
    batch_size: 8

# Cloud Development Environment (CDE) Configuration
cde:
  base_image_path: "~/.local/share/knirvnexus/backend_server/images"
  workspace_root: "~/.local/share/knirvnexus/backend_server/workspaces"
  max_environments: 50
  default_timeout: "1h"
  max_cpu_per_env: 2.0
  max_memory_per_env: 2147483648    # 2GB
  max_disk_per_env: 10737418240     # 10GB
  enable_sandboxing: true
  enable_network_isolation: false
  allowed_ports:
    - 8082
    - 3000
    - 5000
  session_timeout: "2h"
  max_sessions_per_user: 5
  max_projects_per_user: 20
  project_storage_path: "~/.local/share/knirvnexus/backend_server/projects"

# Reports Configuration
reports:
  storage_path: "~/.local/share/knirvnexus/backend_server/reports"
  max_file_size: 104857600  # 100MB
  retention_days: 30
  enable_sharing: true
  enable_scheduling: true

# Logging Configuration
logging:
  level: "info"  # debug | info | warn | error
  format: "json"
  output: "../logs/server.log"  # Unified log file in project root logs directory
  file: "../logs/server.log"
  max_size: 100    # MB
  max_backups: 5
  max_age: 30      # days
  compress: true

log:
  level: "info"
  format: "json"
  output: "../logs/server.log"  # Unified log file in project root logs directory

# Monitoring Configuration
monitoring:
  enable_metrics: true
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval: "30s"
  enable_alerts: true
  alert_webhook_url: ""

# Development Configuration
development:
  enable_debug: false
  enable_profiling: false
  profiling_port: 6060
  enable_hot_reload: false
  mock_external_services: false

# Production Configuration
production:
  enable_clustering: false
  cluster_nodes: []
  enable_load_balancing: false
  enable_auto_scaling: false
  min_replicas: 1
  max_replicas: 10

# DVE (Decentralized Validation Environment) Configuration
dve:
  discovery:
    enabled: true
    # Bootstrap nodes for remote DVE instance discovery
    bootstrap_nodes:
      # - "http://dve1.example.com:8082"
      # - "http://dve2.example.com:8082"
    discovery_interval: "30s"
    connection_timeout: "5s"
    health_check_interval: "60s"
    heartbeat_timeout: "2m"
    max_retries: 3
    retry_backoff_duration: "2s"
    connection_pool_size: 10