---
# KNIRV-NEXUS AWS Infrastructure Deployment Playbook
- name: Deploy KNIRV-NEXUS Infrastructure on AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    # AWS Configuration
    aws_region: "{{ aws_region | default('us-east-1') }}"
    aws_profile: "{{ aws_profile | default('default') }}"
    
    # Project Configuration
    project_name: "knirv-nexus"
    environment: "{{ env | default('production') }}"
    
    # VPC Configuration
    vpc_cidr: "10.0.0.0/16"
    public_subnet_cidr: "10.0.1.0/24"
    private_subnet_cidr: "10.0.2.0/24"
    
    # EC2 Configuration
    instance_type: "{{ instance_type | default('t3.medium') }}"
    key_name: "{{ key_name | default('knirv-nexus-key') }}"
    ami_id: "{{ ami_id | default('ami-0c02fb55956c7d316') }}"  # Amazon Linux 2
    
    # Security Configuration
    allowed_ssh_cidr: "{{ allowed_ssh_cidr | default('0.0.0.0/0') }}"
    allowed_http_cidr: "{{ allowed_http_cidr | default('0.0.0.0/0') }}"
    
    # Tags
    common_tags:
      Project: "{{ project_name }}"
      Environment: "{{ environment }}"
      ManagedBy: "Ansible"
      CreatedBy: "{{ ansible_user_id }}"
      CreatedAt: "{{ ansible_date_time.iso8601 }}"

  tasks:
    - name: Create VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ project_name }}-{{ environment }}-vpc"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        state: present
        tags: "{{ common_tags }}"
      register: vpc

    - name: Create Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        state: present
        tags:
          Name: "{{ project_name }}-{{ environment }}-igw"
        tags: "{{ common_tags }}"
      register: igw

    - name: Create Public Subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ public_subnet_cidr }}"
        region: "{{ aws_region }}"
        az: "{{ aws_region }}a"
        map_public: true
        state: present
        tags:
          Name: "{{ project_name }}-{{ environment }}-public-subnet"
        tags: "{{ common_tags }}"
      register: public_subnet

    - name: Create Private Subnet
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc.vpc.id }}"
        cidr: "{{ private_subnet_cidr }}"
        region: "{{ aws_region }}"
        az: "{{ aws_region }}b"
        map_public: false
        state: present
        tags:
          Name: "{{ project_name }}-{{ environment }}-private-subnet"
        tags: "{{ common_tags }}"
      register: private_subnet

    - name: Create Route Table for Public Subnet
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw.gateway_id }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        tags:
          Name: "{{ project_name }}-{{ environment }}-public-rt"
        tags: "{{ common_tags }}"

    - name: Create NAT Gateway
      amazon.aws.ec2_vpc_nat_gateway:
        subnet_id: "{{ public_subnet.subnet.id }}"
        region: "{{ aws_region }}"
        state: present
        wait: true
        wait_timeout: 600
        tags:
          Name: "{{ project_name }}-{{ environment }}-nat-gw"
        tags: "{{ common_tags }}"
      register: nat_gateway

    - name: Create Route Table for Private Subnet
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ nat_gateway.nat_gateway_id }}"
        subnets:
          - "{{ private_subnet.subnet.id }}"
        tags:
          Name: "{{ project_name }}-{{ environment }}-private-rt"
        tags: "{{ common_tags }}"

    - name: Create Security Group for Web Servers
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-{{ environment }}-web-sg"
        description: "Security group for KNIRV-NEXUS web servers"
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports:
              - 22
            cidr_ip: "{{ allowed_ssh_cidr }}"
            rule_desc: "SSH access"
          - proto: tcp
            ports:
              - 80
            cidr_ip: "{{ allowed_http_cidr }}"
            rule_desc: "HTTP access"
          - proto: tcp
            ports:
              - 443
            cidr_ip: "{{ allowed_http_cidr }}"
            rule_desc: "HTTPS access"
          - proto: tcp
            ports:
              - 8082
            cidr_ip: "{{ allowed_http_cidr }}"
            rule_desc: "Application access"
          - proto: tcp
            ports:
              - 4001
            cidr_ip: "{{ vpc_cidr }}"
            rule_desc: "P2P communication"
        rules_egress:
          - proto: all
            cidr_ip: "0.0.0.0/0"
            rule_desc: "All outbound traffic"
        tags: "{{ common_tags }}"
      register: web_sg

    - name: Create Security Group for Database
      amazon.aws.ec2_security_group:
        name: "{{ project_name }}-{{ environment }}-db-sg"
        description: "Security group for KNIRV-NEXUS database"
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports:
              - 5432
            group_id: "{{ web_sg.group_id }}"
            rule_desc: "PostgreSQL access from web servers"
          - proto: tcp
            ports:
              - 6379
            group_id: "{{ web_sg.group_id }}"
            rule_desc: "Redis access from web servers"
        rules_egress:
          - proto: all
            cidr_ip: "0.0.0.0/0"
            rule_desc: "All outbound traffic"
        tags: "{{ common_tags }}"
      register: db_sg

    - name: Create Key Pair
      amazon.aws.ec2_key:
        name: "{{ key_name }}"
        region: "{{ aws_region }}"
        state: present
      register: key_pair

    - name: Save private key
      copy:
        content: "{{ key_pair.key.private_key }}"
        dest: "./{{ key_name }}.pem"
        mode: '0600'
      when: key_pair.key.private_key is defined

    - name: Launch KNIRV-NEXUS Main Server
      amazon.aws.ec2_instance:
        name: "{{ project_name }}-{{ environment }}-main"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ public_subnet.subnet.id }}"
        security_groups:
          - "{{ web_sg.group_id }}"
        region: "{{ aws_region }}"
        state: present
        wait: true
        wait_timeout: 600
        user_data: |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ec2-user
          
          # Install Docker Compose
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          
          # Install Go
          wget https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile
          
          # Create application directory
          mkdir -p /opt/knirv-nexus
          chown ec2-user:ec2-user /opt/knirv-nexus
        tags: "{{ common_tags | combine({'Name': project_name + '-' + environment + '-main', 'Role': 'main-server'}) }}"
      register: main_instance

    - name: Launch KNIRV-NEXUS Worker Nodes
      amazon.aws.ec2_instance:
        name: "{{ project_name }}-{{ environment }}-worker-{{ item }}"
        image_id: "{{ ami_id }}"
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ private_subnet.subnet.id }}"
        security_groups:
          - "{{ web_sg.group_id }}"
        region: "{{ aws_region }}"
        state: present
        wait: true
        wait_timeout: 600
        user_data: |
          #!/bin/bash
          yum update -y
          yum install -y docker git
          systemctl start docker
          systemctl enable docker
          usermod -a -G docker ec2-user
          
          # Install Docker Compose
          curl -L "https://github.com/docker/compose/releases/latest/download/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          chmod +x /usr/local/bin/docker-compose
          
          # Install Go
          wget https://go.dev/dl/go1.21.0.linux-amd64.tar.gz
          tar -C /usr/local -xzf go1.21.0.linux-amd64.tar.gz
          echo 'export PATH=$PATH:/usr/local/go/bin' >> /etc/profile
          
          # Create application directory
          mkdir -p /opt/knirv-nexus
          chown ec2-user:ec2-user /opt/knirv-nexus
        tags: "{{ common_tags | combine({'Name': project_name + '-' + environment + '-worker-' + item|string, 'Role': 'worker-node'}) }}"
      loop: "{{ range(1, (worker_count | default(2)) + 1) | list }}"
      register: worker_instances

    - name: Create Application Load Balancer
      amazon.aws.elb_application_lb:
        name: "{{ project_name }}-{{ environment }}-alb"
        security_groups:
          - "{{ web_sg.group_id }}"
        subnets:
          - "{{ public_subnet.subnet.id }}"
        region: "{{ aws_region }}"
        state: present
        tags: "{{ common_tags }}"
      register: alb

    - name: Create Target Group
      amazon.aws.elb_target_group:
        name: "{{ project_name }}-{{ environment }}-tg"
        protocol: http
        port: 8082
        vpc_id: "{{ vpc.vpc.id }}"
        region: "{{ aws_region }}"
        health_check_path: "/api/v1/health"
        health_check_interval: 30
        health_check_timeout: 5
        healthy_threshold_count: 2
        unhealthy_threshold_count: 3
        targets:
          - Id: "{{ main_instance.instances[0].instance_id }}"
            Port: 8082
        state: present
        tags: "{{ common_tags }}"
      register: target_group

    - name: Create ALB Listener
      amazon.aws.elb_application_lb_listener:
        load_balancer_arn: "{{ alb.load_balancer_arn }}"
        protocol: HTTP
        port: 80
        default_actions:
          - Type: forward
            TargetGroupArn: "{{ target_group.target_group_arn }}"
        region: "{{ aws_region }}"
        state: present

    - name: Output Infrastructure Information
      debug:
        msg:
          - "VPC ID: {{ vpc.vpc.id }}"
          - "Public Subnet ID: {{ public_subnet.subnet.id }}"
          - "Private Subnet ID: {{ private_subnet.subnet.id }}"
          - "Main Instance ID: {{ main_instance.instances[0].instance_id }}"
          - "Main Instance Public IP: {{ main_instance.instances[0].public_ip_address }}"
          - "Load Balancer DNS: {{ alb.dns_name }}"
          - "Key Pair: {{ key_name }}.pem"

    - name: Save Infrastructure Information
      copy:
        content: |
          # KNIRV-NEXUS Infrastructure Information
          VPC_ID={{ vpc.vpc.id }}
          PUBLIC_SUBNET_ID={{ public_subnet.subnet.id }}
          PRIVATE_SUBNET_ID={{ private_subnet.subnet.id }}
          MAIN_INSTANCE_ID={{ main_instance.instances[0].instance_id }}
          MAIN_INSTANCE_PUBLIC_IP={{ main_instance.instances[0].public_ip_address }}
          LOAD_BALANCER_DNS={{ alb.dns_name }}
          WEB_SECURITY_GROUP_ID={{ web_sg.group_id }}
          DB_SECURITY_GROUP_ID={{ db_sg.group_id }}
          KEY_NAME={{ key_name }}
        dest: "./infrastructure-{{ environment }}.env"
        mode: '0644'
