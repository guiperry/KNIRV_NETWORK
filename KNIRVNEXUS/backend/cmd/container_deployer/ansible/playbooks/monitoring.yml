---
# KNIRV-NEXUS Monitoring and Logging Setup Playbook
- name: Setup Monitoring and Logging for KNIRV-NEXUS
  hosts: main_servers
  become: true
  gather_facts: true
  vars:
    # Monitoring Configuration
    prometheus_version: "2.45.0"
    grafana_version: "10.0.0"
    node_exporter_version: "1.6.0"
    alertmanager_version: "0.25.0"
    
    # Application Configuration
    app_name: "knirv-nexus"
    app_user: "nexus"
    monitoring_user: "monitoring"
    monitoring_dir: "/opt/monitoring"
    
    # Ports
    prometheus_port: 9090
    grafana_port: 3000
    node_exporter_port: 9100
    alertmanager_port: 9093
    app_metrics_port: 9091
    
    # Retention
    prometheus_retention: "30d"
    log_retention_days: 30
    
    # Alerting
    slack_webhook_url: "{{ slack_webhook_url | default('') }}"
    alert_email: "{{ alert_email | default('admin@knirv.com') }}"

  tasks:
    - name: Create monitoring user
      user:
        name: "{{ monitoring_user }}"
        system: true
        shell: /bin/false
        home: "{{ monitoring_dir }}"
        create_home: false

    - name: Create monitoring directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ monitoring_user }}"
        group: "{{ monitoring_user }}"
        mode: '0755'
      loop:
        - "{{ monitoring_dir }}"
        - "{{ monitoring_dir }}/prometheus"
        - "{{ monitoring_dir }}/prometheus/data"
        - "{{ monitoring_dir }}/grafana"
        - "{{ monitoring_dir }}/grafana/data"
        - "{{ monitoring_dir }}/alertmanager"
        - "{{ monitoring_dir }}/alertmanager/data"
        - "{{ monitoring_dir }}/logs"
        - /var/log/knirv-nexus

    - name: Install monitoring dependencies
      package:
        name:
          - curl
          - wget
          - unzip
          - rsyslog
          - logrotate
        state: present

    # Prometheus Setup
    - name: Download Prometheus
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Prometheus
      unarchive:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Prometheus binaries
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        owner: root
        group: root
        remote_src: true
      loop:
        - prometheus
        - promtool

    - name: Create Prometheus configuration
      template:
        src: prometheus.yml.j2
        dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
        owner: "{{ monitoring_user }}"
        group: "{{ monitoring_user }}"
        mode: '0644'
      notify: restart prometheus

    - name: Create Prometheus systemd service
      template:
        src: prometheus.service.j2
        dest: /etc/systemd/system/prometheus.service
        mode: '0644'
      notify:
        - reload systemd
        - restart prometheus

    # Node Exporter Setup
    - name: Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        owner: root
        group: root
        remote_src: true

    - name: Create Node Exporter systemd service
      template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
      notify:
        - reload systemd
        - restart node_exporter

    # Alertmanager Setup
    - name: Download Alertmanager
      get_url:
        url: "https://github.com/prometheus/alertmanager/releases/download/v{{ alertmanager_version }}/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
        dest: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Alertmanager
      unarchive:
        src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Alertmanager binaries
      copy:
        src: "/tmp/alertmanager-{{ alertmanager_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: '0755'
        owner: root
        group: root
        remote_src: true
      loop:
        - alertmanager
        - amtool

    - name: Create Alertmanager configuration
      template:
        src: alertmanager.yml.j2
        dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
        owner: "{{ monitoring_user }}"
        group: "{{ monitoring_user }}"
        mode: '0644'
      notify: restart alertmanager

    - name: Create Alertmanager systemd service
      template:
        src: alertmanager.service.j2
        dest: /etc/systemd/system/alertmanager.service
        mode: '0644'
      notify:
        - reload systemd
        - restart alertmanager

    # Grafana Setup
    - name: Add Grafana APT key
      apt_key:
        url: https://packages.grafana.com/gpg.key
        state: present

    - name: Add Grafana repository
      apt_repository:
        repo: "deb https://packages.grafana.com/oss/deb stable main"
        state: present

    - name: Install Grafana
      package:
        name: grafana
        state: present
        update_cache: true

    - name: Configure Grafana
      template:
        src: grafana.ini.j2
        dest: /etc/grafana/grafana.ini
        owner: grafana
        group: grafana
        mode: '0640'
      notify: restart grafana

    - name: Create Grafana dashboards directory
      file:
        path: /var/lib/grafana/dashboards
        state: directory
        owner: grafana
        group: grafana
        mode: '0755'

    - name: Copy Grafana dashboards
      template:
        src: "{{ item }}"
        dest: "/var/lib/grafana/dashboards/{{ item | basename | regex_replace('\\.j2$', '') }}"
        owner: grafana
        group: grafana
        mode: '0644'
      loop:
        - knirv-nexus-dashboard.json.j2
        - system-metrics-dashboard.json.j2
      notify: restart grafana

    # Logging Setup
    - name: Configure rsyslog for application logs
      template:
        src: rsyslog-knirv.conf.j2
        dest: /etc/rsyslog.d/49-knirv-nexus.conf
        mode: '0644'
      notify: restart rsyslog

    - name: Create log rotation configuration
      template:
        src: logrotate-knirv.j2
        dest: /etc/logrotate.d/knirv-nexus
        mode: '0644'

    - name: Configure journald
      template:
        src: journald.conf.j2
        dest: /etc/systemd/journald.conf
        mode: '0644'
      notify: restart journald

    # Firewall Configuration
    - name: Configure firewall for monitoring
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
        src: "{{ ansible_default_ipv4.network }}/{{ ansible_default_ipv4.netmask }}"
      loop:
        - "{{ prometheus_port }}"
        - "{{ grafana_port }}"
        - "{{ node_exporter_port }}"
        - "{{ alertmanager_port }}"

    # Health Check Script
    - name: Create monitoring health check script
      template:
        src: monitoring-health-check.sh.j2
        dest: "{{ monitoring_dir }}/monitoring-health-check.sh"
        owner: "{{ monitoring_user }}"
        group: "{{ monitoring_user }}"
        mode: '0755'

    - name: Setup monitoring health check cron
      cron:
        name: "Monitoring health check"
        minute: "*/5"
        job: "{{ monitoring_dir }}/monitoring-health-check.sh"
        user: "{{ monitoring_user }}"

    # Start and enable services
    - name: Start and enable monitoring services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - prometheus
        - node_exporter
        - alertmanager
        - grafana-server

    - name: Wait for services to start
      wait_for:
        port: "{{ item }}"
        host: "127.0.0.1"
        delay: 5
        timeout: 30
      loop:
        - "{{ prometheus_port }}"
        - "{{ grafana_port }}"
        - "{{ node_exporter_port }}"
        - "{{ alertmanager_port }}"

    - name: Verify Prometheus is running
      uri:
        url: "http://127.0.0.1:{{ prometheus_port }}/-/healthy"
        method: GET
        status_code: 200

    - name: Display monitoring URLs
      debug:
        msg:
          - "Prometheus: http://{{ ansible_default_ipv4.address }}:{{ prometheus_port }}"
          - "Grafana: http://{{ ansible_default_ipv4.address }}:{{ grafana_port }}"
          - "Alertmanager: http://{{ ansible_default_ipv4.address }}:{{ alertmanager_port }}"
          - "Node Exporter: http://{{ ansible_default_ipv4.address }}:{{ node_exporter_port }}/metrics"

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart prometheus
      systemd:
        name: prometheus
        state: restarted

    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted

    - name: restart alertmanager
      systemd:
        name: alertmanager
        state: restarted

    - name: restart grafana
      systemd:
        name: grafana-server
        state: restarted

    - name: restart rsyslog
      systemd:
        name: rsyslog
        state: restarted

    - name: restart journald
      systemd:
        name: systemd-journald
        state: restarted

# Worker nodes monitoring
- name: Setup Monitoring on Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  vars:
    monitoring_user: "monitoring"
    node_exporter_version: "1.6.0"
    node_exporter_port: 9100

  tasks:
    - name: Create monitoring user
      user:
        name: "{{ monitoring_user }}"
        system: true
        shell: /bin/false
        create_home: false

    - name: Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        mode: '0644'

    - name: Extract Node Exporter
      unarchive:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install Node Exporter binary
      copy:
        src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        owner: root
        group: root
        remote_src: true

    - name: Create Node Exporter systemd service
      template:
        src: node_exporter.service.j2
        dest: /etc/systemd/system/node_exporter.service
        mode: '0644'
      notify:
        - reload systemd
        - restart node_exporter

    - name: Configure firewall for Node Exporter
      ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
        src: "{{ hostvars[groups['main_servers'][0]]['ansible_default_ipv4']['address'] }}"

    - name: Start and enable Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart node_exporter
      systemd:
        name: node_exporter
        state: restarted
