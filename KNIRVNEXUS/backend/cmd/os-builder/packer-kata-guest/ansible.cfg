[defaults]
# Extended timeouts for long-running operations like kernel compilation
timeout = 3600
gather_timeout = 300
command_timeout = 3600

# plays will gather facts by default, which contain information about
# the remote system.
#
# smart - gather by default, but don't regather if already gathered
# implicit - gather by default, turn off with gather_facts: False
# explicit - do not gather by default, must say gather_facts: True
gathering = explicit

# SSH connection settings
[ssh_connection]
ssh_args = -o ConnectTimeout=120 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -o ControlMaster=no -o ControlPersist=0
pipelining = False
ssh_timeout = 3600