# packer-kata-guest/kata-guest-provisioner.yml
# Converted to pure RAW commands to bypass Ansible module overhead and eliminate hangs
---
- name: Build Custom Kata Kernel and Rootfs
  hosts: default
  become: true
  gather_facts: false

  vars:
    kata_kernel_version: "6.6.x" # Match your target LTS kernel
    custom_kernel_name: "kali-clean-tee"

  tasks:
    - name: Test basic SSH connectivity
      ansible.builtin.shell: echo "SSH connection working"
      register: ssh_test
      changed_when: false

    - name: Verify sudo access
      ansible.builtin.shell: sudo -n true
      register: sudo_test
      changed_when: false

    - name: Ensure APT config directory has correct permissions
      ansible.builtin.shell: mkdir -p /etc/apt/apt.conf.d && chmod 0755 /etc/apt/apt.conf.d
      changed_when: false

    - name: Configure APT with retries and longer timeouts for reliability
      ansible.builtin.shell: |
        cat > /etc/apt/apt.conf.d/99-packer-fixes << 'EOF'
        APT::Acquire::Retries "5";
        APT::Acquire::http::Timeout "120";
        APT::Acquire::https::Timeout "120";
        EOF
      changed_when: false

    - name: Install build prerequisites (attempt 1)
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq && apt-get install -y \
          build-essential \
          libncurses5-dev \
          fakeroot \
          xz-utils \
          git \
          debootstrap \
          cpio
      register: apt_install
      ignore_errors: true
      changed_when: false

    - name: Install build prerequisites (retry if failed)
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        sleep 10
        apt-get update -qq && apt-get install -y \
          build-essential \
          libncurses5-dev \
          fakeroot \
          xz-utils \
          git \
          debootstrap \
          cpio
      when: apt_install is failed
      changed_when: false

    - name: Ensure /usr/src is available
      ansible.builtin.shell: mkdir -p /usr/src && chmod 0755 /usr/src
      changed_when: false

    - name: Get current running kernel version
      ansible.builtin.shell: uname -r
      register: current_kernel_full_version
      changed_when: false

    - name: Extract kernel version for package name
      ansible.builtin.shell: "echo '{{ current_kernel_full_version.stdout }}' | sed 's/-kali[0-9]*-amd64$//' | tr -d '\\n'"
      register: kernel_source_version
      changed_when: false

    - name: Install Kali kernel sources for target LTS version (attempt 1)
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -qq && apt-get install -y linux-source-{{ kernel_source_version.stdout }}
      register: kernel_install
      ignore_errors: true
      changed_when: false
      async: 900
      poll: 30

    - name: Install Kali kernel sources (retry if failed)
      ansible.builtin.shell: |
        export DEBIAN_FRONTEND=noninteractive
        sleep 10
        apt-get update -qq && apt-get install -y linux-source-{{ kernel_source_version.stdout }}
      when: kernel_install is failed
      changed_when: false
      async: 900
      poll: 30

    - name: Extract kernel sources
      ansible.builtin.shell: |
        cd /usr/src
        tar -xf linux-source-{{ kernel_source_version.stdout }}.tar.xz 2>/dev/null || \
        tar -xJf linux-source-{{ kernel_source_version.stdout }}.tar.xz
      changed_when: false

    - name: Symlink kernel sources
      ansible.builtin.shell: |
        rm -f /usr/src/linux
        ln -s /usr/src/linux-source-{{ kernel_source_version.stdout }} /usr/src/linux
      changed_when: false

    - name: Copy existing kernel config
      ansible.builtin.shell: |
        cp /boot/config-{{ current_kernel_full_version.stdout }} /usr/src/linux/.config
        chmod 644 /usr/src/linux/.config
      changed_when: false

    - name: Enable TEE related kernel configs
      ansible.builtin.shell: |
        cd /usr/src/linux
        # Enable Security Lockdown LSM
        sed -i 's/^# CONFIG_SECURITY_LOCKDOWN_LSM.*/CONFIG_SECURITY_LOCKDOWN_LSM=y/' .config
        sed -i '/^CONFIG_SECURITY_LOCKDOWN_LSM=/!b; n; b' .config || echo 'CONFIG_SECURITY_LOCKDOWN_LSM=y' >> .config
        
        # Enable Intel TXT
        sed -i 's/^# CONFIG_INTEL_TXT.*/CONFIG_INTEL_TXT=y/' .config
        sed -i '/^CONFIG_INTEL_TXT=/!b; n; b' .config || echo 'CONFIG_INTEL_TXT=y' >> .config
        
        # Enable AMD Memory Encryption
        sed -i 's/^# CONFIG_AMD_MEM_ENCRYPT.*/CONFIG_AMD_MEM_ENCRYPT=y/' .config
        sed -i '/^CONFIG_AMD_MEM_ENCRYPT=/!b; n; b' .config || echo 'CONFIG_AMD_MEM_ENCRYPT=y' >> .config
      changed_when: false

    - name: Prepare kernel for build (non-interactive)
      ansible.builtin.shell: |
        cd /usr/src/linux
        make olddefconfig
      changed_when: false

    - name: Build custom Kata kernel
      ansible.builtin.shell: |
        cd /usr/src/linux
        make -j$(nproc) bzImage modules
      changed_when: false
      async: 7200
      poll: 30

    - name: Create rootfs directory
      ansible.builtin.shell: mkdir -p /tmp/kata-rootfs && chmod 0755 /tmp/kata-rootfs
      changed_when: false

    - name: Bootstrap minimal Kali rootfs
      ansible.builtin.shell: |
        timeout 1800 debootstrap --variant=minbase kali-rolling /tmp/kata-rootfs http://http.kali.org/kali
      register: debootstrap_result
      ignore_errors: true
      changed_when: false
      async: 2000
      poll: 30

    - name: Bootstrap minimal Kali rootfs (retry if failed)
      ansible.builtin.shell: |
        sleep 30
        timeout 1800 debootstrap --variant=minbase kali-rolling /tmp/kata-rootfs http://http.kali.org/kali
      when: debootstrap_result is failed
      changed_when: false
      async: 2000
      poll: 30

    - name: Configure rootfs
      ansible.builtin.shell: |
        set -e
        chroot /tmp/kata-rootfs apt-get update -qq 2>/dev/null || true
        chroot /tmp/kata-rootfs apt-get install -y systemd-sysv curl gnupg 2>/dev/null || true
        chroot /tmp/kata-rootfs apt-get clean 2>/dev/null || true
        chroot /tmp/kata-rootfs rm -rf /var/lib/apt/lists/* 2>/dev/null || true
        chroot /tmp/kata-rootfs sed -i 's/^GRUB_CMDLINE_LINUX_DEFAULT="quiet"$/GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0 quiet root=\/dev\/pmem0p1 rd.shell=0"/' /etc/default/grub 2>/dev/null || true
      ignore_errors: true
      changed_when: false

    - name: Create initramfs from rootfs
      ansible.builtin.shell: |
        cd /tmp/kata-rootfs
        find . -print0 | cpio --null --format=newc -o > /tmp/kata-rootfs.img
      changed_when: false
      async: 600
      poll: 30

    - name: Create output directory on local machine
      ansible.builtin.shell: mkdir -p /tmp/packer-output && chmod 0755 /tmp/packer-output
      changed_when: false

    - name: Copy built Kata kernel image
      ansible.builtin.shell: |
        cp /usr/src/linux/arch/x86_64/boot/bzImage /tmp/packer-output/vmlinuz-{{ custom_kernel_name }}
        ls -lh /tmp/packer-output/vmlinuz-{{ custom_kernel_name }}
      changed_when: false

    - name: Copy built Kata rootfs image
      ansible.builtin.shell: |
        cp /tmp/kata-rootfs.img /tmp/packer-output/kata-rootfs-{{ custom_kernel_name }}.img
        ls -lh /tmp/packer-output/kata-rootfs-{{ custom_kernel_name }}.img
      changed_when: false

    - name: Verify output files exist
      ansible.builtin.shell: |
        test -f /tmp/packer-output/vmlinuz-{{ custom_kernel_name }} && echo "Kernel: OK" || echo "Kernel: MISSING"
        test -f /tmp/packer-output/kata-rootfs-{{ custom_kernel_name }}.img && echo "Rootfs: OK" || echo "Rootfs: MISSING"
      changed_when: false

    - name: Stop any background processes
      ansible.builtin.shell: |
        timeout 5 killall -9 apt apt-get dpkg 2>/dev/null || true
        timeout 5 killall -9 make gcc g++ 2>/dev/null || true
        timeout 5 systemctl stop unattended-upgrades 2>/dev/null || true
        timeout 5 systemctl kill unattended-upgrades 2>/dev/null || true
        rm -f /var/lib/dpkg/lock* /var/cache/apt/archives/lock 2>/dev/null || true
      timeout: 30
      ignore_errors: true
      changed_when: false

    - name: Clean up temporary files on the builder VM
      ansible.builtin.shell: |
        rm -rf /usr/src/linux
        rm -rf /usr/src/linux-source-*
        rm -rf /tmp/kata-rootfs
        rm -f /tmp/kata-rootfs.img
      timeout: 60
      ignore_errors: true
      changed_when: false

    - name: Final system sync and cleanup
      ansible.builtin.shell: |
        sync
        sleep 1
      timeout: 30
      changed_when: false