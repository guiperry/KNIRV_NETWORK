# ansible-deploy/deploy-kata-app.yml
---
- name: Configure Local Ubuntu Host, Install Kata, and Deploy Go App
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    custom_kata_kernel_name: "kali-clean-tee"
    # These paths are now passed by the Go orchestrator
    custom_kata_kernel_path_local: "" # Set by Go orchestrator via -e
    custom_kata_rootfs_path_local: "" # Set by Go orchestrator via -e
    kata_config_dir: "/etc/kata-containers"
    kata_kernel_install_path: "/usr/share/kata-containers/vmlinuz-{{ custom_kata_kernel_name }}"
    kata_rootfs_install_path: "/usr/share/kata-containers/kata-rootfs-{{ custom_kata_kernel_name }}.img"

    go_app_source_path: "" # Set by Go orchestrator via -e
    container_image_name: "" # Set by Go orchestrator via -e
    container_name: "knirvnexus-go-kata"
    container_ports:
      - 8082
      - 8089
    host_ports:
      - 8082
      - 8089

    tee_devices:
      - "/dev/sgx/enclave"
      - "/dev/sgx/provision"

  tasks:
    - name: Add Kata Containers repository (for Ubuntu 22.04)
      ansible.builtin.apt_repository:
        repo: 'deb [arch=amd64] https://download.opensuse.org/repositories/containers:/KataContainers:/Stable/xUbuntu_22.04/ /'
        state: present
        filename: kata-containers
        update_cache: true
      tags:
        - kata_config
        - full_deploy

    - name: Install containerd and Kata Containers runtime
      ansible.builtin.apt:
        name:
          - containerd
          - kata-containers
          - nerdctl
        state: present
        update_cache: true
      tags:
        - kata_config
        - full_deploy

    - name: Ensure Kata config directory exists
      ansible.builtin.file:
        path: "{{ kata_config_dir }}"
        state: directory
        mode: '0755'
      tags:
        - kata_config
        - full_deploy

    - name: Copy custom Kata kernel to Kata install path
      ansible.builtin.copy:
        src: "{{ custom_kata_kernel_path_local }}"
        dest: "{{ kata_kernel_install_path }}"
        owner: root
        group: root
        mode: '0644'
      when: custom_kata_kernel_path_local is defined and custom_kata_kernel_path_local != ""
      tags:
        - kata_config
        - full_deploy

    - name: Copy custom Kata rootfs to Kata install path
      ansible.builtin.copy:
        src: "{{ custom_kata_rootfs_path_local }}"
        dest: "{{ kata_rootfs_install_path }}"
        owner: root
        group: root
        mode: '0644'
      when: custom_kata_rootfs_path_local is defined and custom_kata_rootfs_path_local != ""
      tags:
        - kata_config
        - full_deploy

    - name: Configure Kata Containers to use custom kernel and rootfs
      ansible.builtin.blockinfile:
        path: "{{ kata_config_dir }}/configuration.toml"
        block: |
          [hypervisor.qemu]
          kernel = "{{ kata_kernel_install_path }}"
          image = "{{ kata_rootfs_install_path }}"
          # Add any necessary QEMU arguments for TEE pass-through here
          # THIS IS CRITICAL AND HIGHLY TEE-SPECIFIC.
          # Example for SGX (requires host kernel SGX module and /dev/sgx/* devices)
          #
          # kernel_params = "console=ttyS0 debug root=/dev/pmem0p1 rd.shell=0 panic=1 intel_iommu=on iommu=pt"
          # machine_type = "q35"
          # cpu_model = "host"
          # firmware = "/usr/share/ovmf/OVMF.fd" # For TDX/SEV-SNP, if using OVMF
          # qemu_params = [
          #   { "driver": "memory-backend-epc", "id": "epc0", "size": "128M" },
          #   { "driver": "intel-sgx-epc", "epc_id": "epc0" },
          # ]
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR KATA CUSTOM KERNEL/ROOTFS"
      notify: Restart containerd
      tags:
        - kata_config
        - full_deploy

    - name: Ensure local temporary build directory exists for Containerfile and source
      ansible.builtin.file:
        path: "/tmp/{{ container_image_name }}_build"
        state: directory
        mode: '0755'
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
      tags:
        - go_app_build
        - deploy_new_container
        - full_deploy

    - name: Copy Containerfile template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/Containerfile.j2"
        dest: "/tmp/{{ container_image_name }}_build/Containerfile"
        mode: '0644'
      tags:
        - go_app_build
        - deploy_new_container
        - full_deploy

    - name: Copy Golang application source code to build directory
      ansible.builtin.copy:
        src: "{{ go_app_source_path }}/"
        dest: "/tmp/{{ container_image_name }}_build/"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'
      tags:
        - go_app_build
        - deploy_new_container
        - full_deploy

    - name: Build Golang application Container image using `nerdctl`
      ansible.builtin.command: "nerdctl build -t {{ container_image_name }} /tmp/{{ container_image_name }}_build"
      args:
        chdir: "/tmp/{{ container_image_name }}_build"
      changed_when: true
      environment:
        CONTAINERD_SNAPSHOTTER: overlayfs
      tags:
        - go_app_build
        - deploy_new_container
        - full_deploy

    - name: Stop existing Go app Kata container if running
      ansible.builtin.command: "nerdctl rm -f {{ container_name }}"
      ignore_errors: true
      tags:
        - go_app_run
        - deploy_new_container
        - full_deploy

    - name: Run Golang application as a Kata Container
      ansible.builtin.command: >
        nerdctl run -d
        --runtime kata
        --name {{ container_name }}
        {% for port in container_ports %}
        -p {{ host_ports[loop.index0] }}:{{ port }}
        {% endfor %}
        {% for device in tee_devices %}
        --device {{ device }} # Pass TEE devices from host to Kata VM
        {% endfor %}
        {{ container_image_name }}
      changed_when: true
      tags:
        - go_app_run
        - deploy_new_container
        - full_deploy

    - name: Clean up temporary build directory
      ansible.builtin.file:
        path: "/tmp/{{ container_image_name }}_build"
        state: absent
      tags:
        - always # Always attempt to clean up build directory
        - go_app_build
        - deploy_new_container
        - full_deploy