syntax = "proto3";

package proto;
option go_package = "./cortex";

service CortexGateway {
  // Main inference stream: sends a prompt and gets back a token stream.
  // Real-time inference with hot-swappable Traits (LoRAs)
  rpc GenerateStream(InferenceRequest) returns (stream InferenceResponse);

  // Deep Learning: Background sync for local user data to train new traits.
  rpc SyncTrainingData(stream TrainingBatch) returns (TrainingStatus);
}

message InferenceRequest {
  string prompt = 1;
  string base_model_id = 2; // e.g., "llama-3-8b"
  string trait_id = 3;      // The LoRA Adapter ID (your custom "Trait")
  
  
  // Inference parameters
  // float temperature = 4;
  // int32 max_tokens = 5;
  map<string, float> params = 3;
}

message InferenceResponse {
  string token = 1;
  bool is_final = 2;
  int32 tokens_per_second = 3;
}

message TrainingData {
  string trait_id = 1;
  bytes payload = 2; // Serialized interaction logs feedback as raw text
}

message TrainingStatus {
  enum State { QUEUED = 0; TRAINING = 1; COMPLETED = 2; }
  State state = 1;
  string new_trait_id = 2;
}