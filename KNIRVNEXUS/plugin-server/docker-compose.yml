version: '3.8'

services:
  plugin-server:
    build: .
    container_name: KNIRVROOT-plugin-server
    ports:
      - "8080:8080"
    volumes:
      - ./agents:/app/agents
      - ./logs:/app/logs
    environment:
      - SERVER_NAME=KNIRVROOT Plugin Server
      - SERVER_PORT=8080
      - CORS_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/info"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - KNIRVROOT

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: KNIRVROOT-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - plugin-server
    restart: unless-stopped
    networks:
      - KNIRVROOT
    profiles:
      - proxy

networks:
  KNIRVROOT:
    driver: bridge

volumes:
  agents:
    driver: local
  logs:
    driver: local
