apiVersion: v1
kind: ConfigMap
metadata:
  name: knirv-nexus-config
  namespace: knirv-nexus
data:
  config.yaml: |
    environment: production
    chain_id: knirv-nexus-mainnet
    database:
      path: /app/data/nexus.db
    api:
      address: ":8080"
    p2p:
      port: 4001
      bootstraps:
        - "/ip4/127.0.0.1/tcp/4001/p2p/12D3KooWExample"
    auth:
      jwt_secret: "${JWT_SECRET}"
      token_expiry: "24h"
      enable_oauth: false
    validation:
      timeout: "300s"
      max_concurrent: 10
      enable_tee: true
    tee:
      type: "software"
      software:
        enable_attestation: true
        key_file: "/app/keys/tee.key"
    reports:
      storage_path: "/app/reports"
      max_file_size: 104857600  # 100MB
      retention_days: 30
      enable_sharing: true
      enable_scheduling: true
    log:
      level: "info"
      format: "json"
      output: "stdout"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: knirv-nexus-scripts
  namespace: knirv-nexus
data:
  init-db.sh: |
    #!/bin/bash
    set -e
    
    echo "Initializing KNIRV-NEXUS database..."
    
    # Create data directory if it doesn't exist
    mkdir -p /app/data
    
    # Set proper permissions
    chmod 755 /app/data
    
    echo "Database initialization complete"
  
  health-check.sh: |
    #!/bin/bash
    set -e
    
    # Check if the service is responding
    curl -f http://localhost:8080/health || exit 1
    
    # Check if P2P port is listening
    netstat -ln | grep :4001 || exit 1
    
    echo "Health check passed"
  
  backup-db.sh: |
    #!/bin/bash
    set -e
    
    BACKUP_DIR="/app/backups"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    
    mkdir -p $BACKUP_DIR
    
    # Create backup of database
    cp /app/data/nexus.db "$BACKUP_DIR/nexus_$TIMESTAMP.db"
    
    # Keep only last 7 backups
    ls -t $BACKUP_DIR/nexus_*.db | tail -n +8 | xargs -r rm
    
    echo "Database backup completed: nexus_$TIMESTAMP.db"
