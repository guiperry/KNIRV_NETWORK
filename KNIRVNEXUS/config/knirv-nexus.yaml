# KNIRV-NEXUS Configuration
mode: headless  # headless | gui

# Service configuration
api:
  port: 8080
  bind_address: "0.0.0.0"
  address: "0.0.0.0"

# GUI mode configuration
gui:
  enabled: false
  port: 9080
  frontend_path: "./.next"  # Path to built Next.js frontend
  bind_address: "127.0.0.1"

# Security configuration
security:
  auth_required: true
  tls_enabled: true
  audit_logging: true
  jwt_secret: "${KNIRV_JWT_SECRET}"

# Database configuration
database:
  path: "./data/nexus.db"

# User roles and permissions
roles:
  validator:
    permissions:
      - "node:read"
      - "node:update"
      - "tasks:read"
      - "results:read"
    scoped_access: true  # Only assigned nodes

  admin:
    permissions:
      - "*:*"  # Full access
    scoped_access: false

  observer:
    permissions:
      - "*:read"
    scoped_access: false

# Network configuration
network:
  chain_id: "knirv-nexus-mainnet"
  p2p_port: 4001
  discovery_enabled: true

# P2P configuration
p2p:
  port: 4001
  bootstraps: []

# Authentication configuration
auth:
  jwt_secret: "${KNIRV_JWT_SECRET}"
  token_expiry: "24h"
  enable_oauth: false
  oauth_providers: []

# Validation configuration
validation:
  timeout: "30s"
  max_concurrent: 10
  enable_tee: false

# TEE configuration
tee:
  type: "software"  # sgx | sev-snp | tdx | software
  software:
    enable_attestation: false
    key_file: ""

# Reports configuration
reports:
  storage_path: "./reports"
  max_file_size: 104857600  # 100MB
  retention_days: 30
  enable_sharing: true
  enable_scheduling: true

# Logging configuration
log:
  level: "info"  # debug | info | warn | error
  format: "json"
  output: "./logs/nexus.log"

# Legacy configuration for backward compatibility
environment: "production"
chain_id: "knirv-nexus-mainnet"
node_role: "dve-manager"
