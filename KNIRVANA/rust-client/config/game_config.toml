[game]
title = "KNIRVANA"
version = "0.1.0"
api_endpoint = "https://api.knirv.com"

[graphics]
default_quality = "medium"
enable_shadows = true
enable_bloom = true
target_fps = 60

[mobile]
touch_sensitivity = 1.0
battery_optimization = true
adaptive_quality = true
reduced_effects = true

[networking]
enable_multiplayer = true
sync_interval = 0.1
connection_timeout = 30.0
max_retries = 3

[blockchain]
chain_id = "knirv-mainnet-1"
nrn_contract = "knirv1..."
enable_gasless = true

[audio]
master_volume = 0.8
music_volume = 0.6
sfx_volume = 0.8

[controls]
move_speed = 5.0
jump_force = 10.0
interaction_range = 3.0

[debug]
enable_physics_debug = false
enable_fps_counter = true
log_level = "info"
