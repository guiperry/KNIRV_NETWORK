[package]
name = "knirv-cortex-wasm"
version = "0.1.0"
edition = "2021"
description = "KNIRV-CORTEX WASM module - deterministic cognitive shell"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
prost = "0.12"
shared-types = { path = "../shared-types", package = "knirv-cortex-shared-types" }
lora-engine = { path = "../lora-engine", package = "knirv-lora-engine" }

# Optional: keep serde for internal structures if needed
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", features = ["alloc"], optional = true }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Performance",
  "Window",
]

[features]
default = []
serde-support = ["serde", "serde_json"]

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
lto = true
codegen-units = 1
