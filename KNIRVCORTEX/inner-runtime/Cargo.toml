[package]
name = "knirv-inner-runtime"
version = "0.1.0"
edition = "2021"
description = "Inner model runtime for KNIRV-CORTEX"

[lib]
name = "inner_runtime"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
shared-types = { path = "../shared-types", package = "knirv-cortex-shared-types" }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For now, use a minimal ML runtime
# In production, would use candle-core, candle-nn, candle-transformers
# candle-core = { version = "0.3", features = ["safetensors"] }
# candle-nn = "0.3"
# candle-transformers = "0.3"

[features]
default = []
wasm = []
