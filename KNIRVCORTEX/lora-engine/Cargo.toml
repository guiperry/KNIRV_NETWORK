[package]
name = "knirv-lora-engine"
version = "0.1.0"
edition = "2021"
description = "LoRA Adapter Engine for KNIRV-CORTEX"

[lib]
name = "lora_engine"
path = "src/lib.rs"

[dependencies]
shared-types = { path = "../shared-types", package = "knirv-cortex-shared-types" }
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "js"] }
log = "0.4"
thiserror = "1.0"
getrandom = { version = "0.2", features = ["js"] }
rand = { version = "0.8", features = ["small_rng"] }

[features]
default = []
