name: Build Desktop Application

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  GO_VERSION: '1.21'

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: |
          gui/package-lock.json
          electron/package-lock.json

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install frontend dependencies
      working-directory: gui
      run: npm ci

    - name: Install Electron dependencies
      working-directory: electron
      run: npm ci

    - name: Build Go backend
      run: |
        go mod download
        go build -o knirv-engine${{ matrix.platform == 'win32' && '.exe' || '' }} .

    - name: Build frontend
      working-directory: gui
      run: npm run build

    - name: Build Electron app (Linux)
      if: matrix.platform == 'linux'
      working-directory: electron
      run: npm run build:linux
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Electron app (Windows)
      if: matrix.platform == 'win32'
      working-directory: electron
      run: npm run build:win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Electron app (macOS)
      if: matrix.platform == 'darwin'
      working-directory: electron
      run: npm run build:mac
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        CSC_LINK: ${{ secrets.CSC_LINK }}
        CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: knirv-engine-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          electron/dist/*.exe
          electron/dist/*.dmg
          electron/dist/*.AppImage
          electron/dist/*.deb
          electron/dist/*.rpm
          electron/dist/*.tar.gz
          electron/dist/build-info.json
          electron/dist/checksums.json
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: KNIRVENGINE ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      run: |
        for artifact_dir in knirv-engine-*; do
          for file in "$artifact_dir"/*; do
            if [[ -f "$file" ]]; then
              echo "Uploading $file"
              gh release upload ${{ github.ref }} "$file"
            fi
          done
        done
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Install dependencies
      run: |
        cd gui && npm ci
        cd ../electron && npm ci

    - name: Run Go tests
      run: go test ./...

    - name: Run frontend tests
      working-directory: gui
      run: npm test

    - name: Run linting
      run: |
        cd gui && npm run lint
        go vet ./...

    - name: Security scan
      run: |
        cd gui && npm audit
        cd ../electron && npm audit
