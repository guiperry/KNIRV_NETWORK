[package]
name = "hrm-trainer"
version = "0.1.0"
edition = "2021"
description = "KNIRVHASHER stage 5: trains the knirv-hrm Hierarchical Reasoning Model and promotes it through an evaluation gate"
license = "MIT"

[[bin]]
name = "hrm-trainer"
path = "src/main.rs"

[dependencies]
# Same crate the arena (WASM) and HEART (WASI) run: one implementation.
knirv-cortex-wasm = { path = "../../../KNIRVINFERENCER/hrm" }
candle-core = "0.11"
candle-nn = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
regex = "1"

[profile.release]
opt-level = 3

[profile.test]
opt-level = 3
