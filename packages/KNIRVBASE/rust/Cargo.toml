[package]
name = "knirvbase"
version = "0.2.0"
edition = "2021"
authors = ["KNIRV Corp"]
description = "Distributed database with vector indexing, CRDT sync, and PQC security"
license = "MIT"
repository = "https://github.com/knirvcorp/knirvbase"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "5.5"
bincode = "1.3"
base64 = "0.21"
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"

tempfile = "3.0"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tokio-test = "0.4"
criterion = "0.5"


