<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNIRV Network: Investment Opportunity</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Montserrat', sans-serif;
            color: #ffffff;
            overflow: hidden;
            background-color: #0a192f;
            margin: 0;
            padding: 0;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(10, 25, 47, 0.9));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 100vh;
        }

        /* Ensure proper scaling for different screen sizes */
        @media (max-aspect-ratio: 16/9) {
            .slide {
                width: calc(100vh * 16/9);
                height: 100vh;
                margin: 0 auto;
                max-width: 100vw;
            }
        }

        @media (min-aspect-ratio: 16/9) {
            .slide {
                width: 100vw;
                height: calc(100vw * 9/16);
                margin: auto 0;
                min-height: calc(100vw * 9/16);
            }
        }
        
            .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(10, 25, 47, 0.9));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 100vh;
        }
        }

        @media (min-aspect-ratio: 16/9) {
            .slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(135deg, rgba(10, 25, 47, 0.95), rgba(10, 25, 47, 0.9));
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 100vh;
        }
        }
        .left-content {
            width: 55%;
            padding-left: 70px;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }
        .right-content {
            width: 45%;
            padding-left: 20px;
            padding-right: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 10;
        }
        .title {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 10px;
            position: relative;
            letter-spacing: -1px;
        }
        .tagline {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 700;
            color: #7c3aed;
            margin-bottom: clamp(1.5rem, 3vh, 2rem);
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 400;
            margin-bottom: clamp(1.5rem, 3vh, 2rem);
            color: #e0e0e0;
            line-height: 1.5;
        }
        .bento-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 20px;
        }
        .bento-item {
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s ease;
            border-left: 4px solid #7c3aed;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .bento-item:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }
        .bento-title {
            font-size: 16px;
            color: #7c3aed;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .bento-value {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.1;
        }
        .logo-placeholder {
            position: absolute;
            top: 30px;
            left: 70px;
            font-size: 24px;
            font-weight: 700;
            color: #7c3aed;
            z-index: 20;
            display: flex;
            align-items: center;
        }
        .logo-placeholder i {
            margin-right: 10px;
        }
        .accent-circle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, rgba(124, 58, 237, 0) 70%);
            z-index: 1;
        }
        .accent-circle-1 {
            width: 400px;
            height: 400px;
            top: -100px;
            right: -100px;
        }
        .accent-circle-2 {
            width: 300px;
            height: 300px;
            bottom: -50px;
            left: 200px;
        }
        /* Mobile responsive breakpoints */
        @media (max-width: 768px) {

            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 100vh;
        }
            .content {
            flex: 1;

            overflow: hidden;

        }

            letter-spacing: -1px;
        }
        }
    
        /* Mobile Responsive Design */

            }

            }
            
            .title {

                margin-bottom: 1vh !important;
            }
            
            .content {
                flex-direction: column !important;

            .feature-item {

            .value-prop-item {

            }
            
            .value-prop-icon {
                margin-right: 0 !important;

                height: clamp(3rem, 8vw, 4rem) !important;
                font-size: clamp(1.5rem, 4vw, 2rem) !important;
            }
            
            .value-prop-text {
                font-size: clamp(1rem, 4vw, 1.3rem) !important;
            }
            
            .diagram-layers {
                grid-template-columns: 1fr 1fr !important;

            .diagram-layer {
                width: 100% !important;
                min-width: unset !important;
                padding: 1.5vh 2vw !important;
            }
            
            .layer-title {
                font-size: clamp(1rem, 4vw, 1.2rem) !important;
            }
            
            .layer-desc {

            }
            
            .keyword {
