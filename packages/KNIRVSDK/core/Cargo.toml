[package]
name = "knirv-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Async Rust SDK for KNIRV Network services"
license = "MIT"
repository = "https://github.com/KNIRV/KNIRV_NETWORK"
keywords = ["knirv", "blockchain", "sdk"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]

[features]
default = ["rustls-tls", "filesystem"]
rustls-tls = ["reqwest/rustls-tls"]
filesystem = []

[dependencies]
aes = "0.8"
base64 = "0.22"
bech32 = "0.11"
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
pbkdf2 = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ripemd = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
