openapi: 3.1.0
info:
  title: KNIRVORACLE MCP API
  description: |
    Official API specification for KNIRVORACLE blockchain nodes with Model Context Protocol (MCP) support.

    This API provides:
    - Blockchain operations (chain state, blocks, transactions)
    - MCP capability management (registration, invocation, updates)
    - Node management and health monitoring
    - URI generation for resource discovery

    This specification serves as the source of truth for KNIRV SDK implementations
    that interact with KNIRVORACLE nodes. Wallet operations are primarily handled client-side via the SDK.

    For other KNIRV services (KNIRVSERVER, KNIRVGATEWAY, etc.), see their respective documentation.
  version: "2.0.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com
    url: https://github.com/cloud-equities/KNIRV_NETWORK/tree/main/docs

servers:
  - url: http://localhost:5000
    description: Local development server # Adjusted description

tags:
  - name: blockchain
    description: Blockchain operations
  - name: node
    description: Node information and management
  - name: uri
    description: URI generation and management
  - name: mcp
    description: Distributed Model Context Protocol operations 

paths:
  # Blockchain Server Endpoints
  /chain:
    get:
      tags:
        - blockchain
      summary: Get blockchain state
      description: Retrieves the current state of the blockchain including blocks, transaction pool, and reflections
      operationId: getChain
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SerializableBlockchain'
        '500':
          description: Internal server error

  /block:
    post:
      tags:
        - blockchain
      summary: Submit a new block
      description: Submits a new block to the blockchain
      operationId: writeBlock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Block'
      responses:
        '200':
          description: Block successfully added
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        '400':
          description: Invalid block data
        '500':
          description: Internal server error

  /transaction:
    post:
      tags:
        - blockchain
        - mcp # Added mcp tag as this is a generic endpoint
      summary: Submit a Signed Transaction
      description: |
        Submits a pre-signed transaction to the blockchain network.
        This endpoint is used for various transaction types, including
        standard transfers and MCP operations like capability registration
        (after preparation), invocation, or updates. The `Transaction.type` field and `Transaction.data`
        structure will determine how it's processed.
      operationId: writeTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Transaction'
      responses:
        '202': # Changed to 202 Accepted - more appropriate for mempool submission
          description: Transaction accepted by the node and broadcasted. Does not guarantee inclusion in a block.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash: # Changed from success/message to transactionHash
                    type: string
                  message:
                    type: string
                    example: "Transaction submitted to mempool"
        '400':
          description: Invalid transaction data
        '500':
          description: Internal server error

  /txn_pool:
    get:
      tags:
        - blockchain
      summary: Get transaction pool
      description: Retrieves the current transaction pool
      operationId: getTransactionPool
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '500':
          description: Internal server error

  /info:
    get:
      tags:
        - node
      summary: Get server information
      description: Retrieves information about the blockchain node
      operationId: getServerInfo
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeInfo'
        '500':
          description: Internal server error

  /health:
    get:
      tags:
        - node
      summary: Check node health
      description: Checks the health status of the blockchain node
      operationId: healthCheck
      responses:
        '200':
          description: Node is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          description: Node is unhealthy

  /ping:
    get:
      tags:
        - node
      summary: Ping node
      description: Simple ping endpoint to check if the node is responsive
      operationId: ping
      responses:
        '200':
          description: Pong response
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /devs:
    get:
      tags:
        - node
      summary: Get connected devs
      description: Retrieves the list of connected devs
      operationId: getPeers
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerList'
        '500':
          description: Internal server error

  /uriGenerator:
    post:
      tags:
        - uri
      summary: Generate and announce URI
      description: Generates a new URI and announces it to the network
      operationId: generateAndAnnounceURI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/URIGenerationRequest'
      responses:
        '200':
          description: URI successfully generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/URIGenerationResponse'
        '400':
          description: Invalid request data
        '500':
          description: Internal server error

  /mcp/capability/prepare_registration: # New endpoint
    post:
      tags:
        - mcp
      summary: Prepare data for capability registration transaction
      description: |
        Allows a client to get the necessary data (e.g., a hash or structured unsigned transaction)
        that needs to be signed to register a new MCP capability.
        The client signs this data locally and then submits the complete, signed transaction
        via the general /transaction endpoint.
      operationId: mcpPrepareCapabilityRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPPrepareCapabilityRegistrationRequest'
      responses:
        '200':
          description: Data for signing successfully prepared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPPrepareCapabilityRegistrationResponse'
        '400':
          description: Invalid request data (e.g., invalid descriptor, insufficient fee proposed).
        '409': # Conflict
          description: A capability with a similar signature/ID might already exist or be pending (if server does pre-checks).
        '500':
          description: Internal server error.

  # Removed /mcp/capability/register/initiate
  # Removed /mcp/capability/register/finalize

  /mcp/capability/invoke:
    post:
      tags:
        - mcp
      summary: Invoke a Capability (One-Step)
      description: |
        Submits a pre-signed transaction to invoke an existing capability.
        The `Transaction.data` within the signed transaction should contain `MCPInvokeCapabilityData`.
      operationId: mcpInvokeCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInvokeCapabilityRequestWrapper' # Changed to wrapper for signed tx
      responses:
        '202': # Changed to 202 Accepted
          description: Capability invocation transaction accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  contextID: # Optionally return the initial context ID
                    type: string
                  message:
                    type: string
                    example: "Capability invocation submitted"
        '400':
          description: Invalid request data
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/capability/update: # New endpoint for one-step update
    post:
      tags:
        - mcp
      summary: Update a Capability (One-Step)
      description: |
        Submits a pre-signed transaction to update an existing capability.
        The sender must be the owner of the capability.
        The `Transaction.data` within the signed transaction should contain `MCPUpdateCapabilityData`.
      operationId: mcpUpdateCapability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPUpdateCapabilityRequestWrapper'
      responses:
        '202':
          description: Capability update transaction accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionHash:
                    type: string
                  message:
                    type: string
                    example: "Capability update submitted"
        '400':
          description: Invalid update request or transaction.
        '403':
          description: Forbidden. Sender is not the owner of the capability.
        '404':
          description: Capability not found.
        '500':
          description: Internal server error

  /mcp/capability/{capability_id}:
    get:
      tags:
        - mcp
      summary: Get capability
      description: Retrieves a specific capability by ID
      operationId: mcpGetCapability
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the capability to retrieve
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilityDescriptor'
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/capabilities:
    get:
      tags:
        - mcp
      summary: List capabilities
      description: Lists all registered capabilities
      operationId: mcpListCapabilities
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [RESOURCE, TOOL, PROMPT, MEMORY_SERVICE]
          description: Filter by capability type
        - name: owner
          in: query
          required: false
          schema:
            type: string
          description: Filter by owner address
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CapabilityDescriptor'
        '500':
          description: Internal server error

  /mcp/capability/{capability_id}/invocations:
    get:
      tags:
        - mcp
      summary: List capability invocations
      description: Lists all invocations of a specific capability
      operationId: mcpListCapabilityInvocations
      parameters:
        - name: capability_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the capability
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextRecord'
        '404':
          description: Capability not found
        '500':
          description: Internal server error

  /mcp/context/{context_id}:
    get:
      tags:
        - mcp
      summary: Get context record
      description: Retrieves a specific context record by ID
      operationId: mcpGetContextRecord
      parameters:
        - name: context_id
          in: path
          required: true
          schema:
            type: string
          description: ID of the context record to retrieve
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextRecord'
        '404':
          description: Context record not found
        '500':
          description: Internal server error

  /mcp/contexts:
    get:
      tags:
        - mcp
      summary: List context records
      description: Lists all context records
      operationId: mcpListContextRecords
      parameters:
        - name: capabilityId
          in: query
          required: false
          schema:
            type: string
          description: Filter by capability ID
        - name: interactionType
          in: query
          required: false
          schema:
            type: string
            enum: [TOOL_INVOCATION, PROMPT_USAGE, RESOURCE_ACCESS, PLUGIN_EXECUTION, SAMPLING_REQUEST_SENT, SAMPLING_RESPONSE_RECEIVED, MEMORY_WRITE, CAPABILITY_REGISTRATION]
          description: Filter by interaction type
        - name: initiator
          in: query
          required: false
          schema:
            type: string
          description: Filter by initiator address
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContextRecord'
        '500':
          description: Internal server error

 
components:
  schemas:
    Error: # Added standard error schema
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: string

    SerializableBlockchain:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/Block'
        transaction_pool:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        chain_address:
          type: string
          description: The blockchain's address
        reflections:
          type: object
          additionalProperties:
            type: boolean
          description: Map of reflection URLs
        chain_id:
          type: string
          description: Unique identifier for the blockchain

    Block:
      type: object
      properties:
        block_number:
          type: integer
          format: uint64
          description: Block number in the chain
        prevHash:
          type: string
          format: byte
          description: Hash of the previous block
        timestamp:
          type: integer
          format: int64
          description: Unix timestamp when the block was created
        nonce:
          type: integer
          description: Nonce used for mining
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
          description: Transactions included in this block
        hash:
          type: string
          format: byte
          description: Hash of the block
        proposer_address:
          type: string
          description: Address of the block proposer (miner/validator)

    Transaction: # Overhauled Transaction schema
      type: object
      required:
        - version
        - id
        - timestamp
        - from
        - fee
        - type
        - signature
        - public_key # Changed from publicKey for consistency with existing
      properties:
        version: # Added version
          type: integer
          example: 1
        id: # This is the transaction_hash, added
          type: string
          description: Transaction hash/ID.
          example: "0xabcdef123456..."
        timestamp: # Kept existing timestamp, clarified format
          type: integer
          format: int64 # Unix timestamp in nanoseconds
          description: Unix timestamp (nanoseconds) when the transaction was created
        from: # Kept existing from
          type: string
          description: Sender address
        to:
          type: string
          nullable: true # Added nullable
          description: Recipient address
        value:
          type: string # Changed to string for big.Int representation
          description: Amount of NRN transferred.
          example: "1000000000000000000" # 1 NRN
        data: # Changed to flexible JSON payload
          type: object
          additionalProperties: true
          description: Transaction payload, structure depends on transaction type. For MCP ops, this will be JSON of MCPRegisterCapabilityData, MCPInvokeCapabilityData, etc.
        status: # Kept existing status
          type: string
          description: Transaction status (PENDING, SUCCESS, FAILED)
        transaction_hash: # Kept existing transaction_hash, though 'id' is preferred now
          type: string
          description: Hash of the transaction
        public_key:
          type: string
          description: Public key of the sender
        signature:
          type: string
          format: byte
          description: Cryptographic signature
        fee:
          type: string # Changed to string for big.Int
          description: NRN token gas fee paid for this transaction
        type:
          type: string
          description: Transaction type for MCP transactions

    TransactionReceipt: # Added TransactionReceipt
      type: object
      required:
        - transactionHash
        - status
      properties:
        transactionHash:
          type: string
        blockHash:
          type: string
        blockNumber:
          type: integer
          format: uint64
        status:
          type: string
          enum: [success, failure]
        gasUsed: # If applicable
          type: integer
          format: uint64
        logs: # If applicable
          type: array
          items:
            type: object
            additionalProperties: true

    NodeInfo:
      type: object
      properties:
        node_id:
          type: string
          description: Unique identifier for the node
        version:
          type: string
          description: Software version
        chain_height:
          type: integer
          description: Current blockchain height
        dev_count:
          type: integer
          description: Number of connected devs
        is_mining:
          type: boolean
          description: Whether the node is currently mining
        wallet_address:
          type: string
          description: Node's wallet address
        uptime:
          type: integer
          format: int64
          description: Node uptime in seconds

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Overall health status
        blockchain:
          type: boolean
          description: Blockchain subsystem status
        network:
          type: boolean
          description: Network subsystem status
        database:
          type: boolean
          description: Database subsystem status
        message:
          type: string
          description: Additional status information

    PeerInfo:
      type: object
      properties:
        id:
          type: string
          description: Peer ID
        address:
          type: string
          description: Peer address
        connected_since:
          type: integer
          format: int64
          description: Unix timestamp when the dev connected

    PeerList:
      type: array
      items:
        $ref: '#/components/schemas/PeerInfo'

    URIGenerationRequest:
      type: object
      properties:
        resource_type:
          type: string
          description: Type of resource
        content_hash:
          type: string
          description: Hash of the content
        owner:
          type: string
          description: Owner address
        metadata:
          type: object
          additionalProperties: true
          description: Additional metadata

    URIGenerationResponse:
      type: object
      properties:
        uri:
          type: string
          description: Generated URI
        resource_id:
          type: string
          description: Resource ID
        success:
          type: boolean
          description: Whether the operation was successful
        message:
          type: string
          description: Additional information

    BaseDescriptor:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier
        capabilityType:
          type: string
          enum: [RESOURCE, TOOL, PROMPT, MEMORY_SERVICE]
          description: Type of capability
        name:
          type: string
          description: Human-readable name
        owner:
          type: string
          description: Public key or address of the owner/root
        version:
          type: string
          description: Version string
        description:
          type: string
          description: Description of the capability
        gasFeeNRN:
          type: integer
          format: uint64
          description: NRN token gas fee for invoking/using this capability
        timestamp:
          type: integer
          format: int64
          description: Creation/registration timestamp
        customMetadata:
          type: object
          additionalProperties: true
          description: Custom metadata

    ResourceDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - resourceType
            - contentHash
          properties:
            resourceType:
              type: string
              enum: [FILE, API, PLUGIN, GENERATED_DOCUMENT, DATASET, MODEL_ARTIFACT, SERVICE]
              description: Specific kind of resource
            contentHash:
              type: string
              description: SHA256 hash of the Capability package
            schema:
              $ref: '#/components/schemas/PluginSchemaDetail'

    PluginSchemaDetail:
      type: object
      properties:
        summary:
          type: string
          description: Brief, human-readable summary of the plugin's purpose
        accessInfo:
          type: object
          additionalProperties: true
          description: For APIs - endpoint, auth details, etc.
        locationHints:
          type: array
          items:
            type: string
          description: Array of URIs where the Capability package can be downloaded
        manifestFile:
          type: string
          description: Relative path to the manifest file within the downloaded package
        executableFile:
          type: string
          description: Relative path to the main executable file within the downloaded package
        outputDirectoryHint:
          type: string
          description: Optional hint for plugin's output/config directory

    ToolDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - inputSchemaJSON
            - executionPointer
          properties:
            inputSchemaJSON:
              type: string
              description: JSON Schema for tool input
            outputSchemaJSON:
              type: string
              description: JSON Schema for tool output
            executionPointer:
              type: string
              description: Reference to a Plugin, API endpoint, or embedded logic

    PromptDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - template
            - parametersSchemaJSON
          properties:
            template:
              type: string
              description: The prompt template string
            parametersSchemaJSON:
              type: string
              description: JSON Schema for template parameters

    MemoryServiceDescriptor:
      allOf:
        - $ref: '#/components/schemas/BaseDescriptor'
        - type: object
          required:
            - graphSchema
          properties:
            graphSchema:
              type: string
              description: Describes the structure/ontology of the memory graph if applicable

    CapabilityDescriptor:
      oneOf:
        - $ref: '#/components/schemas/ResourceDescriptor'
        - $ref: '#/components/schemas/ToolDescriptor'
        - $ref: '#/components/schemas/PromptDescriptor'
        - $ref: '#/components/schemas/MemoryServiceDescriptor'
      discriminator:
        propertyName: capabilityType
        mapping:
          RESOURCE: '#/components/schemas/ResourceDescriptor'
          TOOL: '#/components/schemas/ToolDescriptor'
          PROMPT: '#/components/schemas/PromptDescriptor'
          MEMORY_SERVICE: '#/components/schemas/MemoryServiceDescriptor'
      x-gjson-discriminator:
        RESOURCE:
          - resourceType
          - contentHash
          - schema
        TOOL:
          - inputSchemaJSON
          - executionPointer
          - outputSchemaJSON
        PROMPT:
          - template
          - parametersSchemaJSON
        MEMORY_SERVICE:
          - graphSchema

    ContextRecord:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the context record
        capabilityID:
          type: string
          description: Identifier of the MCP capability involved
        interactionType:
          type: string
          enum: [CAPABILITY_REGISTRATION, CAPABILITY_INVOCATION, CAPABILITY_UPDATE, GENERAL_MESSAGE, TOOL_INVOCATION, PROMPT_USAGE, RESOURCE_ACCESS, PLUGIN_EXECUTION, SAMPLING_REQUEST_SENT, SAMPLING_RESPONSE_RECEIVED, MEMORY_WRITE] # Added more types
          description: Type of interaction
        initiator:
          type: string
          description: Public key or address of the entity initiating the context
        timestamp:
          type: integer
          format: int64
          description: Timestamp of the event
        inputHash:
          type: string
          description: Optional hash of the input data to the interaction
        outputHash:
          type: string
          description: Optional hash of the output data from the interaction
        details:
          type: object
          additionalProperties: true
          description: Primitive-specific information
        signature:
          type: string
          format: byte
          description: Cryptographic signature of the ContextRecord content by the initiator
        status: # Added status and timestamps
          type: string
          enum: [pending, success, failed, processing]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # This is the request for the /mcp/capability/prepare_registration endpoint
    MCPPrepareCapabilityRegistrationRequest: # Consolidated definition
      type: object
      required:
        - ownerAddress # Changed from from_address
        - capabilityDescriptor # Changed from descriptor and capability_type
        - fee
      properties:
        ownerAddress: # Changed from from_address
          type: string
          description: Address of the account that will own the capability.
        capabilityDescriptor: # Renamed from descriptor for consistency
          $ref: '#/components/schemas/CapabilityDescriptor' # Use the polymorphic descriptor
        message:
          type: string
          description: Additional information
        fee:
          type: integer
          format: uint64
          description: Network fee for the registration transaction.

    # This is the response from /mcp/capability/prepare_registration
    MCPPrepareCapabilityRegistrationResponse: # Consolidated definition
      type: object
      required:
        - pendingTransactionHash
        - unsignedTransaction
      properties:
        pendingTransactionHash:
          type: string
          description: A server-side hash identifying this pending registration preparation.
        unsignedTransaction:
          $ref: '#/components/schemas/UnsignedTransactionDetails'

    MCPInvokeCapabilityRequestWrapper: # Wrapper for signed transaction for invoke endpoint
      type: object
      required:
        - signedTransaction
      properties:
        signedTransaction:
          $ref: '#/components/schemas/Transaction' # Transaction.Type should be MCP_INVOKE_CAPABILITY
                                                  # Transaction.Data should contain MCPInvokeCapabilityData

    MCPInvokeCapabilityData: # Data part of an Invoke Transaction
      type: object
      required:
        - contextRecord
      properties:
        contextRecord:
          $ref: '#/components/schemas/ContextRecord'

    MCPUpdateCapabilityRequestWrapper: # Wrapper for signed transaction for update endpoint
      type: object
      required:
        - signedTransaction
      properties:
        signedTransaction:
          $ref: '#/components/schemas/Transaction' # Transaction.Type should be MCP_UPDATE_CAPABILITY
                                                  # Transaction.Data should contain MCPUpdateCapabilityData

    MCPUpdateCapabilityData: # Data part of an Update Transaction
      type: object
      required:
        - capabilityID
        - updatedDescriptor
      properties:
        capability_id:
          type: string
          description: The ID of the capability to update.
        updatedDescriptor:
          $ref: '#/components/schemas/CapabilityDescriptor'

    MCPRegisterCapabilityData: # Data part of a Register Transaction
      type: object
      required:
        - capabilityDescriptor
      properties:
        capabilityDescriptor:
          $ref: '#/components/schemas/CapabilityDescriptor'

    UnsignedTransactionDetails: # Schema for the structured unsigned transaction from prepare_registration
      type: object
      description: A structured representation of the unsigned transaction the client is expected to form and sign.
      properties:
        from:
          type: string
        to:
          type: string
          nullable: true
        value: # Should be string for big.Int
          type: string
          example: "0"
        data: # This would be the JSON bytes of MCPRegisterCapabilityData (base64 encoded string)
          type: string
          format: base64 # Explicitly base64 for JSON bytes
          description: Base64 encoded JSON bytes of MCPRegisterCapabilityData.
