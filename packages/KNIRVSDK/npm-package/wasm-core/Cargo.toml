[package]
name = "knirv-sdk-wasm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Portable WebAssembly core for the KNIRV SDK npm package"
license = "MIT"
repository = "https://github.com/KNIRV/KNIRV_NETWORK"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
sha2 = "0.10"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The bundled wasm-opt version in this environment does not support Rust's
# bulk-memory instructions. A current CI wasm-opt may be enabled separately.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
