# Docker Compose Configuration for KNIRV Testnet
# Use with: docker-compose up -d or docker compose up -d
# This configuration uses the actual Dockerfiles for each service
version: '3.8'

services:
  # Testnet Gateway - Main web interface
  knirv-testnet-gateway:
    build:
      context: .
      dockerfile: testnet-gateway.Dockerfile
    container_name: knirv-testnet-gateway
    ports:
      - "10000:80"  # Map local 10000 to container 80 (nginx)
    environment:
      - DEPLOYMENT_ENV=local
      - KNIRVORACLE_API=http://knirv-oracle:1317
      - KNIRVCHAIN_API=http://knirv-chain:8090
      - KNIRVGRAPH_API=http://knirv-graph:8082
      - KNIRVSERVER_API=http://knirv-server:8084
      - KNIRVROUTER_API=http://knirv-router:8086
    depends_on:
      - knirv-oracle
      - knirv-chain
      - knirv-graph
      - knirv-server
      - knirv-router
    networks:
      - knirv-testnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IPFS for decentralized storage
  ipfs:
    image: ipfs/kubo:latest
    container_name: knirv-testnet-ipfs
    ports:
      - "5001:5001"  # IPFS API
      - "8080:8080"  # IPFS Gateway
      - "4001:4001"  # IPFS Swarm
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
      - IPFS_PATH=/data/ipfs
      - IPFS_LOGGING=info
    networks:
      - knirv-testnet
    command: >
      sh -c "
        if [ ! -f /data/ipfs/config ]; then
          echo 'Initializing IPFS for KNIRV network...';
          ipfs init --profile server;
          ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001;
          ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080;
          ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '[\"*\"]';
          ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '[\"PUT\", \"POST\", \"GET\"]';
          ipfs config --json Swarm.ConnMgr.HighWater 100;
          ipfs config --json Swarm.ConnMgr.LowWater 50;
          echo 'IPFS configured for KNIRV testnet';
        fi;
        exec ipfs daemon --migrate=true --agent-version-suffix=knirv-testnet
      "

  # KNIRV Oracle - Blockchain and oracle service
  knirv-oracle:
    build:
      context: ${KNIRVORACLE_DIR:-../packages/KNIRVORACLE}
      dockerfile: Dockerfile
    container_name: knirv-oracle
    ports:
      - "1317:1317"
    environment:
      - PORT=1317
      - KNIRV_ENV=production
    depends_on:
      - ipfs
    networks:
      - knirv-testnet
    volumes:
      - ./data/knirvoracle:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1317/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KNIRV Chain - Rust blockchain service
  knirv-chain:
    build:
      context: ../packages/KNIRVCHAIN
      dockerfile: Dockerfile
    container_name: knirv-chain
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - KNIRV_ENV=production
      - RUST_LOG=info
    depends_on:
      - knirv-oracle
      - ipfs
    networks:
      - knirv-testnet
    volumes:
      - ./data/knirvchain:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KNIRV Graph - Knowledge graph service
  knirv-graph:
    build:
      context: ../packages/KNIRVGRAPH
      dockerfile: Dockerfile
    container_name: knirv-graph
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - KNIRV_ENV=production
      - KNIRV_LOG_LEVEL=info
    depends_on:
      - knirv-oracle
      - ipfs
    networks:
      - knirv-testnet
    volumes:
      - ./data/knirvgraph:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KNIRV Server - DVE management service (formerly KNIRVSERVER)
  knirv-server:
    build:
      context: ../packages/KNIRVSERVER
      dockerfile: Dockerfile
    container_name: knirv-server
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - SERVER_ENV=production
      - SERVER_LOG_LEVEL=info
      - SERVER_CONFIG=/opt/knirv-server/config/server.yaml
      - SERVER_DATA_DIR=/var/lib/knirv-server
    depends_on:
      - knirv-oracle
    networks:
      - knirv-testnet
    volumes:
      - ./data/knirvserver:/var/lib/knirv-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # KNIRV Router - Network routing service
  knirv-router:
    build:
      context: ../packages/KNIRVROUTER
      dockerfile: Dockerfile
    container_name: knirv-router
    ports:
      - "8086:8086"
      - "3478:3478"
      - "5349:5349"
    environment:
      - PORT=8086
      - KNIRV_ENV=production
      - KNIRV_LOG_LEVEL=info
    depends_on:
      - knirv-oracle
    networks:
      - knirv-testnet
    volumes:
      - ./data/knirvrouter:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  knirv-testnet:
    name: knirv-testnet
    driver: bridge

volumes:
  ipfs-data:
  oracle-data:
  chain-data:
  graph-data:
  server-data:
  router-data:
