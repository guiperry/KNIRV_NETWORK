# This is a Render Blueprint, which defines a multi-service application.
# It replaces the single-service Docker deployment with a robust,
# scalable, and maintainable architecture.

services:
  # 1. The Public-Facing Testnet Gateway (Static Web Portal)
  # This serves the main testnet landing page and web interface
  - type: web
    name: knirv-testnet-gateway
    runtime: docker
    plan: starter
    region: oregon
    # Points to the testnet-gateway Dockerfile
    dockerfilePath: ./testnet-gateway.Dockerfile
    envVars:
      - key: DEPLOYMENT_ENV
        value: testnet
      # The URLs for the backend services now use Render's internal service names.
      # Render automatically creates DNS records like `http://knirv-oracle:1317`.
      - key: KNIRVORACLE_API
        value: http://knirv-oracle:1317
      - key: KNIRVCHAIN_API
        value: http://knirv-chain:8090
      - key: KNIRVGRAPH_API
        value: http://knirv-graph:8082
      - key: KNIRVNEXUS_API
        value: http://knirv-nexus:8084
      - key: KNIRVROUTER_API
        value: http://knirv-router:8086
      - key: POSTGRES_CONNECTION_STRING
        fromDatabase:
          name: knirv-postgres
          property: connectionString
      - key: REDIS_CONNECTION_STRING
        fromDatabase:
          name: knirv-redis
          property: connectionString

  # 2. KNIRV Oracle (Private Service)
  # Not directly accessible from the internet.
  - type: pserv # Private Service
    name: knirv-oracle
    runtime: docker
    plan: starter
    region: oregon
    # Points to the Dockerfile for this specific service
    dockerfilePath: ./KNIRVORACLE/Dockerfile
    # Render provides internal DNS, so we set the port it listens on
    envVars:
      - key: PORT
        value: 1317

  # 3. KNIRV Chain (Private Service)
  - type: pserv
    name: knirv-chain
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./KNIRVCHAIN/Dockerfile
    envVars:
      - key: PORT
        value: 8090
      - key: KNIRV_ENV
        value: production
      - key: RUST_LOG
        value: info

  # 4. KNIRV Graph (Private Service)
  - type: pserv
    name: knirv-graph
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./KNIRVGRAPH/Dockerfile
    envVars:
      - key: PORT
        value: 8082
      - key: KNIRV_ENV
        value: production
      - key: KNIRV_LOG_LEVEL
        value: info

  # 5. KNIRV Nexus (Private Service)
  - type: pserv
    name: knirv-nexus
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./KNIRVSERVER/Dockerfile
    envVars:
      - key: PORT
        value: 8084
      - key: NEXUS_ENV
        value: production
      - key: NEXUS_LOG_LEVEL
        value: info
      - key: NEXUS_CONFIG
        value: /opt/knirv-nexus/config/nexus.yaml
      - key: NEXUS_DATA_DIR
        value: /var/lib/knirv-nexus

  # 6. KNIRV Router (Private Service)
  - type: pserv
    name: knirv-router
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./KNIRVROUTER/Dockerfile
    envVars:
      - key: PORT
        value: 8086
      - key: KNIRV_ENV
        value: production
      - key: KNIRV_LOG_LEVEL
        value: info

databases:
  # Use Render's managed services for your databases for reliability and scalability.
  - name: knirv-postgres
    databaseName: knirv_testnet
    user: knirv_user
    plan: starter
    region: oregon

  - name: knirv-redis
    plan: starter
    region: oregon
