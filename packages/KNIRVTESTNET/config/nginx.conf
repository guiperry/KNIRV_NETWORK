# KNIRV Testnet NGINX Network Manager Configuration
# Handles routing from EC2 instance ports to Docker container ports

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    
    # DNS resolver for dynamic container name resolution
    resolver 127.0.0.11 valid=30s;

    # Upstream definitions for stable services only
    upstream knirvchain_backend {
        server knirv-testnet-chain:8090 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream knirvgraph_backend {
        server knirv-testnet-graph:8082 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream knirvnexus_dve_backend {
        server knirv-testnet-nexus-1:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream knirvnexus_val_backend {
        server knirv-testnet-nexus-2:8084 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream knirvgateway_backend {
        server knirv-testnet-gateway:10000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream knirvana_backend {
        server knirv-testnet-knirvana:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream xion_bridge_backend {
        server knirv-testnet-xion-bridge:8088 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream ipfs_api_backend {
        server knirv-testnet-ipfs:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream ipfs_gateway_backend {
        server knirv-testnet-ipfs:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Default server block
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Health check endpoint
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Default response
        location / {
            return 200 '{"status":"KNIRV Testnet Network Manager","services":["oracle","chain","graph","nexus","router","gateway","knirvana","xion-bridge","ipfs"],"timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }
    }
    
    # KNIRVORACLE - Port 1317
    server {
        listen 1317;
        listen [::]:1317;
        server_name _;
        
        limit_req zone=api burst=20 nodelay;
        
        location / {
            proxy_pass http://knirvoracle_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        location /health {
            proxy_pass http://knirvoracle_backend/health;
            access_log off;
        }
    }
    
    # KNIRVCHAIN - Port 8090
    server {
        listen 8090;
        listen [::]:8090;
        server_name _;
        
        limit_req zone=api burst=20 nodelay;
        
