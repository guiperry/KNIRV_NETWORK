# KNIRVTESTNET Staging Endpoints Configuration
# Single domain with path-based routing for Render deployment
# Use when subdomains are not available

environment: staging-testnet
generated_at: "2025-08-19T00:00:00Z"

# Staging Service Endpoints - All on testnet.knirv.com with path routing
endpoints:
  KNIRVCHAIN_API: "https://testnet.knirv.com/chain"
  KNIRVGRAPH_API: "https://testnet.knirv.com/graph"
  KNIRVNEXUS_API: "https://testnet.knirv.com/nexus"
  KNIRVNEXUS_GUI_API: "https://testnet.knirv.com/nexus-portal"
  KNIRVNEXUS_DVE_API: "https://testnet.knirv.com/nexus-dve"
  KNIRVNEXUS_VALIDATION_API: "https://testnet.knirv.com/nexus-validation"
  KNIRVORACLE_API: "https://testnet.knirv.com/oracle"
  KNIRVROUTER_API: "https://testnet.knirv.com/router"
  KNIRVANA_API: "https://testnet.knirv.com/knirvana"
  KNIRVANA_INTERACTIVE_GRAPH: "https://testnet.knirv.com/knirvana-graph"

# Gateway Service Endpoints
gateway_endpoints:
  GATEWAY_HEALTH: "https://testnet.knirv.com/gateway/health"
  SERVICE_DISCOVERY: "https://testnet.knirv.com/gateway/services"
  TESTNET_STATUS: "https://testnet.knirv.com/gateway/testnet/status"
  AUTH_TOKENS: "https://testnet.knirv.com/auth/testnet-tokens"

# Staging Configuration
config:
  NODE_ENV: staging-testnet
  DEPLOYMENT_ENV: staging
  TESTNET_MODE: true
  DEBUG_MODE: true
  ENABLE_CORS: true
  SINGLE_DOMAIN_MODE: true
  BASE_URL: "https://testnet.knirv.com"

# Features
features:
  interactiveGraph: true
  testnetMode: true
  debugMode: true
  enableMockData: true
  singleDomainRouting: true
  pathBasedServices: true
