# CORTEX Demo Scenarios Configuration

scenarios:
  skill-development:
    name: "CORTEX Skill Development Demo"
    description: "Demonstrates CORTEX agent creating and registering a new skill"
    duration: "10m"
    type: "demo"
    participants:
      - type: "cortex_agent"
        id: "cortex-dev-001"
        role: "developer"
        capabilities: ["skill-creation", "code-generation", "testing"]
      - type: "service"
        id: "knirvchain"
        role: "skill-registry"
      - type: "service"
        id: "knirvgraph"
        role: "knowledge-storage"
      - type: "service"
        id: "knirv-nexus"
        role: "validation"
    
    workflow:
      - step: "initialize_agent"
        description: "Initialize CORTEX developer agent"
        action: "agent_init"
        target: "cortex-dev-001"
        timeout: "30s"
        validation:
          - type: "agent_status"
            expected: "active"
      
      - step: "create_skill"
        description: "Agent creates new coding skill"
        action: "skill_create"
        target: "cortex-dev-001"
        parameters:
          skill_type: "code_generation"
          language: "python"
          complexity: "intermediate"
          description: "Python web scraping automation"
        timeout: "2m"
        validation:
          - type: "skill_created"
            expected: true
      
      - step: "register_skill"
        description: "Register skill on KNIRVCHAIN"
        action: "blockchain_register"
        target: "knirvchain"
        parameters:
          skill_id: "${previous.skill_id}"
          creator: "cortex-dev-001"
          price: 50
        timeout: "1m"
        validation:
          - type: "transaction_confirmed"
            expected: true
      
      - step: "update_knowledge_graph"
        description: "Update knowledge graph with new skill"
        action: "graph_update"
        target: "knirvgraph"
        parameters:
          skill_id: "${previous.skill_id}"
          relationships: ["python", "web-scraping", "automation"]
        timeout: "30s"
        validation:
          - type: "graph_updated"
            expected: true
      
      - step: "validate_skill"
        description: "Validate skill through KNIRV-NEXUS"
        action: "skill_validate"
        target: "knirv-nexus"
        parameters:
          skill_id: "${previous.skill_id}"
          validation_type: "automated"
        timeout: "3m"
        validation:
          - type: "validation_passed"
            expected: true
      
      - step: "distribute_rewards"
        description: "Distribute NRN rewards for skill creation"
        action: "reward_distribute"
        target: "knirv-oracle"
        parameters:
          recipient: "cortex-dev-001"
          amount: 100
          reason: "skill_creation"
        timeout: "30s"
        validation:
          - type: "reward_distributed"
            expected: true
      
      - step: "verify_availability"
        description: "Verify skill is available for use"
        action: "skill_query"
        target: "knirvchain"
        parameters:
          skill_id: "${previous.skill_id}"
        timeout: "15s"
        validation:
          - type: "skill_available"
            expected: true

    success_criteria:
      - all_steps_completed: true
      - skill_registered: true
      - validation_passed: true
      - rewards_distributed: true
      - execution_time: "<10m"

  multi-agent-collaboration:
    name: "CORTEX Multi-Agent Collaboration"
    description: "Demonstrates multiple CORTEX agents collaborating on a complex task"
    duration: "15m"
    type: "demo"
    participants:
      - type: "cortex_agent"
        id: "cortex-dev-001"
        role: "task_coordinator"
        capabilities: ["task-decomposition", "coordination", "integration"]
      - type: "cortex_agent"
        id: "cortex-collab-001"
        role: "specialist_a"
        capabilities: ["data-analysis", "pattern-recognition"]
      - type: "cortex_agent"
        id: "cortex-learner-001"
        role: "specialist_b"
        capabilities: ["optimization", "quality-assurance"]
      - type: "service"
        id: "knirv-router"
        role: "communication"
      - type: "service"
        id: "knirvgraph"
        role: "shared-knowledge"
      - type: "service"
        id: "knirv-oracle"
        role: "nrn-management"

    workflow:
      - step: "initialize_agents"
        description: "Initialize all participating agents"
        action: "multi_agent_init"
        target: "all_agents"
        timeout: "1m"
        validation:
          - type: "all_agents_active"
            expected: true

      - step: "receive_complex_task"
        description: "Coordinator receives complex analysis task"
        action: "task_receive"
        target: "cortex-dev-001"
        parameters:
          task_type: "market_analysis"
          complexity: "high"
          deadline: "10m"
          requirements: ["data_processing", "pattern_analysis", "optimization"]
        timeout: "30s"
        validation:
          - type: "task_received"
            expected: true

      - step: "decompose_task"
        description: "Coordinator decomposes task into subtasks"
        action: "task_decompose"
        target: "cortex-dev-001"
        parameters:
          task_id: "${previous.task_id}"
        timeout: "1m"
        validation:
          - type: "subtasks_created"
            expected: true
          - type: "subtask_count"
            expected: ">= 2"

      - step: "assign_subtasks"
        description: "Assign subtasks to specialist agents"
        action: "task_assign"
        target: "cortex-dev-001"
        parameters:
          assignments:
            - agent: "cortex-collab-001"
              subtask: "data_analysis"
            - agent: "cortex-learner-001"
              subtask: "optimization"
        timeout: "30s"
        validation:
          - type: "assignments_confirmed"
            expected: true

      - step: "execute_parallel_work"
        description: "Agents execute their assigned subtasks in parallel"
        action: "parallel_execute"
        target: "specialist_agents"
        timeout: "8m"
        validation:
          - type: "all_subtasks_completed"
            expected: true

      - step: "share_knowledge"
        description: "Agents share findings via KNIRVGRAPH"
        action: "knowledge_share"
        target: "knirvgraph"
        parameters:
          session_id: "${collaboration.session_id}"
          findings: "${previous.results}"
        timeout: "1m"
        validation:
          - type: "knowledge_shared"
            expected: true

      - step: "integrate_results"
        description: "Coordinator integrates all results"
        action: "result_integrate"
        target: "cortex-dev-001"
        parameters:
          subtask_results: "${previous.findings}"
        timeout: "2m"
        validation:
          - type: "integration_successful"
            expected: true

      - step: "distribute_rewards"
        description: "Distribute collaborative rewards"
        action: "collaborative_reward"
        target: "knirv-oracle"
        parameters:
          participants: ["cortex-dev-001", "cortex-collab-001", "cortex-learner-001"]
          total_reward: 300
          distribution: "equal"
        timeout: "30s"
        validation:
          - type: "rewards_distributed"
            expected: true

    success_criteria:
      - all_agents_participated: true
      - task_completed: true
      - knowledge_shared: true
      - collaboration_effective: true
      - execution_time: "<15m"

  learning-adaptation:
    name: "CORTEX Learning and Adaptation Demo"
    description: "Demonstrates CORTEX agent learning and improving performance"
    duration: "20m"
    type: "demo"
    participants:
      - type: "cortex_agent"
        id: "cortex-learner-001"
        role: "learner"
        capabilities: ["adaptation", "pattern-recognition", "optimization"]
      - type: "component"
        id: "seal_framework"
        role: "learning_engine"
      - type: "component"
        id: "hrm_bridge"
        role: "cognitive_processing"
      - type: "component"
        id: "lora_adapter"
        role: "neural_adaptation"

    workflow:
      - step: "initialize_learning_agent"
        description: "Initialize agent with baseline capabilities"
        action: "learning_agent_init"
        target: "cortex-learner-001"
        parameters:
          baseline_performance: 0.6
          learning_rate: 0.1
        timeout: "1m"
        validation:
          - type: "agent_initialized"
            expected: true
          - type: "baseline_established"
            expected: true

      - step: "present_novel_task"
        description: "Present agent with unfamiliar task type"
        action: "novel_task_present"
        target: "cortex-learner-001"
        parameters:
          task_type: "quantum_algorithm_optimization"
          difficulty: "high"
          success_threshold: 0.8
        timeout: "30s"
        validation:
          - type: "task_accepted"
            expected: true

      - step: "initial_attempt"
        description: "Agent attempts task with base knowledge"
        action: "task_attempt"
        target: "cortex-learner-001"
        parameters:
          attempt_number: 1
          use_learning: false
        timeout: "3m"
        validation:
          - type: "attempt_completed"
            expected: true
          - type: "performance_recorded"
            expected: true

      - step: "collect_feedback"
        description: "Collect performance feedback and error analysis"
        action: "feedback_collect"
        target: "cortex-learner-001"
        parameters:
          performance_data: "${previous.performance}"
          error_analysis: true
        timeout: "1m"
        validation:
          - type: "feedback_collected"
            expected: true

      - step: "seal_adaptation"
        description: "SEAL framework adapts agent behavior"
        action: "seal_adapt"
        target: "seal_framework"
        parameters:
          agent_id: "cortex-learner-001"
          feedback: "${previous.feedback}"
          adaptation_type: "behavioral"
        timeout: "2m"
        validation:
          - type: "adaptation_applied"
            expected: true

      - step: "hrm_processing"
        description: "HRM processes cognitive patterns"
        action: "hrm_process"
        target: "hrm_bridge"
        parameters:
          cognitive_data: "${previous.patterns}"
          processing_mode: "deep_analysis"
        timeout: "3m"
        validation:
          - type: "cognitive_patterns_identified"
            expected: true

      - step: "lora_fine_tuning"
        description: "LoRA adapter fine-tunes neural responses"
        action: "lora_tune"
        target: "lora_adapter"
        parameters:
          model_state: "${previous.model_state}"
          training_data: "${feedback.training_data}"
          epochs: 10
        timeout: "5m"
        validation:
          - type: "fine_tuning_completed"
            expected: true

      - step: "improved_attempt"
        description: "Agent reattempts task with improvements"
        action: "task_attempt"
        target: "cortex-learner-001"
        parameters:
          attempt_number: 2
          use_learning: true
        timeout: "3m"
        validation:
          - type: "attempt_completed"
            expected: true
          - type: "performance_improved"
            expected: true

      - step: "validate_learning"
        description: "Validate learning effectiveness"
        action: "learning_validate"
        target: "cortex-learner-001"
        parameters:
          baseline_performance: "${initial.performance}"
          current_performance: "${improved.performance}"
          improvement_threshold: 0.2
        timeout: "1m"
        validation:
          - type: "learning_validated"
            expected: true
          - type: "improvement_significant"
            expected: true

      - step: "demonstrate_retention"
        description: "Demonstrate knowledge retention on similar task"
        action: "retention_test"
        target: "cortex-learner-001"
        parameters:
          task_variant: "quantum_algorithm_optimization_v2"
          expected_performance: ">= ${improved.performance}"
        timeout: "2m"
        validation:
          - type: "retention_demonstrated"
            expected: true

    success_criteria:
      - learning_demonstrated: true
      - performance_improved: ">= 20%"
      - adaptation_successful: true
      - retention_confirmed: true
      - execution_time: "<20m"

# Global configuration
global_config:
  default_timeout: "30s"
  retry_attempts: 3
  parallel_execution: true
  metrics_collection: true
  real_time_monitoring: true
  
  validation_types:
    - agent_status
    - skill_created
    - transaction_confirmed
    - graph_updated
    - validation_passed
    - reward_distributed
    - skill_available
    - all_agents_active
    - task_received
    - subtasks_created
    - assignments_confirmed
    - all_subtasks_completed
    - knowledge_shared
    - integration_successful
    - rewards_distributed
    - agent_initialized
    - baseline_established
    - task_accepted
    - attempt_completed
    - performance_recorded
    - feedback_collected
    - adaptation_applied
    - cognitive_patterns_identified
    - fine_tuning_completed
    - performance_improved
    - learning_validated
    - improvement_significant
    - retention_demonstrated

  action_types:
    - agent_init
    - skill_create
    - blockchain_register
    - graph_update
    - skill_validate
    - reward_distribute
    - skill_query
    - multi_agent_init
    - task_receive
    - task_decompose
    - task_assign
    - parallel_execute
    - knowledge_share
    - result_integrate
    - collaborative_reward
    - learning_agent_init
    - novel_task_present
    - task_attempt
    - feedback_collect
    - seal_adapt
    - hrm_process
    - lora_tune
    - learning_validate
    - retention_test
