<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Integration Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1e293b, #7c3aed, #1e293b);
            color: white;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        .edge-coloring {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
        }
        
        .edge {
            position: absolute;
            transition: all 0.5s ease;
        }
        
        .edge-top, .edge-bottom {
            left: 0;
            right: 0;
            height: 4px;
        }
        
        .edge-top { top: 0; }
        .edge-bottom { bottom: 0; }
        
        .edge-left, .edge-right {
            top: 0;
            bottom: 0;
            width: 4px;
        }
        
        .edge-left { left: 0; }
        .edge-right { right: 0; }
        
        .voice-button {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .voice-button.active {
            background: #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        }
        
        .voice-button.inactive {
            background: #374151;
            color: #9ca3af;
        }
        
        .status {
            margin: 20px 0;
            padding: 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .transcript {
            margin: 20px 0;
            padding: 15px;
            border-radius: 8px;
            background: rgba(139, 92, 246, 0.2);
            border: 1px solid rgba(139, 92, 246, 0.3);
            min-height: 50px;
        }
    </style>
</head>
<body>
    <div class="edge-coloring" id="edgeColoring">
        <div class="edge edge-top" id="edgeTop"></div>
        <div class="edge edge-right" id="edgeRight"></div>
        <div class="edge edge-bottom" id="edgeBottom"></div>
        <div class="edge edge-left" id="edgeLeft"></div>
    </div>

    <div class="container">
        <h1>KNIRV-CONTROLLER Voice Integration Test</h1>
        <p>Testing the merged voice functionality and edge coloring effects</p>
        
        <div class="status" id="status">
            Status: <span id="statusText">Idle</span>
        </div>
        
        <button class="voice-button inactive" id="voiceButton" onclick="toggleVoice()">
            🎤
        </button>
        
        <div class="transcript" id="transcript">
            Voice commands will appear here...
        </div>
        
        <div>
            <h3>Test Commands:</h3>
            <ul style="text-align: left; display: inline-block;">
                <li>"Show skills page"</li>
                <li>"Navigate to wallet"</li>
                <li>"Check agent status"</li>
                <li>"Toggle cognitive mode"</li>
                <li>"Show network status"</li>
            </ul>
        </div>
    </div>

    <script>
        let isVoiceActive = false;
        let recognition = null;
        let currentStatus = 'idle';
        
        // Initialize speech recognition
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';
            
            recognition.onstart = () => {
                updateStatus('listening');
                updateEdgeColoring('#14B8A6', 0.8);
            };
            
            recognition.onresult = (event) => {
                const results = Array.from(event.results);
                const latestResult = results[results.length - 1];
                
                if (latestResult.isFinal) {
                    const text = latestResult[0].transcript;
                    document.getElementById('transcript').textContent = text;
                    processVoiceCommand(text);
                }
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                updateStatus('error');
                updateEdgeColoring('#EF4444', 0.7);
            };
            
            recognition.onend = () => {
                if (isVoiceActive) {
                    setTimeout(() => {
                        if (isVoiceActive) {
                            recognition.start();
                        }
                    }, 100);
                } else {
                    updateStatus('idle');
                    updateEdgeColoring('#10B981', 0.3);
                }
            };
        }
        
        function toggleVoice() {
            if (!recognition) {
                alert('Speech recognition not supported in this browser');
                return;
            }
            
            isVoiceActive = !isVoiceActive;
            const button = document.getElementById('voiceButton');
            
            if (isVoiceActive) {
                button.className = 'voice-button active';
                recognition.start();
            } else {
                button.className = 'voice-button inactive';
                recognition.stop();
                updateStatus('idle');
                updateEdgeColoring('#10B981', 0.3);
            }
        }
        
        function updateStatus(status) {
            currentStatus = status;
            const statusText = document.getElementById('statusText');
            statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }
        
        function updateEdgeColoring(color, intensity) {
            const edges = ['edgeTop', 'edgeRight', 'edgeBottom', 'edgeLeft'];
            edges.forEach(edgeId => {
                const edge = document.getElementById(edgeId);
                edge.style.background = `linear-gradient(${edgeId.includes('Top') || edgeId.includes('Bottom') ? 'to right' : 'to bottom'}, transparent, ${color}, transparent)`;
                edge.style.opacity = intensity;
            });
        }
        
        function processVoiceCommand(command) {
            updateStatus('processing');
            updateEdgeColoring('#3B82F6', 0.9);
            
            const lowerCommand = command.toLowerCase();
            let response = '';
            
            if (lowerCommand.includes('skills') || lowerCommand.includes('skill')) {
                response = 'Navigating to skills page...';
            } else if (lowerCommand.includes('wallet')) {
                response = 'Opening wallet...';
            } else if (lowerCommand.includes('agent') && lowerCommand.includes('status')) {
                response = 'Checking agent status...';
            } else if (lowerCommand.includes('cognitive mode')) {
                response = 'Toggling cognitive mode...';
            } else if (lowerCommand.includes('network')) {
                response = 'Showing network status...';
            } else {
                response = 'Command recognized: ' + command;
            }
            
            // Simulate processing and speaking
            setTimeout(() => {
                updateStatus('speaking');
                updateEdgeColoring('#8B5CF6', 1.0);
                document.getElementById('transcript').textContent = response;
                
                // Simulate speech duration
                setTimeout(() => {
                    updateStatus('listening');
                    updateEdgeColoring('#14B8A6', 0.8);
                    document.getElementById('transcript').textContent = 'Listening for next command...';
                }, 2000);
            }, 1000);
        }
        
        // Initialize edge coloring
        updateEdgeColoring('#10B981', 0.3);
    </script>
</body>
</html>
