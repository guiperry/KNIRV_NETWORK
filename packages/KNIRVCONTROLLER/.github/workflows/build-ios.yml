name: Build iOS

# This job builds an UNSIGNED iOS .ipa on a GitHub-hosted macOS runner. No
# Apple Developer Program account is required here: signing happens later,
# locally on your Mac, via `scripts/sign-ios-app.sh` (zsign + Anisette).
# See the job summary on each run for the exact next steps.

on:
  push:
    branches: [main]
    paths: ['packages/KNIRVCONTROLLER/**']
  pull_request:
    branches: [main]
    paths: ['packages/KNIRVCONTROLLER/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: packages/KNIRVCONTROLLER/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/KNIRVCONTROLLER

      - name: Build web assets
        run: npm run build
        working-directory: packages/KNIRVCONTROLLER
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_XION_RPC_URL: ${{ secrets.VITE_XION_RPC_URL }}
          VITE_KNIRV_CHAIN_ID: ${{ secrets.VITE_KNIRV_CHAIN_ID }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: packages/KNIRVCONTROLLER

      - name: Cache Swift Package Manager repository cache
        uses: actions/cache@v4
        with:
          # release-native.mjs wipes build/ios-release (including any DerivedData)
          # on every run, so cache SwiftPM's shared repository cache instead —
          # it lives outside the repo and survives that cleanup.
          path: ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('packages/KNIRVCONTROLLER/ios/App/CapApp-SPM/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build unsigned IPA
        run: npm run release:ios:unsigned
        working-directory: packages/KNIRVCONTROLLER

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: knirv-controller-ios-unsigned
          path: packages/KNIRVCONTROLLER/build/knirvconroller-ios-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Signing instructions
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Unsigned iOS build ready

          This build has **no code signature** — CI never touches your Apple ID or
          any certificate. Sign it yourself, locally, on a Mac:

          1. Download the `knirv-controller-ios-unsigned` artifact from this run.
          2. Save it as `packages/KNIRVCONTROLLER/build/knirvconroller-ios-unsigned.ipa`
             (create the `build/` folder if needed).
          3. Make sure `zsign` is installed and an Anisette server is reachable
             (defaults to `http://localhost:6969`) — see `scripts/sign-ios-app.sh`
             for the required environment variables (`KNIRV_IOS_P12`,
             `KNIRV_IOS_P12_PASSWORD`, `KNIRV_IOS_PROVISION_PROFILE`).
          4. From `packages/KNIRVCONTROLLER`, run:
             `./scripts/sign-ios-app.sh`
          5. Install the resulting `build/knirvconroller-ios-release.ipa` on your
             registered device (Xcode → Devices and Simulators, `ideviceinstaller`,
             or a sideloading tool).
          EOF
