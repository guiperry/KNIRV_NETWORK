<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="assets/favicon.png">
    <title>KNIRV Network Health Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .knirv-gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .knirv-card-gradient {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .knirv-gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .status-healthy { color: #10b981; }
        .status-degraded { color: #f59e0b; }
        .status-unhealthy { color: #ef4444; }
        .pulse-dot {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
    </style>
</head>
<body class="min-h-screen knirv-gradient-bg text-white">
    <!-- Header -->
    <header class="bg-black/20 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <svg class="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
                    </svg>
                    <div>
                        <h1 class="text-2xl font-bold knirv-gradient-text">KNIRV Network</h1>
                        <p class="text-sm text-gray-300">Health Monitor</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <div id="overall-status-dot" class="w-3 h-3 rounded-full pulse-dot"></div>
                        <span id="overall-status-text" class="text-sm font-medium">Loading...</span>
                    </div>
                    <a href="/" class="text-blue-400 hover:text-blue-300 font-medium">
                        ← Back to Gateway
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <!-- Overall Status -->
        <div class="mb-8">
            <div class="knirv-card-gradient p-6 rounded-lg">
                <div class="flex items-center justify-between">
                    <div>
                        <h2 class="text-xl font-bold mb-2">Network Status</h2>
                        <p id="overall-description" class="text-gray-300">Checking network health...</p>
                    </div>
                    <div class="text-right">
                        <div id="last-updated" class="text-sm text-gray-400">Last updated: --</div>
                        <div id="services-count" class="text-lg font-semibold">-- services</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Services Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <div id="services-container">
                <!-- Services will be populated here -->
            </div>
        </div>

        <!-- Auto-refresh Controls -->
        <div class="knirv-card-gradient p-4 rounded-lg">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" id="auto-refresh" checked class="rounded">
                        <span class="text-sm">Auto-refresh</span>
                    </label>
                    <select id="refresh-interval" class="bg-black/20 border border-white/20 rounded px-2 py-1 text-sm">
                        <option value="5000">5 seconds</option>
                        <option value="10000" selected>10 seconds</option>
                        <option value="30000">30 seconds</option>
                        <option value="60000">1 minute</option>
                    </select>
                </div>
                <button id="refresh-now" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-sm font-medium">
                    Refresh Now
                </button>
            </div>
        </div>
    </main>

    <script>
        let refreshInterval;
        let isRefreshing = false;

        // Service name mapping
        const serviceNames = {
            knirvchain: 'KNIRV-CHAIN',
            knirvgraph: 'KNIRV-GRAPH', 
            knirvserver: 'KNIRV-NEXUS',
            knirvoracle: 'KNIRV-ORACLE'
        };

        async function fetchHealthData() {
            if (isRefreshing) return;
            isRefreshing = true;

            try {
                const response = await fetch('/health-monitor/status');
                const data = await response.json();
                updateHealthDisplay(data);
            } catch (error) {
                console.error('Failed to fetch health data:', error);
                showError('Failed to connect to health monitor');
            } finally {
                isRefreshing = false;
            }
        }

        function updateHealthDisplay(data) {
            // Update overall status
            const overallHealthy = data.overall === 'healthy';
            const overallDot = document.getElementById('overall-status-dot');
            const overallText = document.getElementById('overall-status-text');
            
            overallDot.className = `w-3 h-3 rounded-full pulse-dot ${overallHealthy ? 'bg-green-500' : 'bg-yellow-500'}`;
            overallText.textContent = overallHealthy ? 'All Systems Operational' : 'Some Issues Detected';
            overallText.className = `text-sm font-medium ${overallHealthy ? 'status-healthy' : 'status-degraded'}`;

            // Update description and counts
            document.getElementById('overall-description').textContent = 
                `Network is ${data.overall}. ${Object.keys(data.services).length} services monitored.`;
            document.getElementById('services-count').textContent = `${Object.keys(data.services).length} services`;
            document.getElementById('last-updated').textContent = `Last updated: ${new Date(data.timestamp).toLocaleTimeString()}`;

            // Update services
            updateServicesDisplay(data.services);
        }

        function updateServicesDisplay(services) {
            const container = document.getElementById('services-container');
            container.innerHTML = '';

            Object.entries(services).forEach(([serviceName, serviceData]) => {
                const serviceCard = createServiceCard(serviceName, serviceData);
                container.appendChild(serviceCard);
            });
        }

        function createServiceCard(serviceName, serviceData) {
            const card = document.createElement('div');
            card.className = 'knirv-card-gradient p-4 rounded-lg';
            
            const displayName = serviceNames[serviceName] || serviceName.toUpperCase();
            const statusClass = serviceData.healthy ? 'status-healthy' : 'status-unhealthy';
            const statusText = serviceData.healthy ? 'Healthy' : 'Unhealthy';
            const statusIcon = serviceData.healthy ? '✓' : '✗';

            card.innerHTML = `
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-semibold">${displayName}</h3>
                    <span class="${statusClass} font-medium">${statusIcon} ${statusText}</span>
                </div>
                <div class="space-y-2 text-sm">
                    <div class="flex justify-between">
                        <span class="text-gray-400">Status Code:</span>
                        <span>${serviceData.status || 'N/A'}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Response Time:</span>
                        <span>${serviceData.responseTime || 'N/A'}ms</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-400">Last Check:</span>
                        <span>${serviceData.lastCheck ? new Date(serviceData.lastCheck).toLocaleTimeString() : 'N/A'}</span>
                    </div>
                </div>
            `;

            return card;
        }

        function showError(message) {
            const overallText = document.getElementById('overall-status-text');
            const overallDot = document.getElementById('overall-status-dot');
            
            overallDot.className = 'w-3 h-3 rounded-full bg-red-500 pulse-dot';
            overallText.textContent = message;
            overallText.className = 'text-sm font-medium status-unhealthy';
        }

        function setupAutoRefresh() {
            const autoRefreshCheckbox = document.getElementById('auto-refresh');
            const refreshIntervalSelect = document.getElementById('refresh-interval');
            const refreshNowButton = document.getElementById('refresh-now');

            function updateRefreshInterval() {
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }

                if (autoRefreshCheckbox.checked) {
                    const interval = parseInt(refreshIntervalSelect.value);
                    refreshInterval = setInterval(fetchHealthData, interval);
                }
            }

            autoRefreshCheckbox.addEventListener('change', updateRefreshInterval);
            refreshIntervalSelect.addEventListener('change', updateRefreshInterval);
            refreshNowButton.addEventListener('click', fetchHealthData);

            // Start auto-refresh
            updateRefreshInterval();
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchHealthData();
            setupAutoRefresh();
        });
    </script>

    <!-- Universal Footer Scripts -->
    <script src="js/config-loader.js"></script>
    <script src="js/universal-footer.js"></script>
</body>
</html>
