[package]
name = "knirv-head"
version = "0.2.0"
edition = "2021"
description = "knirv-head: Hierarchical Reasoning Model (H/L recurrent, ACT halting, decision heads). Native trainer, browser WASM and WASI builds share this source."
repository = "https://github.com/guiperry/KNIRV_NETWORK"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "0.11"
candle-nn = "0.11"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Browser builds need getrandom's JS backend (candle pulls rand in).
# Also requires RUSTFLAGS='--cfg getrandom_backend="wasm_js"' (set by `npm run build:head`).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = "s"
lto = true
