[package]
name = "knirv-model-forge"
version = "0.1.0"
edition = "2021"
description = "KNIRV Model Forge - ingestion/normalization/compilation pipeline"

[dependencies]
shared-types = { path = "../shared-types", package = "knirv-cortex-shared-types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "fs", "macros", "io-util", "time"] }
sha2 = "0.10"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
uuid = { version = "1.0", features = ["v4"] }

[[bin]]
name = "forge"
path = "src/main.rs"
