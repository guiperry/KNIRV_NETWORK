<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Submit Ticket - KNIRV Support Desk</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/hesk.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Submit Support Ticket</h1>
            <nav class="nav">
                <a href="index.html">Home</a>
                <a href="submit_ticket.html" class="active">Submit Ticket</a>
                <a href="knowledgebase.html">Knowledge Base</a>
                <a href="viewticket.html">View Ticket</a>
            </nav>
        </header>

        <main class="main-content">
            <form id="ticket-form" class="ticket-form">
                <div class="form-group">
                    <label for="name">Your Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option value="general">General Support</option>
                        <option value="technical">Technical Issue</option>
                        <option value="billing">Billing Question</option>
                        <option value="feature">Feature Request</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="priority">Priority</label>
                    <select id="priority" name="priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="subject">Subject *</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message *</label>
                    <textarea id="message" name="message" rows="8" required></textarea>
                </div>

                <div class="form-group">
                    <label for="attachments">Attachments</label>
                    <input type="file" id="attachments" name="attachments" multiple>
                    <small>Maximum file size: 10MB. Allowed types: jpg, png, gif, pdf, doc, docx, txt</small>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit Ticket</button>
                    <button type="reset" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </main>
    </div>

    <script src="js/hesk-common.js"></script>
    <script src="js/hesk-submit.js"></script>
</body>
</html>
