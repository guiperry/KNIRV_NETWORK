hasher:
  socket: "/var/run/hasher.sock"
  timeout: 300

source:
  org_id: "org_default"
  user_id: "all"
  data_types:
    - "ALL"

output:
  arrow_dir: "/tmp/hasher/frames/arrow"
  json_dir: "/tmp/hasher/frames/json"
  batch_size: 100

processing:
  max_concurrent: 4
  pii_scrub: true
  deduplicate: true

security:
  pqc_key_id: "default"
