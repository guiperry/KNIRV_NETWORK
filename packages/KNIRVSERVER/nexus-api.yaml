openapi: 3.1.0
info:
  title: KNIRVNEXUS API
  description: |
    KNIRVNEXUS - Comprehensive platform layer for the KNIRV Network ecosystem.
    Powered by Agentic Memory Fabric stack.

    This API provides:
    - Authentication and user management
    - DVE (Distributed Virtual Environment) management
    - Agentic Memory Fabric validation and testing
    - TEE (Trusted Execution Environment) security
    - System health monitoring and analytics
    - Fabric unit management and deployment
    - Cognitive engine for advanced AI features
  version: "1.1.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com

servers:
  - url: http://localhost:8082
    description: Unified development server

tags:
  - name: auth
    description: Authentication and user management
  - name: dve
    description: Distributed Virtual Environment management
  - name: fabric
    description: Agentic Memory Fabric validation and management
  - name: tee
    description: Trusted Execution Environment
  - name: health
    description: System health and monitoring
  - name: cognitive
    description: Advanced AI and cognitive services

paths:
  # Authentication
  /api/auth/login:
    post:
      tags:
        - auth
      summary: User login
      description: Authenticate user and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authentication successful

  # Fabric Management
  /api/fabric-management/objects:
    get:
      tags:
        - fabric
      summary: List Fabric Items
      description: Get list of all Agentic Memory Fabric units
      responses:
        '200':
          description: List of fabrics
    post:
      tags:
        - fabric
      summary: Create Fabric Item
      description: Register a new Fabric unit
      responses:
        '201':
          description: Fabric created

  /api/fabric-management/objects/{id}:
    get:
      tags:
        - fabric
      summary: Get Fabric Detail
      responses:
        '200':
          description: Fabric details
    put:
      tags:
        - fabric
      summary: Update Fabric Item
    delete:
      tags:
        - fabric
      summary: Delete Fabric Item

  /api/fabric-management/summary:
    get:
      tags:
        - fabric
      summary: Fabric Network Summary
      responses:
        '200':
          description: Statistical summary of fabric units

  # DVE Management
  /api/dve-nodes:
    get:
      tags:
        - dve
      summary: List DVE Nodes
      description: Get list of all Distributed Virtual Environment nodes
      responses:
        '200':
          description: List of DVEs
    post:
      tags:
        - dve
      summary: Register DVE Node
      responses:
        '201':
          description: Node registered successfully

  # TEE Security
  /api/tee/status:
    get:
      tags:
        - tee
      summary: TEE status
      description: Get Trusted Execution Environment status
      responses:
        '200':
          description: TEE status information

  # System Health
  /api/health:
    get:
      tags:
        - health
      summary: System health
      description: Get overall system health status
      responses:
        '200':
          description: Health status

  # Cognitive Engine
  /api/cognitive/status:
    get:
      tags:
        - cognitive
      summary: Cognitive engine status
      responses:
        '200':
          description: Current learning state and metrics

  # Nexus Memory Fabric
  /api/server/events:
    get:
      tags:
        - fabric
      summary: Get Nexus Memory Events
      description: Retrieve recent Intent-Action correlation events captured by eBPF
      responses:
        '200':
          description: List of memory fabric events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NexusEvent'

components:
  schemas:
    NexusEvent:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        agent_id:
          type: string
        intent:
          type: string
        observed_action:
          type: string
        verified:
          type: boolean
    Fabric:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        version:
          type: string

    DVE:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
        resources:
          type: object

    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        services:
          type: object
        timestamp:
          type: string
          format: date-time
