openapi: 3.1.0
info:
  title: KNIRVSERVER API
  description: |
    KNIRVSERVER - Comprehensive platform layer for the KNIRV Network ecosystem.
    Powered by Agentic Memory Fabric stack.

    This API provides:
    - Authentication and user management
    - DVE (Distributed Virtual Environment) management
    - Agentic Memory Fabric validation and testing
    - TEE (Trusted Execution Environment) security
    - System health monitoring and analytics
    - Plugin management and deployment
    - Cognitive engine for advanced AI features
    - Payment processing (Stripe, PayPal, NRN)
    - Workflow execution and orchestration
    - Secret and session management
    - Evidence anchoring to blockchain
    - Knowledge base with GraphRAG integration
    - IC-ME (Intentional Context Memory Engine)
    - WebSocket real-time communication
  version: "1.1.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com

servers:
  - url: http://localhost:8084
    description: KNIRVSERVER main server
  - url: http://localhost:7080
    description: Data Engine REST API

tags:
  - name: health
    description: Health check and system info
  - name: auth
    description: Authentication and user management
  - name: dve
    description: Distributed Virtual Environment management
  - name: dve-creation
    description: DVE creation and templates
  - name: plugin
    description: Plugin management
  - name: agent
    description: Agent management and execution
  - name: payments
    description: Payment processing (Stripe, PayPal)
  - name: nrn-payments
    description: NRN token payments
  - name: knirvshell
    description: KNIRVSHELL CLI operations
  - name: onboarding
    description: Organization onboarding and configuration
  - name: cognitive
    description: Cognitive engine and AI features
  - name: guardrail
    description: Guardrails and policy management
  - name: health-detailed
    description: System health monitoring
  - name: secrets
    description: Secret and session management
  - name: workflow
    description: Workflow execution
  - name: anchoring
    description: Evidence anchoring to blockchain
  - name: tee
    description: Trusted Execution Environment
  - name: memory
    description: Active Memory Layer (Markdown Fabric)
  - name: knowledge-base
    description: Knowledge base with GraphRAG
  - name: knirvgraph
    description: KNIRVGRAPH error nodes
  - name: nexus
    description: Nexus Memory Fabric
  - name: ontology
    description: Ontology management
  - name: analytics
    description: Predictive analytics
  - name: rollups
    description: Transaction rollups
  - name: websocket
    description: WebSocket endpoints
  - name: data-engine
    description: Data Engine REST API
  - name: icme
    description: Intentional Context Memory Engine
  - name: system
    description: System settings

paths:
  # ============================================================================
  # Health & System
  # ============================================================================
  /health:
    get:
      tags: [health]
      summary: Health check (top-level)
      description: Basic health check endpoint
      responses:
        '200':
          description: Server is healthy

  /version:
    get:
      tags: [health]
      summary: Version info
      description: Get server version, build time, and git commit
      responses:
        '200':
          description: Version information

  /api/health:
    get:
      tags: [health]
      summary: API health check
      description: API-specific health check
      responses:
        '200':
          description: API is healthy

  /api/system/info:
    get:
      tags: [system]
      summary: System info
      description: Get system information for HUD/PWA
      responses:
        '200':
          description: System information

  /api/system/detail:
    get:
      tags: [system]
      summary: Detailed system info
      responses:
        '200':
          description: Detailed system information

  /api/system/dht:
    get:
      tags: [system]
      summary: Get DHT settings
      responses:
        '200':
          description: DHT settings
    post:
      tags: [system]
      summary: Update DHT settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: DHT settings updated

  # ============================================================================
  # Authentication
  # ============================================================================
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                email:
                  type: string
      responses:
        '201':
          description: User registered
        '400':
          description: Invalid input

  /api/auth/login:
    post:
      tags: [auth]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh JWT token
      responses:
        '200':
          description: Token refreshed

  /api/auth/revoke:
    post:
      tags: [auth]
      summary: Revoke token
      responses:
        '200':
          description: Token revoked

  /api/auth/verify-email:
    post:
      tags: [auth]
      summary: Verify email
      responses:
        '200':
          description: Email verified

  /api/auth/request-password-reset:
    post:
      tags: [auth]
      summary: Request password reset
      responses:
        '200':
          description: Reset email sent

  /api/auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password
      responses:
        '200':
          description: Password reset successful

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get current user
      description: Requires authentication
      responses:
        '200':
          description: User details

  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Change password
      description: Requires authentication
      responses:
        '200':
          description: Password changed

  /api/auth/update-profile:
    put:
      tags: [auth]
      summary: Update profile
      description: Requires authentication
      responses:
        '200':
          description: Profile updated

  /api/auth/preferences:
    get:
      tags: [auth]
      summary: Get preferences
      description: Requires authentication
      responses:
        '200':
          description: User preferences
    put:
      tags: [auth]
      summary: Update preferences
      description: Requires authentication
      responses:
        '200':
          description: Preferences updated

  # ============================================================================
  # DVE Management (v1 API)
  # ============================================================================
  /api/v1/dve/nodes:
    get:
      tags: [dve]
      summary: List DVE nodes
      responses:
        '200':
          description: List of DVE nodes
    post:
      tags: [dve]
      summary: Create DVE node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                type:
                  type: string
      responses:
        '201':
          description: DVE node created

  /api/v1/dve/nodes/{id}:
    get:
      tags: [dve]
      summary: Get DVE node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DVE node details
    put:
      tags: [dve]
      summary: Update DVE node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DVE node updated
    delete:
      tags: [dve]
      summary: Delete DVE node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DVE node deleted

  /api/v1/dve/nodes/{id}/endpoints:
    get:
      tags: [dve]
      summary: Get DVE node endpoints
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node endpoints

  /api/v1/dve/nodes/{id}/ssh-endpoint:
    get:
      tags: [dve]
      summary: Get DVE SSH endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSH endpoint

  /api/v1/dve/nodes/{id}/validation-endpoint:
    get:
      tags: [dve]
      summary: Get DVE validation endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation endpoint

  /api/v1/dve/nodes/{id}/error-resolution-endpoint:
    get:
      tags: [dve]
      summary: Get DVE error resolution endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Error resolution endpoint

  /api/v1/dve/workers:
    get:
      tags: [dve]
      summary: List DVE workers
      responses:
        '200':
          description: List of workers

  /api/v1/dve/{nodeId}/tasks:
    get:
      tags: [dve]
      summary: Get DVE node tasks
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node tasks

  /api/v1/dve/{nodeId}/metrics:
    get:
      tags: [dve]
      summary: Get DVE node metrics
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node metrics

  /api/v1/dve/{nodeId}/ssh-session:
    post:
      tags: [dve]
      summary: Create SSH session
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: SSH session created

  /api/v1/dve/peers:
    get:
      tags: [dve]
      summary: Get P2P peers
      responses:
        '200':
          description: List of P2P peers

  # DVE Legacy/Proxy Endpoints
  /api/dve/{dveId}:
    get:
      tags: [dve]
      summary: Get DVE public page
      parameters:
        - name: dveId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DVE public page

  /api/dve/{dveId}/validation:
    get:
      tags: [dve]
      summary: Get DVE validation records
      parameters:
        - name: dveId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Validation records

  /api/dve/{dveId}/metrics:
    get:
      tags: [dve]
      summary: Get DVE metrics
      parameters:
        - name: dveId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: DVE metrics

  /api/dve/{dveId}/search:
    get:
      tags: [dve]
      summary: Search DVE
      parameters:
        - name: dveId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Search results

  /api/dve/resolve:
    get:
      tags: [dve]
      summary: Resolve DVE URI
      responses:
        '200':
          description: Resolved DVE

  /api/dve/register:
    post:
      tags: [dve]
      summary: Register DVE
      responses:
        '201':
          description: DVE registered

  # ============================================================================
  # DVE Creation
  # ============================================================================
  /api/dve-creation/create:
    post:
      tags: [dve-creation]
      summary: Create DVE
      responses:
        '201':
          description: DVE created

  /api/dve-creation/templates:
    get:
      tags: [dve-creation]
      summary: List DVE templates
      responses:
        '200':
          description: List of templates
    post:
      tags: [dve-creation]
      summary: Create DVE template
      responses:
        '201':
          description: Template created

  /api/dve-creation/templates/{id}:
    get:
      tags: [dve-creation]
      summary: Get DVE template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template details
    put:
      tags: [dve-creation]
      summary: Update DVE template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template updated
    delete:
      tags: [dve-creation]
      summary: Delete DVE template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Template deleted

  # ============================================================================
  # Plugin Management (v1 API)
  # ============================================================================
  /api/v1/plugin/objects:
    get:
      tags: [plugin]
      summary: List plugins
      responses:
        '200':
          description: List of plugins
    post:
      tags: [plugin]
      summary: Create plugin
      responses:
        '201':
          description: Plugin created

  /api/v1/plugin/objects/{id}:
    get:
      tags: [plugin]
      summary: Get plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin details
    put:
      tags: [plugin]
      summary: Update plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin updated
    delete:
      tags: [plugin]
      summary: Delete plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin deleted

  /api/v1/plugin/objects/{id}/actions:
    post:
      tags: [plugin]
      summary: Execute plugin action
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Action executed

  /api/v1/plugin/objects/{id}/metrics:
    get:
      tags: [plugin]
      summary: Get plugin metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin metrics

  /api/v1/plugin/objects/{id}/logs:
    get:
      tags: [plugin]
      summary: Get plugin logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin logs

  /api/v1/plugin/objects/{id}/events:
    get:
      tags: [plugin]
      summary: Get plugin events
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Plugin events

  /api/v1/plugin/templates:
    get:
      tags: [plugin]
      summary: List plugin templates
      responses:
        '200':
          description: List of templates
    post:
      tags: [plugin]
      summary: Create plugin template
      responses:
        '201':
          description: Template created

  /api/v1/plugin/summary:
    get:
      tags: [plugin]
      summary: Plugin summary
      responses:
        '200':
          description: Plugin summary statistics

  # Legacy Plugin Management
  /api/fabric-management/objects:
    get:
      tags: [plugin]
      summary: List fabric items (legacy)
      responses:
        '200':
          description: List of fabric items
    post:
      tags: [plugin]
      summary: Create fabric item (legacy)
      responses:
        '201':
          description: Fabric item created

  /api/fabric-management/objects/{id}:
    get:
      tags: [plugin]
      summary: Get fabric item (legacy)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fabric item details
    put:
      tags: [plugin]
      summary: Update fabric item (legacy)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fabric item updated
    delete:
      tags: [plugin]
      summary: Delete fabric item (legacy)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Fabric item deleted

  /api/fabric-management/summary:
    get:
      tags: [plugin]
      summary: Fabric summary (legacy)
      responses:
        '200':
          description: Statistical summary

  # ============================================================================
  # Agent Management
  # ============================================================================
  /api/v1/dve/{id}/agent/status:
    get:
      tags: [agent]
      summary: Get agent status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent status

  /api/v1/dve/{id}/agent/launch:
    post:
      tags: [agent]
      summary: Launch agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent launched

  /api/v1/dve/{id}/agent:
    delete:
      tags: [agent]
      summary: Stop agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent stopped

  /api/v1/dve/{id}/agent/tasks:
    get:
      tags: [agent]
      summary: Get agent tasks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Agent tasks
    post:
      tags: [agent]
      summary: Submit agent task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Task submitted

  /api/v1/dve/{id}/agent/tasks/{taskID}:
    get:
      tags: [agent]
      summary: Get agent task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: taskID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task details

  # ============================================================================
  # Payments (Stripe & PayPal)
  # ============================================================================
  /api/v1/payments/stripe/create-session:
    post:
      tags: [payments]
      summary: Create Stripe checkout session
      responses:
        '200':
          description: Checkout session created

  /api/v1/payments/stripe/charge-status:
    get:
      tags: [payments]
      summary: Get Stripe charge status
      responses:
        '200':
          description: Charge status

  /api/v1/payments/stripe/refund:
    post:
      tags: [payments]
      summary: Refund Stripe charge
      responses:
        '200':
          description: Charge refunded

  /api/v1/payments/paypal/create-order:
    post:
      tags: [payments]
      summary: Create PayPal order
      responses:
        '200':
          description: Order created

  /api/v1/payments/paypal/order-status:
    get:
      tags: [payments]
      summary: Get PayPal order status
      responses:
        '200':
          description: Order status

  /api/v1/payments/paypal/capture:
    post:
      tags: [payments]
      summary: Capture PayPal order
      responses:
        '200':
          description: Order captured

  /api/v1/payments/paypal/refund:
    post:
      tags: [payments]
      summary: Refund PayPal capture
      responses:
        '200':
          description: Capture refunded

  # ============================================================================
  # NRN Payments
  # ============================================================================
  /api/nrn/balance:
    get:
      tags: [nrn-payments]
      summary: Get NRN account balance
      parameters:
        - name: address
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account balance

  /api/nrn/verify:
    post:
      tags: [nrn-payments]
      summary: Verify NRN payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tx_hash, expected_amount, expected_recipient]
              properties:
                tx_hash:
                  type: string
                expected_amount:
                  type: integer
                expected_recipient:
                  type: string
      responses:
        '200':
          description: Payment verified

  /api/nrn/block-height:
    get:
      tags: [nrn-payments]
      summary: Get blockchain height
      responses:
        '200':
          description: Block height

  # ============================================================================
  # KNIRVSHELL
  # ============================================================================
  /api/v1/shell/execute:
    post:
      tags: [knirvshell]
      summary: Execute KNIRVSHELL command
      responses:
        '200':
          description: Command executed

  /api/v1/shell/wallet/info:
    get:
      tags: [knirvshell]
      summary: Get wallet info
      responses:
        '200':
          description: Wallet information

  /api/v1/shell/wallet/send:
    post:
      tags: [knirvshell]
      summary: Send token
      responses:
        '200':
          description: Token sent

  /api/v1/shell/validation/execute:
    post:
      tags: [knirvshell]
      summary: Execute validation command
      responses:
        '200':
          description: Validation executed

  /api/v1/shell/tee/execute:
    post:
      tags: [knirvshell]
      summary: Execute TEE command
      responses:
        '200':
          description: TEE command executed

  /api/v1/shell/p2p/execute:
    post:
      tags: [knirvshell]
      summary: Execute P2P command
      responses:
        '200':
          description: P2P command executed

  /api/v1/shell/chain/execute:
    post:
      tags: [knirvshell]
      summary: Execute chain command
      responses:
        '200':
          description: Chain command executed

  /api/v1/shell/sessions:
    get:
      tags: [knirvshell]
      summary: List KNIRVSHELL sessions
      responses:
        '200':
          description: List of sessions

  /api/v1/shell/sessions/{id}:
    get:
      tags: [knirvshell]
      summary: Get KNIRVSHELL session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session details

  /api/v1/shell/sessions/{id}/stop:
    post:
      tags: [knirvshell]
      summary: Stop KNIRVSHELL session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session stopped

  /api/v1/shell/sessions/{id}/input:
    post:
      tags: [knirvshell]
      summary: Send input to session
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Input sent

  # Legacy KNIRVSHELL endpoints
  /api/knirvshell/execute:
    post:
      tags: [knirvshell]
      summary: Execute command (legacy)
      responses:
        '200':
          description: Command executed

  # ============================================================================
  # Onboarding
  # ============================================================================
  /api/v1/onboarding/organizations:
    post:
      tags: [onboarding]
      summary: Onboard organization
      responses:
        '201':
          description: Organization onboarded
    get:
      tags: [onboarding]
      summary: List configurations
      responses:
        '200':
          description: List of configurations

  /api/v1/onboarding/organizations/{id}:
    get:
      tags: [onboarding]
      summary: Get configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Configuration details
    put:
      tags: [onboarding]
      summary: Update configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Configuration updated
    delete:
      tags: [onboarding]
      summary: Delete configuration
