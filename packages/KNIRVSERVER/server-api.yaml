components:
  schemas:
    NexusEvent:
      type: object
      properties:
        timestamp:
          type: integer
          format: int64
        agent_id:
          type: string
        intent:
          type: string
        observed_action:
          type: string
        verified:
          type: boolean

    DVE:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, inactive, error]
        resources:
          type: object

    HealthStatus:
      type: object
      properties:
        status:
