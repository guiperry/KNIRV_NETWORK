# KNIRV-SERVER Development Configuration

# Core configuration
chain_id: knirv-server-devnet
node_role: dve-manager

# Server settings (wrapper frontend)
host: "0.0.0.0"
port: 8090
serve_frontend: true
log_level: "debug"

# Socket paths for submodules (Unix sockets for internal communication)
socket_dir: /var/lib/knirvserver/sockets

# Database configuration
database:
  path: /var/lib/knirvserver/backend_server/data/server.db

# API Configuration
api:
  port: 8082
  socket_path: /var/lib/knirvserver/sockets/backend.sock
  host: "0.0.0.0"
  enable_cors: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8082"
    - "http://localhost:8090"
    - "https://server.knirv.com"
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  rate_limit_rps: 1000
  request_timeout: "30s"

# Host Controller Configuration
host_controller:
  enable_monitoring: true
  monitoring_interval: "30s"
  enable_p2p: true
  p2p_port: 4001
  enable_tee: false
  tee_type: "none"
  container_runtime: "podman"
  enable_security_monitoring: true

# Data Engine Configuration
data_engine:
  retention_days: 30
  max_events_per_collection: 10000
  enable_compression: true
  backup_interval: "24h"
  backup_retention: 7

# Model Server Configuration
model_server:
  max_models: 100
  model_timeout: "5m"
  enable_isolation: true
  resource_limits:
    max_cpu_per_model: 1.0
    max_memory_per_model: 512000000  # 512MB
    max_disk_per_model: 1073741824   # 1GB
  health_check_interval: "30s"

# Inference Service Configuration
inference:
  max_concurrent_requests: 10
  request_timeout: "30s"
  model_cache_size: 5
  enable_fine_tuning: true
  fine_tuning_config:
    max_concurrent_jobs: 2
    default_epochs: 3
    learning_rate: 0.0001
    batch_size: 8

# CDE (Cloud Development Environment) Configuration
dve_workspace:
  base_image_path: "images"
  workspace_root: "workspaces"
  max_environments: 50
  default_timeout: "1h"
  max_cpu_per_env: 2.0
  max_memory_per_env: 2147483648    # 2GB
  max_disk_per_env: 10737418240     # 10GB
  enable_sandboxing: true
  enable_network_isolation: false
  allowed_ports:
    - 8082
    - 3000
    - 5000
  session_timeout: "2h"
  max_sessions_per_user: 5
  max_projects_per_user: 20
  project_storage_path: "projects"

  # OverlayFS workspace isolation
  enable_overlayfs: true
  busybox_rootfs_path: "/var/lib/knirvserver/busybox-rootfs"
  busybox_source: "embedded"
  busybox_version: "1.36.1"
  fuse_overlayfs_bin: "fuse-overlayfs"

  # Wazero skill executor
  skill_exec_timeout: "120s"
  skill_max_memory_mb: 512
  max_concurrent_wasm: 10

  # Workspace persistence
  workspace_retention_hours: 48

# Authentication Configuration
auth:
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_digit: true
  password_require_special: false
  token_expiration: "24h"
  refresh_token_expiration: "168h"  # 7 days
  max_login_attempts: 5
  lockout_duration: "15m"
  session_timeout: "30m"
  enable_two_factor: false

# Logging Configuration
logging:
  level: "debug"
  format: "json"
  output: "stdout"
  file: "logs/server.log"
  max_size: 100    # MB
  max_backups: 5
  max_age: 30      # days
  compress: true

# Security Configuration
security:
  auth_required: false
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  enable_rate_limiting: true
  rate_limit_requests_per_minute: 1000
  enable_request_logging: true
  enable_security_headers: true

# Monitoring Configuration
monitoring:
  enable_metrics: true
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval: "30s"
  enable_alerts: true
  alert_webhook_url: ""

# Development Configuration
development:
  enable_debug: true
  enable_profiling: false
  profiling_port: 6060
  enable_hot_reload: false
  mock_external_services: false

# Production Configuration
production:
  enable_clustering: false
  cluster_nodes: []
  enable_load_balancing: false
  enable_auto_scaling: false
  min_replicas: 1
  max_replicas: 10

# ICME (Intentional Context Memory Engine) Configuration
icme:
  enabled: true
  cloudflare_embeddings_url: "https://embeddings.knirv.com"
  ollama_base_url: "http://localhost:11434"
  ollama_embedding_model: "nomic-embed-text"
  spacy_model: "en_core_web_sm"
  graph_window_size: "10m"
  graph_max_nodes: 10000
  embed_dimension: 768
  default_top_k: 10
  alignment_eval_interval: "5m"
  drift_threshold: 0.20
  signal_queue_size: 512
  signal_workers: 4

# KNIRVGATEWAY Configuration
gateway:
  enabled: true
  binary_path: /var/lib/knirvserver/bin/knirvgateway
  port: 8080
  socket_path: ""                    # deprecated -- leave blank
  backend_socket: /var/lib/knirvserver/sockets/backend.sock
  chain_socket:   /var/lib/knirvserver/sockets/chain.sock
  graph_socket:   /var/lib/knirvserver/sockets/graph.sock
  turn_udp_port: 3478
  turn_tcp_port: 3479
  turn_api_port: 3476
  tunnel_http_port: 3002
  tunnel_ctrl_port: 3003
  tunnel_relay_port: 3004
  tunnel_stun_port: 3005
  auth_secret: "knirvchain-turn-secret"
  miner_address: "GATEWAY_MINER"
  start_timeout: 30
  stop_timeout: 10

# KNIRVGRAPH Configuration
graph:
  enabled: true
  binary_path: /var/lib/knirvserver/bin/knirvgraph
  socket_path: /var/lib/knirvserver/sockets/graph.sock
  p2p_socket_path: /var/lib/knirvserver/sockets/graph-p2p.sock
  data_path: /var/lib/knirvserver/knirvgraph
  sync_interval: "30s"
  start_timeout: 30
  stop_timeout: 10

# KNIRVCHAIN Configuration
chain:
  enabled: true
  binary_path: /var/lib/knirvserver/bin/knirvchain
  socket_path: /var/lib/knirvserver/sockets/chain.sock
  p2p_socket_path: /var/lib/knirvserver/sockets/chain-p2p.sock
  port: 8083
  p2p_port: 4001
  api_port: 8083
  data_path: /var/lib/knirvserver/knirvchain
  role: "client"
  chain_id: "testnet"
  start_timeout: 30
  stop_timeout: 10

# Validation Chain Configuration
validation_chain:
  enabled: true
  binary_path: /var/lib/knirvserver/bin/validationchain
  work_dir: /var/lib/knirvserver/validationchain
  port: 9290
  data_path: /var/lib/knirvserver/validationchain/data
  chain_id: "validation-devnet"
  start_timeout: 30
  stop_timeout: 10

# Updater Configuration (disabled for development)
updater:
  enabled: false
  poll_interval: 10m
  github_repo: "knirvcorp/KNIRV_NETWORK"


# KNIRVHASHER Configuration
hasher:
  enabled: true
  frames_dir: /var/lib/knirvserver/knirvhasher/data/frames
