# KNIRV-SERVER Production Configuration
# This is the consolidated production configuration file for KNIRV-SERVER
# All data directories default to /var/lib/knirvserver/backend_server

# Operational Mode
mode: headless  # headless | gui
environment: production  # production | development | staging
chain_id: knirv-server-mainnet
node_role: dve-manager
testnet: false

# Production Feature Flags
# These capabilities are part of the production KNIRVSERVER stack.
feature_flags:
  ebpf: true
  cognitive_engine: true
  blockchain_integration: true

# Wrapper (main.go) Configuration
# port: the port the knirvserver wrapper listens on
# backend_port: the port the embedded backend_server API listens on (must match api.port below)
port: 8090
backend_port: 8082
host: "0.0.0.0"
serve_frontend: true
log_level: "info"

# Service Configuration (wrapper frontend)
service:
  host: "0.0.0.0"
  port: 8090
  bind_address: "0.0.0.0"
  name: "dve-manager"

# API Configuration
api:
  host: "0.0.0.0"
  port: 8082
  address: "0.0.0.0"
  bind_address: "0.0.0.0"
  enable_cors: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8090"
    - "http://localhost:8082"
    - "http://localhost:8081"
    - "http://localhost:8080"
    - "https://gateway.knirv.network"
  jwt_secret: "${KNIRV_JWT_SECRET:your-jwt-secret-key-change-this-in-production}"
  rate_limit_rps: 100
  request_timeout: "30s"
  serve_frontend: true

# GUI Mode Configuration
gui:
  enabled: false
  port: 9080
  frontend_path: "./dist"  # Path to built Next.js frontend
  bind_address: "127.0.0.1"

# Database Configuration
database:
  path: /var/lib/knirvserver/backend_server/data/server.db

# Security Configuration
# Note: authentication is always required (no config flag disables it).
# Fixed demo credentials (see /auth/testnet-tokens) are disabled here since
# environment: production.
security:
  tls_enabled: true
  tls_cert_file: "/etc/knirvserver/tls/origin.crt"
  tls_key_file: "/etc/knirvserver/tls/origin.key"
  audit_logging: true
  jwt_secret: "${KNIRV_JWT_SECRET:testnet-jwt-secret-change-this-in-production}"
  enable_rate_limiting: true
  rate_limit_requests_per_minute: 60
  enable_request_logging: true
  enable_security_headers: true


# Authentication Configuration
auth:
  jwt_secret: "${KNIRV_JWT_SECRET}"
  token_expiry: "24h"
  refresh_token_expiry: "168h"  # 7 days
  enable_oauth: false
  oauth_providers: []
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_digit: true
  password_require_special: false
  max_login_attempts: 5
  # Cloudflare D1 auth store (knirv-onboarding database).
  # Credentials come from boot.key → CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID env vars.
  d1_enabled: true
  d1_database_id: "b25c0eb5-ef54-42cd-afcd-df074b1da8cd"
  d1_fallback_buntdb: true
  lockout_duration: "15m"
  session_timeout: "30m"
  enable_two_factor: false

# User Roles and Permissions
roles:
  validator:
    permissions:
      - "node:read"
      - "node:update"
      - "tasks:read"
      - "results:read"
    scoped_access: true  # Only assigned nodes
  admin:
    permissions:
      - "*:*"  # Full access
    scoped_access: false
  observer:
    permissions:
      - "*:read"
    scoped_access: false

# Network Configuration
network:
  chain_id: "knirv-server-mainnet"
  p2p_port: 4001
  discovery_enabled: true

# P2P Configuration
p2p:
  port: 4001
  bootstraps: []

# Host Controller Configuration
host_controller:
  enable_monitoring: true
  monitoring_interval: "30s"
  enable_p2p: true
  p2p_port: 4001
  enable_tee: false
  tee_type: "none"
  container_runtime: "podman"
  enable_security_monitoring: true

# Validation Configuration
validation:
  timeout: "30s"
  max_concurrent: 10
  enable_tee: false

# TEE (Trusted Execution Environment) Configuration
tee:
  type: "software"  # sgx | sev-snp | tdx | software
  sgx:
    enclave_file: ""
    spid_file: ""
    ias_url: ""
  sev:
    policy_file: ""
    cert_chain: ""
  tdx:
    td_report_file: ""
    quote_file: ""
  software:
    enable_attestation: false
    key_file: ""

# Data Engine Configuration
data_engine:
  retention_days: 30
  max_events_per_collection: 10000
  enable_compression: true
  backup_interval: "24h"
  backup_retention: 7

# Model Server Configuration
model_server:
  max_models: 100
  model_timeout: "5m"
  enable_isolation: true
  resource_limits:
    max_cpu_per_model: 1.0
    max_memory_per_model: 512000000  # 512MB
    max_disk_per_model: 1073741824   # 1GB
  health_check_interval: "30s"

# Inference Service Configuration
inference:
  max_concurrent_requests: 10
  request_timeout: "30s"
  model_cache_size: 5
  enable_fine_tuning: true
  fine_tuning_config:
    max_concurrent_jobs: 2
    default_epochs: 3
    learning_rate: 0.0001
    batch_size: 8

# DVE Workspace Configuration
dve_workspace:
  base_image_path: "/var/lib/knirvserver/backend_server/images"
  workspace_root: "/var/lib/knirvserver/backend_server/workspaces"
  max_environments: 50
  default_timeout: "1h"
  max_cpu_per_env: 2.0
  max_memory_per_env: 2147483648    # 2GB
  max_disk_per_env: 10737418240     # 10GB
  enable_sandboxing: true
  enable_network_isolation: false
  allowed_ports:
    - 8082
    - 3000
    - 5000
  session_timeout: "2h"
  max_sessions_per_user: 5
  max_projects_per_user: 20
  project_storage_path: "/var/lib/knirvserver/backend_server/projects"

  # OverlayFS workspace isolation
  enable_overlayfs: true
  busybox_rootfs_path: "/var/lib/knirvserver/busybox-rootfs"
  busybox_source: "embedded"
  busybox_version: "1.36.1"
  fuse_overlayfs_bin: "fuse-overlayfs"

  # Wazero skill executor
  skill_exec_timeout: "120s"
  skill_max_memory_mb: 512
  max_concurrent_wasm: 10

  # Workspace persistence
  workspace_retention_hours: 48

# Reports Configuration
reports:
  storage_path: "/var/lib/knirvserver/backend_server/reports"
  max_file_size: 104857600  # 100MB
  retention_days: 30
  enable_sharing: true
  enable_scheduling: true

# Email Configuration
email:
  enabled: true
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  smtp_user: "knirv.corporate@gmail.com"
  smtp_password: ""  # Sourced from root.key (smtp_password field) or KNIRV_EMAIL_SMTP_PASSWORD env var — never commit a literal here
  from_email: "knirv.corporate@gmail.com"
  from_name: "KNIRV Network"

# Logging Configuration
logging:
  level: "info"  # debug | info | warn | error
  format: "json"
  max_size: 100    # MB
  max_backups: 5
  max_age: 30      # days
  compress: true

log:
  level: "info"
  format: "json"

# Monitoring Configuration
monitoring:
  enable_metrics: true
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval: "30s"
  enable_alerts: true
  alert_webhook_url: ""

# Development Configuration
development:
  enable_debug: false
  enable_profiling: false
  profiling_port: 6060
  enable_hot_reload: false
  mock_external_services: false

# Production Configuration
production:
  enable_clustering: false
  cluster_nodes: []
  enable_load_balancing: false
  enable_auto_scaling: false
  min_replicas: 1
  max_replicas: 10

# ICME (Intentional Context Memory Engine) Configuration
icme:
  enabled: true
  cloudflare_embeddings_url: "https://embeddings.knirv.com"
  ollama_base_url: "http://localhost:11434"
  ollama_embedding_model: "nomic-embed-text"
  spacy_model: "en_core_web_sm"
  graph_window_size: "10m"
  graph_max_nodes: 10000
  embed_dimension: 768
  default_top_k: 10
  alignment_eval_interval: "5m"
  drift_threshold: 0.20
  signal_queue_size: 512
  signal_workers: 4

# Socket directory for submodule Unix sockets
socket_dir: /var/lib/knirvserver/sockets

# Updater Configuration
updater:
  enabled: true
  poll_interval: 10m
  github_repo: "guiperry/KNIRV_NETWORK"
  # github token read from root.key file (ORACLE_KEY_PATH env) for security

# KNIRVCHAIN Configuration
chain:
  enabled: true
  binary_path: ""
  socket_path: /var/lib/knirvserver/sockets/chain.sock
  p2p_socket_path: /var/lib/knirvserver/sockets/chain-p2p.sock
  data_path: /var/lib/knirvserver/knirvchain
  role: "client"
  chain_id: "knirv-server-mainnet"
  start_timeout: 30
  stop_timeout: 10

# KNIRVGRAPH Configuration
graph:
  enabled: true
  binary_path: ""
  socket_path: /var/lib/knirvserver/sockets/graph.sock
  p2p_socket_path: /var/lib/knirvserver/sockets/graph-p2p.sock
  data_path: /var/lib/knirvserver/knirvgraph
  sync_interval: "30s"
  start_timeout: 30
  stop_timeout: 10

# Gateway (embedded KNIRVGATEWAY) Configuration
gateway:
  enabled: true
  binary_path: ""
  port: 8080
  backend_socket: /var/lib/knirvserver/sockets/backend.sock
  chain_socket: /var/lib/knirvserver/sockets/chain.sock
  graph_socket: /var/lib/knirvserver/sockets/graph.sock
  agent_socket_dir: /var/lib/knirvserver/sockets/
  agent_max_concurrent: 32
  start_timeout: 30
  stop_timeout: 10

# DVE (Deterministic Validation Environment) Configuration
dve:
  discovery:
    enabled: true
    # Bootstrap nodes for remote DVE instance discovery
    bootstrap_nodes:
      # - "http://dve1.example.com:8082"
      # - "http://dve2.example.com:8082"
    discovery_interval: "30s"
    connection_timeout: "5s"
    health_check_interval: "60s"
    heartbeat_timeout: "2m"
    max_retries: 3
    retry_backoff_duration: "2s"
    connection_pool_size: 10


# KNIRVHASHER Configuration
hasher:
  enabled: true
  frames_dir: /var/lib/knirvserver/knirvhasher/data/frames

# Validation Chain Configuration
# binary_path is staged at startup by KNIRVSERVER (main.go stageEmbeddedChainArtifacts).
# work_dir is intentionally omitted — the release binary is self-contained.
validation_chain:
  enabled: true
  binary_path: /var/lib/knirvserver/bin/validationchain
  port: 9290
  data_path: /var/lib/knirvserver/validationchain/data
  chain_id: "validation-mainnet"
  start_timeout: 30
  stop_timeout: 10

# Transaction Chain Configuration
# script_path/work_dir are staged at startup by KNIRVSERVER and passed via env
# vars (see main.go stageEmbeddedChainArtifacts).
transaction_chain:
  enabled: true
  port: 9190
  data_path: /var/lib/knirvserver/transactionchain/data
  chain_id: "transaction-mainnet"
  start_timeout: 30
  stop_timeout: 10
