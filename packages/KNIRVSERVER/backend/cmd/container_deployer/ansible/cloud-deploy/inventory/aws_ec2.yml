# AWS EC2 Dynamic Inventory Configuration
plugin: amazon.aws.aws_ec2
regions:
  - us-east-1
  - us-west-2
  - eu-west-1

# Filters
filters:
  # Only include running instances
  instance-state-name: running
  # Only include instances with our project tag
  "tag:Project": knirv-server

# Keyed groups
keyed_groups:
  # Group by instance type
  - key: instance_type
    prefix: type
  # Group by environment
  - key: tags.Environment
    prefix: env
  # Group by role
  - key: tags.Role
    prefix: role
  # Group by availability zone
  - key: placement.availability_zone
    prefix: az

# Groups
groups:
  # Create groups based on tags
  production: tags.Environment == "production"
  staging: tags.Environment == "staging"
  development: tags.Environment == "development"
  
  # Create groups based on roles
  main_servers: tags.Role == "main-server"
  worker_nodes: tags.Role == "worker-node"
  database_servers: tags.Role == "database"
  
  # Create groups based on instance state
  running: instance_state_name == "running"
  stopped: instance_state_name == "stopped"

# Compose variables
compose:
  # Set ansible host to public IP for public instances, private IP for private
  ansible_host: public_ip_address | default(private_ip_address)
  # Set instance name
  instance_name: tags.Name | default(instance_id)
  # Set environment
  environment: tags.Environment | default("unknown")
  # Set role
  server_role: tags.Role | default("unknown")
  # Set instance type
  ec2_instance_type: instance_type
  # Set availability zone
  ec2_az: placement.availability_zone
  # Set VPC ID
  ec2_vpc_id: vpc_id
  # Set subnet ID
  ec2_subnet_id: subnet_id
  # Set security groups
  ec2_security_groups: security_groups | map(attribute='group_name') | list

# Use cache to improve performance
cache: true
cache_plugin: memory
cache_timeout: 300
cache_connection: /tmp/ansible-aws-ec2-cache

# Include/exclude patterns
include_filters: []
exclude_filters: []

# Strict mode
strict: false

# Use private IP addresses for connection
use_private_ip_address: false

# SSH connection settings
ansible_user: ec2-user
ansible_ssh_private_key_file: "{{ lookup('env', 'AWS_SSH_KEY_PATH') | default('./knirv-server-key.pem') }}"
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
