---
# KNIRV-SERVER Application Deployment Playbook
- name: Deploy KNIRV-SERVER Application
  hosts: main_servers
  become: true
  gather_facts: true
  vars:
    # Application Configuration
    app_name: "knirv-server"
    app_user: "server"
    app_group: "server"
    app_dir: "/opt/{{ app_name }}"
    app_config_dir: "{{ app_dir }}/config"
    app_data_dir: "{{ app_dir }}/data"
    app_logs_dir: "{{ app_dir }}/logs"
    
    # Service Configuration
    service_name: "{{ app_name }}"
    service_port: 8082
    
    # Environment Configuration
    environment: "{{ env | default('production') }}"
    
    # Build Configuration
    go_version: "1.21.0"
    node_version: "18"
    
    # Database Configuration
    db_path: "{{ app_data_dir }}/server.db"
    
    # SSL Configuration
    enable_ssl: "{{ ssl_enabled | default(false) }}"
    ssl_cert_path: "{{ app_config_dir }}/ssl/cert.pem"
    ssl_key_path: "{{ app_config_dir }}/ssl/key.pem"

  tasks:
    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: false

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_config_dir }}"
        - "{{ app_data_dir }}"
        - "{{ app_logs_dir }}"
        - "{{ app_dir }}/bin"
        - "{{ app_dir }}/backup"

    - name: Install system dependencies
      package:
        name:
          - git
          - curl
          - wget
          - unzip
          - htop
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Install Docker
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        usermod -aG docker {{ app_user }}
        systemctl enable docker
        systemctl start docker
      args:
        creates: /usr/bin/docker

    - name: Install Go
      unarchive:
        src: "https://go.dev/dl/go{{ go_version }}.linux-amd64.tar.gz"
        dest: /usr/local
        remote_src: true
        creates: "/usr/local/go/bin/go"

    - name: Add Go to PATH
      lineinfile:
        path: /etc/profile
        line: 'export PATH=$PATH:/usr/local/go/bin'
        create: true

    - name: Install Node.js
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
        apt-get install -y nodejs
      args:
        creates: /usr/bin/node

    - name: Clone application repository
      git:
        repo: "{{ git_repo | default('https://github.com/guiperry/KNIRV_NETWORK.git') }}"
        dest: "{{ app_dir }}/source"
        version: "{{ git_branch | default('main') }}"
        force: true
      become_user: "{{ app_user }}"
      notify: restart application

    - name: Build frontend
      shell: |
        cd {{ app_dir }}/source/KNIRVSERVER
        npm install
        npm run build
      become_user: "{{ app_user }}"
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
      notify: restart application

    - name: Build backend
      shell: |
        cd {{ app_dir }}/source/KNIRVSERVER/backend
        go mod tidy
        go build -o {{ app_dir }}/bin/server-server ./cmd/server-server
      become_user: "{{ app_user }}"
      environment:
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"
      notify: restart application

    - name: Create application configuration
      template:
        src: server.yaml.j2
        dest: "{{ app_config_dir }}/production.yaml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0640'
      notify: restart application

    - name: Create systemd service file
      template:
        src: server.service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: '0644'
      notify:
        - reload systemd
        - restart application

    - name: Create nginx configuration
      template:
        src: nginx.conf.j2
        dest: "/etc/nginx/sites-available/{{ app_name }}"
        mode: '0644'
      notify: restart nginx

    - name: Enable nginx site
      file:
        src: "/etc/nginx/sites-available/{{ app_name }}"
        dest: "/etc/nginx/sites-enabled/{{ app_name }}"
        state: link
      notify: restart nginx

    - name: Remove default nginx site
      file:
        path: "/etc/nginx/sites-enabled/default"
        state: absent
      notify: restart nginx

    - name: Configure firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"
        - "{{ service_port }}"

    - name: Enable firewall
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Setup SSL certificates (if enabled)
      block:
        - name: Create SSL directory
          file:
            path: "{{ app_config_dir }}/ssl"
            state: directory
            owner: "{{ app_user }}"
            group: "{{ app_group }}"
            mode: '0700'

        - name: Generate SSL certificates with certbot
          shell: |
            certbot --nginx -d {{ domain_name }} --non-interactive --agree-tos --email {{ ssl_email }}
          when: domain_name is defined and ssl_email is defined

      when: enable_ssl | bool

    - name: Create backup script
      template:
        src: backup.sh.j2
        dest: "{{ app_dir }}/bin/backup.sh"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'

    - name: Setup backup cron job
      cron:
        name: "KNIRV-SERVER backup"
        minute: "0"
        hour: "2"
        job: "{{ app_dir }}/bin/backup.sh"
        user: "{{ app_user }}"

    - name: Create log rotation configuration
      template:
        src: logrotate.j2
        dest: "/etc/logrotate.d/{{ app_name }}"
        mode: '0644'

    - name: Start and enable services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - "{{ service_name }}"
        - nginx
        - docker

    - name: Wait for application to start
      wait_for:
        port: "{{ service_port }}"
        host: "127.0.0.1"
        delay: 10
        timeout: 60

    - name: Verify application health
      uri:
        url: "http://127.0.0.1:{{ service_port }}/api/v1/health"
        method: GET
        status_code: 200
      retries: 5
      delay: 10

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart application
      systemd:
        name: "{{ service_name }}"
        state: restarted

    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

# Worker nodes deployment
- name: Deploy KNIRV-SERVER Worker Nodes
  hosts: worker_nodes
  become: true
  gather_facts: true
  vars:
    app_name: "knirv-server"
    app_user: "server"
    app_group: "server"
    app_dir: "/opt/{{ app_name }}"
    service_name: "{{ app_name }}-worker"
    environment: "{{ env | default('production') }}"

  tasks:
    - name: Create application user
      user:
        name: "{{ app_user }}"
        group: "{{ app_group }}"
        system: true
        shell: /bin/bash
        home: "{{ app_dir }}"
        create_home: false

    - name: Create application directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0755'
      loop:
        - "{{ app_dir }}"
        - "{{ app_dir }}/config"
        - "{{ app_dir }}/data"
        - "{{ app_dir }}/logs"
        - "{{ app_dir }}/bin"

    - name: Install system dependencies
      package:
        name:
          - git
          - curl
          - wget
          - unzip
          - htop
        state: present

    - name: Install Docker
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        usermod -aG docker {{ app_user }}
        systemctl enable docker
        systemctl start docker
      args:
        creates: /usr/bin/docker

    - name: Configure worker node
      template:
        src: worker-config.yaml.j2
        dest: "{{ app_dir }}/config/worker.yaml"
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: '0640'

    - name: Create worker systemd service
      template:
        src: server-worker.service.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        mode: '0644'
      notify:
        - reload systemd
        - restart worker

    - name: Start and enable worker service
      systemd:
        name: "{{ service_name }}"
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart worker
      systemd:
        name: "{{ service_name }}"
        state: restarted
