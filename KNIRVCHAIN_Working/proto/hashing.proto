syntax = "proto3";

package KNIRVCHAIN;

option go_package = "./;proto"; // Adjust go_package to your project structure

import "google/protobuf/timestamp.proto";

// TransactionProto defines the structure of a transaction for hashing.
// Fields like signature and public_key are part of the full transaction
// but are excluded from the data that is hashed for the signature itself.
message TransactionProto {
  string from = 1;
  string to = 2;
  uint64 value = 3;
  bytes data = 4;         // Can hold serialized MCP data or other arbitrary data
  google.protobuf.Timestamp timestamp = 5;
  uint64 fee = 6;
  string type = 7;         // For MCP transaction types
  // TransactionHash is derived, and PublicKey/Signature are added after hashing for signing.
  // For hashing the core content to be signed, these are excluded from the hash calculation.
  bytes signature = 8;     // Cryptographic signature of the transaction
  bytes public_key = 9;    // Public key of the signer
}

// BlockProto defines the structure of a block for hashing.
// The BlockHash itself is derived from this structure and not included here.
message BlockProto {
  uint64 block_number = 1;
  bytes prev_hash = 2;
  google.protobuf.Timestamp timestamp = 3;
  int32 nonce = 4;                         // Assuming Block.Nonce is int, maps to int32
  repeated TransactionProto transactions = 5;
  // SmartContract field is removed.
  string proposer_address = 6;
}