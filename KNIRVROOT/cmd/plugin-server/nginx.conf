events {
    worker_connections 1024;
}

http {
    upstream plugin_server {
        server plugin-server:8080;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Basic security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    server {
        listen 80;
        server_name localhost;

        # Redirect HTTP to HTTPS (uncomment for production)
        # return 301 https://$server_name$request_uri;

        # Basic rate limiting
        limit_req zone=api burst=20 nodelay;

        # Proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # API endpoints
        location /info {
            proxy_pass http://plugin_server;
        }

        location /list {
            proxy_pass http://plugin_server;
        }

        location /agents/ {
            proxy_pass http://plugin_server;
            # Increase timeout for large file downloads
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /upload {
            # Stricter rate limiting for uploads
            limit_req zone=upload burst=5 nodelay;
            
            proxy_pass http://plugin_server;
            
            # Increase limits for file uploads
            client_max_body_size 100M;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_request_buffering off;
        }

        location /delete/ {
            # Restrict delete operations
            limit_req zone=upload burst=2 nodelay;
            proxy_pass http://plugin_server;
        }

        # Health check endpoint
        location /health {
            proxy_pass http://plugin_server/info;
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }
    }

    # HTTPS server (uncomment and configure for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #
    #     # SSL configuration
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #
    #     # Same location blocks as HTTP server
    #     # ... (copy from above)
    # }
}
