[package]
name = "knirvchain"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["production"]
testnet = ["simplified-consensus", "mock-ipfs", "in-memory-db", "mock-llm"]
production = ["full-features"]
simplified-consensus = []
mock-ipfs = []
in-memory-db = []
mock-llm = []
full-features = []

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
rand = "0.8"
dotenv = "0.15"
serde_json = "1.0"
sled = "0.34"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
k256 = "0.13"
num-bigint = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
uuid = { version = "1.0", features = ["v4"] }
toml = "0.8"
warp = "0.3"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.10"

# IPFS Integration (using simpler HTTP client for now)
# ipfs-api = "0.17"  # Temporarily disabled due to dependency conflicts
# ipfs-embed = "0.23"  # Temporarily disabled due to dependency conflicts

# Multi-Model LLM Support (using mock implementations for now)
# candle-core = "0.3"  # Temporarily disabled due to dependency conflicts
# candle-nn = "0.3"
# candle-transformers = "0.3"
# tokenizers = "0.14"

# Tendermint/CometBFT Consensus (using mock implementations for now)
# tendermint = "0.34"  # Temporarily disabled due to dependency conflicts
# tendermint-rpc = "0.34"
# tendermint-abci = "0.34"

# IBC Protocol (using mock implementations for now)
# ibc = "0.48"  # Temporarily disabled due to dependency conflicts
# ibc-relayer = "0.26"

# Additional utilities
lru = "0.12"
async-trait = "0.1"
thiserror = "1.0"