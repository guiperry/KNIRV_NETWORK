# KNIRVCHAIN Blockchain Configuration

[blockchain]
# Blockchain mode: "native", "xion", or "hybrid"
mode = "native"

[native]
chain_id = "knirv-1"
enable_cross_chain = false

# Optional XION configuration (only used when mode is "xion" or "hybrid")
[xion]
# Uncomment and configure these when XION integration is needed
# rpc_endpoint = "https://rpc.xion-testnet-1.burnt.com:443"
# rest_endpoint = "https://api.xion-testnet-1.burnt.com:443"
# chain_id = "xion-testnet-1"
# nrn_contract = "xion1..."
# llm_registry_contract = "xion1..."
# skill_registry_contract = "xion1..."

[smart_contracts]
# NRN Token Configuration
initial_supply = "1000000000000000"  # 1 trillion
max_supply = "10000000000000000"     # 10 trillion

# LLM Registry Configuration
default_registration_fee = "1000"    # 1000 NRN
default_usage_fee = "10"             # 10 NRN per invocation

# Skill Registry Configuration
default_skill_fee = "100"            # 100 NRN per skill registration
performance_tracking = true

[network]
# Network participation rewards
reward_multiplier = "1.5"
max_daily_rewards = "10000"

# Proof of connectivity settings
connectivity_threshold = 0.8
reward_frequency_seconds = 3600  # 1 hour

[api]
# API versioning
enable_v1_endpoints = true
enable_v2_endpoints = true
default_version = "v2"

# Rate limiting
max_requests_per_minute = 100
burst_limit = 20

[logging]
level = "info"
enable_transaction_logging = true
enable_performance_metrics = true
