# KNIRV Integration Test Configuration
# This file contains configuration for all integration tests

# Test Environment Settings
environment:
  name: "integration-test"
  timeout: "300s"
  cleanup_after_test: true
  parallel_execution: false

# Component Endpoints
endpoints:
  knirvchain:
    url: "http://localhost:8080"
    health_endpoint: "/health"
    timeout: "30s"
  
  knirvgraph:
    url: "http://localhost:8081"
    health_endpoint: "/health"
    timeout: "30s"
  
  knirvnexus:
    url: "http://localhost:8082"
    health_endpoint: "/api/v1/health"
    timeout: "30s"
  
  knirvwallet:
    url: "http://localhost:8083"
    health_endpoint: "/health"
    timeout: "30s"
  
  knirvshell:
    url: "http://localhost:8084"
    health_endpoint: "/health"
    timeout: "30s"
  
  knirvrouter:
    url: "http://localhost:8085"
    health_endpoint: "/status"
    timeout: "30s"
  
  knirvroot:
    url: "http://localhost:8086"
    health_endpoint: "/health"
    timeout: "30s"

# External Services
external_services:
  xion:
    rpc_endpoint: "https://rpc.xion-testnet-1.burnt.com:443"
    rest_endpoint: "https://api.xion-testnet-1.burnt.com"
    chain_id: "xion-testnet-1"
    timeout: "60s"

# Test Data Configuration
test_data:
  wallet:
    initial_balance: "10000000"  # 10 NRN
    test_mnemonic: "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
  
  llm:
    registration_fee: "1000000"
    usage_fee: "100000"
    test_model_data: "dGVzdCBtb2RlbCBkYXRh"  # base64 encoded "test model data"
  
  agent:
    default_timeout: "60s"
    default_memory: "512MB"
    test_capabilities: ["text_processing", "data_analysis"]
  
  skill:
    default_confidence: 0.8
    default_latency: "5s"
    test_capabilities: ["javascript", "syntax_repair"]

# Performance Test Configuration
performance:
  load_test:
    concurrent_users: 10
    test_duration: "30s"
    requests_per_user: 50
    ramp_up_time: "5s"
  
  stress_test:
    concurrent_users: 50
    test_duration: "60s"
    requests_per_user: 100
    ramp_up_time: "10s"
  
  thresholds:
    max_error_rate: 5.0  # percentage
    min_requests_per_second: 1.0
    max_average_latency: "5s"

# Cross-Component Test Configuration
cross_component:
  propagation_timeout: "10s"
  validation_timeout: "30s"
  retry_attempts: 3
  retry_delay: "2s"

# E2E Workflow Configuration
e2e_workflows:
  developer_workflow:
    skill_invocation_amount: "750000"
    error_resolution_timeout: "30s"
  
  agent_development:
    deployment_timeout: "60s"
    execution_timeout: "120s"
    registration_fee: "2000000"
  
  bridge_transfer:
    transfer_amount: "2000000"
    bridge_fee: "50000"
    confirmation_timeout: "60s"
  
  p2p_network:
    stake_amount: "5000000"
    proof_validation_timeout: "20s"
    peer_discovery_timeout: "15s"

# Database Configuration for Tests
database:
  cleanup_between_tests: true
  backup_before_test: false
  test_data_isolation: true

# Logging Configuration
logging:
  level: "info"
  format: "json"
  output: "stdout"
  test_logs_directory: "./logs"
  component_logs: true

# Security Configuration
security:
  test_keys_directory: "./keys"
  generate_test_keys: true
  key_rotation_interval: "24h"

# Monitoring Configuration
monitoring:
  metrics_collection: true
  metrics_interval: "5s"
  health_check_interval: "10s"
  alert_thresholds:
    cpu_usage: 80.0
    memory_usage: 85.0
    disk_usage: 90.0

# Cleanup Configuration
cleanup:
  auto_cleanup: true
  cleanup_timeout: "60s"
  preserve_logs: true
  preserve_test_data: false
