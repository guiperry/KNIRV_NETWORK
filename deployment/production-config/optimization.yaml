# Production Optimization Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: knirv-optimization-config
  namespace: knirv-production
data:
  # Performance Settings
  performance.yaml: |
    database:
      connection_pool_size: 50
      max_idle_connections: 10
      connection_timeout: 30s
      query_timeout: 60s

    cache:
      redis_cluster_size: 3
      cache_ttl: 3600
      max_memory: "2gb"
      eviction_policy: "allkeys-lru"

    api_gateway:
      rate_limit: 1000
      burst_limit: 2000
      timeout: 30s
      max_connections: 10000

    blockchain:
      batch_size: 100
      confirmation_blocks: 12
      gas_limit: 8000000
      gas_price: "20gwei"

  # Security Settings
  security.yaml: |
    authentication:
      jwt_expiry: "24h"
      refresh_token_expiry: "7d"
      max_login_attempts: 5
      lockout_duration: "15m"

    encryption:
      algorithm: "AES-256-GCM"
      key_rotation_interval: "30d"

    network:
      tls_version: "1.3"
      cipher_suites:
        - "TLS_AES_256_GCM_SHA384"
        - "TLS_CHACHA20_POLY1305_SHA256"

    cors:
      allowed_origins:
        - "https://knirv.com"
        - "https://app.knirv.com"
      allowed_methods: ["GET", "POST", "PUT", "DELETE"]
      max_age: 86400

  # Monitoring Settings
  monitoring.yaml: |
    metrics:
      collection_interval: "30s"
      retention_period: "30d"

    alerts:
      cpu_threshold: 80
      memory_threshold: 85
      disk_threshold: 90
      response_time_threshold: "5s"
      error_rate_threshold: 5

    logging:
      level: "info"
      format: "json"
      max_file_size: "100MB"
      max_files: 10

---
# Deployment Configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knirv-production-stack
  namespace: knirv-production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: knirv-stack
  template:
    metadata:
      labels:
        app: knirv-stack
    spec:
      containers:
      - name: api-gateway
        image: knirv/api-gateway:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

      - name: knirvchain
        image: knirv/knirvchain:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: XION_RPC
          valueFrom:
            secretKeyRef:
              name: blockchain-secrets
              key: xion-rpc-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      - name: knirvgraph
        image: knirv/knirvgraph:v1.0.0
        ports:
        - containerPort: 8081
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"

      - name: knirvnexus
        image: knirv/knirvnexus:v1.0.0
        ports:
        - containerPort: 8082
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

      - name: knirvoracle
        image: knirv/knirvoracle:v1.0.0
        ports:
        - containerPort: 8083
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database-secrets
              key: connection-string
        resources:
          requests:
            memory: "2Gi"
            cpu: "1500m"
          limits:
            memory: "4Gi"
            cpu: "3000m"

      - name: knirvrouter
        image: knirv/knirvrouter:v1.0.0
        ports:
        - containerPort: 3478  # TURN server port (existing)
        - containerPort: 5349  # TURN server TLS port (existing)
        env:
        - name: XION_RPC
          valueFrom:
            secretKeyRef:
              name: blockchain-secrets
              key: xion-rpc-url
        - name: KNIRVORACLE_ENDPOINT
          value: "http://root.knirv:8083"
        - name: NRN_CONTRACT_ADDR
          value: "xion1nrncontractaddress"
        - name: PROOF_INTERVAL
          value: "5m"
        - name: MINTING_ENABLED
          value: "true"
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"

---
# Service Configuration
apiVersion: v1
kind: Service
metadata:
  name: knirv-service
  namespace: knirv-production
spec:
  selector:
    app: knirv-stack
  ports:
  - name: gateway
    port: 80
    targetPort: 8000
  - name: knirvchain
    port: 8080
    targetPort: 8080
  - name: knirvgraph
    port: 8081
    targetPort: 8081
  - name: knirvnexus
    port: 8082
    targetPort: 8082
  - name: knirvoracle
    port: 8083
    targetPort: 8083
  - name: knirvrouter-turn
    port: 3478
    targetPort: 3478
  - name: knirvrouter-turn-tls
    port: 5349
    targetPort: 5349
  type: LoadBalancer

---
# Ingress Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knirv-ingress
  namespace: knirv-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - api.knirv.com
    secretName: knirv-tls-secret
  rules:
  - host: api.knirv.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: knirv-service
            port:
              number: 80
