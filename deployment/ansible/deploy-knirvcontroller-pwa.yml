---
# KNIRVCONTROLLER PWA Deployment Playbook
# Deploys KNIRVCONTROLLER Progressive Web App to CloudFlare CDN
# Integrates with existing KNIRV network infrastructure

- name: Deploy KNIRVCONTROLLER PWA
  hosts: localhost
  connection: local
  gather_facts: yes
  vars_files:
    - "environments/{{ environment | default('production') }}.yml"
  
  vars:
    project_root: "{{ playbook_dir }}/../.."
    controller_dir: "{{ project_root }}/KNIRVCONTROLLER"
    deployment_timestamp: "{{ ansible_date_time.epoch }}"
    
  tasks:
    - name: Display deployment information
      debug:
        msg:
          - "Deploying KNIRVCONTROLLER PWA"
          - "Environment: {{ environment | default('production') }}"
          - "Target Domain: {{ controller_pwa.domain | default('controller.knirv.com') }}"
          - "Beta Domain: {{ controller_pwa.beta_domain | default('beta-controller.knirv.network') }}"

    - name: Check prerequisites
      block:
        - name: Verify KNIRVCONTROLLER directory exists
          stat:
            path: "{{ controller_dir }}"
          register: controller_dir_stat
          
        - name: Fail if KNIRVCONTROLLER directory not found
          fail:
            msg: "KNIRVCONTROLLER directory not found at {{ controller_dir }}"
          when: not controller_dir_stat.stat.exists

        - name: Check Node.js installation
          command: node --version
          register: node_version
          changed_when: false
          
        - name: Check npm installation
          command: npm --version
          register: npm_version
          changed_when: false
          
        - name: Display Node.js and npm versions
          debug:
            msg:
              - "Node.js version: {{ node_version.stdout }}"
              - "npm version: {{ npm_version.stdout }}"

    - name: Prepare build environment
      block:
        - name: Create deployment directories
          file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
          loop:
            - "{{ project_root }}/deployment-reports"
            - "{{ project_root }}/deployment-logs"
            
        - name: Set environment variables for build
          set_fact:
            build_env:
              NODE_ENV: "production"
              DEPLOYMENT_ENV: "{{ environment | default('production') }}"
              CLOUDFLARE_API_TOKEN: "{{ cloudflare_api_token | default('') }}"
              CLOUDFLARE_ZONE_ID: "{{ cloudflare_zone_id | default('') }}"

    - name: Install dependencies
      block:
        - name: Check if package.json exists
          stat:
            path: "{{ controller_dir }}/package.json"
          register: package_json_stat
          
        - name: Install npm dependencies
          npm:
            path: "{{ controller_dir }}"
            state: present
            production: no
          when: package_json_stat.stat.exists
          environment: "{{ build_env }}"

    - name: Build PWA packages
      block:
        - name: Run PWA build script
          command: npm run build:pwa
          args:
            chdir: "{{ controller_dir }}"
          environment: "{{ build_env }}"
          register: pwa_build_result
          
        - name: Display build output
          debug:
            var: pwa_build_result.stdout_lines
          when: pwa_build_result.stdout_lines is defined
          
        - name: Verify build output directories
          stat:
            path: "{{ controller_dir }}/{{ item }}"
          register: build_output_check
          loop:
            - "dist"
            - "packages"
            
        - name: Fail if build output missing
          fail:
            msg: "Build failed - {{ item.item }} directory not found"
          when: not item.stat.exists
          loop: "{{ build_output_check.results }}"

    - name: Deploy to CloudFlare CDN
      block:
        - name: Run CloudFlare deployment script
          command: node scripts/deploy-cloudflare.js
          args:
            chdir: "{{ controller_dir }}"
          environment: "{{ build_env }}"
          register: cloudflare_deploy_result
          
        - name: Display CloudFlare deployment output
          debug:
            var: cloudflare_deploy_result.stdout_lines
          when: cloudflare_deploy_result.stdout_lines is defined

    - name: Update DNS records
      block:
        - name: Update CloudFlare DNS for production
          uri:
            url: "https://api.cloudflare.com/client/v4/zones/{{ cloudflare_zone_id }}/dns_records"
            method: GET
            headers:
              Authorization: "Bearer {{ cloudflare_api_token }}"
              Content-Type: "application/json"
          register: dns_records
          when: 
            - cloudflare_api_token is defined
            - cloudflare_zone_id is defined
            - environment == "production"
          ignore_errors: yes
          
        - name: Display DNS update status
          debug:
            msg: "DNS records updated for {{ controller_pwa.domain | default('controller.knirv.com') }}"
          when: dns_records is succeeded

    - name: Verify deployment
      block:
        - name: Wait for deployment propagation
          pause:
            seconds: 30
            prompt: "Waiting for CloudFlare deployment to propagate..."
            
        - name: Check PWA endpoints
          uri:
            url: "{{ item }}"
            method: GET
            status_code: 200
          register: endpoint_check
          ignore_errors: yes
          loop:
            - "https://{{ controller_pwa.domain | default('controller.knirv.com') }}"
            - "https://{{ controller_pwa.domain | default('controller.knirv.com') }}/manifest.json"
            - "https://{{ controller_pwa.domain | default('controller.knirv.com') }}/sw.js"
            
        - name: Display endpoint check results
          debug:
            msg: "{{ item.item }}: {{ 'HEALTHY' if item.status == 200 else 'UNHEALTHY' }}"
          loop: "{{ endpoint_check.results }}"

    - name: Update portal configuration
      block:
        - name: Check portal links file
          stat:
            path: "{{ project_root }}/KNIRVGATEWAY/network-website/public/config/portal-links.yaml"
          register: portal_links_stat
          
        - name: Display portal links status
          debug:
            msg: "Portal links file {{ 'found' if portal_links_stat.stat.exists else 'not found' }}"

    - name: Generate deployment report
      block:
        - name: Create deployment report
          template:
            src: deployment-report.j2
            dest: "{{ project_root }}/deployment-reports/controller-pwa-{{ environment | default('production') }}-{{ deployment_timestamp }}.txt"
            mode: '0644'
          vars:
            deployment_info:
              timestamp: "{{ ansible_date_time.iso8601 }}"
              environment: "{{ environment | default('production') }}"
              domain: "{{ controller_pwa.domain | default('controller.knirv.com') }}"
              beta_domain: "{{ controller_pwa.beta_domain | default('beta-controller.knirv.network') }}"
              node_version: "{{ node_version.stdout }}"
              npm_version: "{{ npm_version.stdout }}"
              build_status: "{{ 'SUCCESS' if pwa_build_result.rc == 0 else 'FAILED' }}"
              deploy_status: "{{ 'SUCCESS' if cloudflare_deploy_result.rc == 0 else 'FAILED' }}"

    - name: Display deployment summary
      debug:
        msg:
          - "🎉 KNIRVCONTROLLER PWA Deployment Complete!"
          - "Environment: {{ environment | default('production') }}"
          - "PWA URL: https://{{ controller_pwa.domain | default('controller.knirv.com') }}"
          - "Android Download: https://{{ controller_pwa.domain | default('controller.knirv.com') }}/android"
          - "iOS Download: https://{{ controller_pwa.domain | default('controller.knirv.com') }}/ios"
          - "Deployment Report: deployment-reports/controller-pwa-{{ environment | default('production') }}-{{ deployment_timestamp }}.txt"

  handlers:
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ controller_dir }}/temp"
        - "{{ controller_dir }}/.deployment-temp"
