---
# KNIRV Network Infrastructure Provisioning Playbook
# Purpose: Minimal infrastructure setup and DNS management only
# Scope: Cloud infrastructure, server config, Docker/K8s installation, DNS updates
# Application deployment is handled by existing Docker/Kubernetes infrastructure

- name: KNIRV Network Infrastructure Provisioning
  hosts: localhost
  gather_facts: false
  vars:
    # Cloud Provider Configuration
    cloud_provider: "{{ cloud_provider | default('aws') }}"  # aws, gcp, azure, digitalocean
    region: "{{ region | default('us-east-1') }}"
    
    # Instance Configuration
    instance_type: "{{ instance_type | default('t3.medium') }}"
    key_pair_name: "{{ key_pair_name | default('knirv-network-key') }}"
    security_group_name: "knirv-network-sg"
    
    # Network Configuration
    vpc_cidr: "10.0.0.0/16"
    subnet_cidr: "10.0.1.0/24"
    
    # KNIRV Service Ports
    knirv_ports:
      - 8080  # KNIRVCHAIN
      - 8081  # KNIRVGRAPH  
      - 8082  # KNIRVNEXUS
      - 8083  # KNIRVROOT
      - 8084  # KNIRVWALLET
      - 8085  # KNIRVSHELL
      - 8086  # KNIRVROUTER
      - 8087  # KNIRVGATEWAY
      - 22    # SSH
      - 80    # HTTP
      - 443   # HTTPS
      - 3478  # STUN/TURN
      - 5349  # TURN TLS
      - 9090  # Metrics
    
    # Cloudflare Configuration
    cloudflare_zone_id: "{{ cloudflare_zone_id }}"
    cloudflare_api_token: "{{ cloudflare_api_token }}"
    domain_name: "{{ domain_name | default('knirv.com') }}"
    
    # KNIRV Service Subdomains
    knirv_subdomains:
      - chain
      - graph
      - nexus
      - root
      - wallet
      - shell
      - router
      - gateway
      - api
    
    # Instance Tags
    instance_tags:
      Name: "knirv-network-node"
      Project: "KNIRV-NETWORK"
      Environment: "{{ environment | default('production') }}"
      ManagedBy: "ansible"
      
  tasks:
    # =============================================================================
    # INFRASTRUCTURE PROVISIONING
    # =============================================================================
    
    - name: Create VPC (AWS)
      amazon.aws.ec2_vpc:
        name: "knirv-network-vpc"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ region }}"
        tags: "{{ instance_tags }}"
        state: present
      register: vpc_result
      when: cloud_provider == "aws"
      
    - name: Create Internet Gateway (AWS)
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ region }}"
        tags: "{{ instance_tags }}"
        state: present
      register: igw_result
      when: cloud_provider == "aws"
      
    - name: Create Subnet (AWS)
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_result.vpc.id }}"
        cidr: "{{ subnet_cidr }}"
        region: "{{ region }}"
        az: "{{ region }}a"
        map_public: true
        tags: "{{ instance_tags }}"
        state: present
      register: subnet_result
      when: cloud_provider == "aws"
      
    - name: Create Route Table (AWS)
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ region }}"
        routes:
          - dest: "0.0.0.0/0"
            gateway_id: "{{ igw_result.gateway_id }}"
        subnets:
          - "{{ subnet_result.subnet.id }}"
        tags: "{{ instance_tags }}"
        state: present
      when: cloud_provider == "aws"
      
    - name: Create Security Group (AWS)
      amazon.aws.ec2_security_group:
        name: "{{ security_group_name }}"
        description: "KNIRV Network Security Group"
        vpc_id: "{{ vpc_result.vpc.id }}"
        region: "{{ region }}"
        rules:
          # SSH Access
          - proto: tcp
            ports:
              - 22
            cidr_ip: "0.0.0.0/0"
            rule_desc: "SSH Access"
          # HTTP/HTTPS
          - proto: tcp
            ports:
              - 80
              - 443
            cidr_ip: "0.0.0.0/0"
            rule_desc: "HTTP/HTTPS Access"
          # KNIRV Service Ports
          - proto: tcp
            ports: "{{ knirv_ports[:-5] }}"  # Exclude SSH, HTTP, HTTPS, STUN, metrics
            cidr_ip: "0.0.0.0/0"
            rule_desc: "KNIRV Services"
          # STUN/TURN Ports
          - proto: udp
            ports:
              - 3478
            cidr_ip: "0.0.0.0/0"
            rule_desc: "STUN/TURN UDP"
          - proto: tcp
            ports:
              - 3478
              - 5349
            cidr_ip: "0.0.0.0/0"
            rule_desc: "STUN/TURN TCP"
          # Metrics
          - proto: tcp
            ports:
              - 9090
            cidr_ip: "10.0.0.0/8"
            rule_desc: "Metrics (Internal)"
        tags: "{{ instance_tags }}"
        state: present
      register: security_group_result
      when: cloud_provider == "aws"
      
    - name: Launch EC2 Instance (AWS)
      amazon.aws.ec2_instance:
        name: "{{ instance_tags.Name }}"
        image_id: "{{ ami_id | default('ami-0c7217cdde317cfec') }}"  # Ubuntu 22.04 LTS
        instance_type: "{{ instance_type }}"
        key_name: "{{ key_pair_name }}"
        vpc_subnet_id: "{{ subnet_result.subnet.id }}"
        security_groups:
          - "{{ security_group_result.group_id }}"
        region: "{{ region }}"
        tags: "{{ instance_tags }}"
        wait: true
        wait_timeout: 600
        state: present
      register: ec2_result
      when: cloud_provider == "aws"
      
    - name: Allocate Elastic IP (AWS)
      amazon.aws.ec2_eip:
        device_id: "{{ ec2_result.instances[0].instance_id }}"
        region: "{{ region }}"
        tags: "{{ instance_tags }}"
        state: present
      register: eip_result
      when: cloud_provider == "aws"
      
    - name: Add instance to inventory
      add_host:
        hostname: "{{ eip_result.public_ip | default(ec2_result.instances[0].public_ip_address) }}"
        groupname: knirv_nodes
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "~/.ssh/{{ key_pair_name }}.pem"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
        public_ip: "{{ eip_result.public_ip | default(ec2_result.instances[0].public_ip_address) }}"
      when: cloud_provider == "aws"

# =============================================================================
# SERVER CONFIGURATION AND SOFTWARE INSTALLATION
# =============================================================================

- name: Configure KNIRV Network Servers
  hosts: knirv_nodes
  become: true
  gather_facts: true
  vars:
    docker_compose_version: "2.21.0"
    kubectl_version: "1.28.0"
    
  tasks:
    - name: Wait for SSH to become available
      wait_for_connection:
        delay: 30
        timeout: 300
        
    - name: Update system packages
      apt:
        update_cache: true
        upgrade: dist
        autoremove: true
        autoclean: true
      register: apt_update
      retries: 3
      delay: 10
      
    - name: Install essential packages
      apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - software-properties-common
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - htop
          - vim
          - ufw
          - fail2ban
        state: present
        
    # =============================================================================
    # FIREWALL CONFIGURATION
    # =============================================================================
    
    - name: Configure UFW firewall
      block:
        - name: Reset UFW to defaults
          ufw:
            state: reset
            
        - name: Set UFW default policies
          ufw:
            direction: "{{ item.direction }}"
            policy: "{{ item.policy }}"
          loop:
            - { direction: 'incoming', policy: 'deny' }
            - { direction: 'outgoing', policy: 'allow' }
            
        - name: Allow SSH
          ufw:
            rule: allow
            port: '22'
            proto: tcp
            
        - name: Allow HTTP/HTTPS
          ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop:
            - '80'
            - '443'
            
        - name: Allow KNIRV service ports
          ufw:
            rule: allow
            port: "{{ item }}"
            proto: tcp
          loop:
            - '8080'  # KNIRVCHAIN
            - '8081'  # KNIRVGRAPH
            - '8082'  # KNIRVNEXUS
            - '8083'  # KNIRVROOT
            - '8084'  # KNIRVWALLET
            - '8085'  # KNIRVSHELL
            - '8086'  # KNIRVROUTER
            - '8087'  # KNIRVGATEWAY
            
        - name: Allow STUN/TURN ports
          ufw:
            rule: allow
            port: "{{ item.port }}"
            proto: "{{ item.proto }}"
          loop:
            - { port: '3478', proto: 'tcp' }
            - { port: '3478', proto: 'udp' }
            - { port: '5349', proto: 'tcp' }
            
        - name: Enable UFW
          ufw:
            state: enabled
            
    # =============================================================================
    # USER MANAGEMENT
    # =============================================================================
    
    - name: Create knirv system user
      user:
        name: knirv
        system: true
        shell: /bin/bash
        home: /opt/knirv
        create_home: true
        groups: docker
        append: true
        
    - name: Create knirv directories
      file:
        path: "{{ item }}"
        state: directory
        owner: knirv
        group: knirv
        mode: '0755'
      loop:
        - /opt/knirv
        - /opt/knirv/data
        - /opt/knirv/logs
        - /opt/knirv/config
        - /opt/knirv/scripts
        
    # =============================================================================
    # DOCKER INSTALLATION
    # =============================================================================
    
    - name: Install Docker
      block:
        - name: Add Docker GPG key
          apt_key:
            url: https://download.docker.com/linux/ubuntu/gpg
            state: present
            
        - name: Add Docker repository
          apt_repository:
            repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
            state: present
            
        - name: Install Docker packages
          apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-buildx-plugin
            state: present
            update_cache: true
            
        - name: Start and enable Docker service
          systemd:
            name: docker
            state: started
            enabled: true
            
        - name: Add ubuntu user to docker group
          user:
            name: ubuntu
            groups: docker
            append: true
            
        - name: Install Docker Compose
          get_url:
            url: "https://github.com/docker/compose/releases/download/v{{ docker_compose_version }}/docker-compose-linux-x86_64"
            dest: /usr/local/bin/docker-compose
            mode: '0755'
            
        - name: Create docker-compose symlink
          file:
            src: /usr/local/bin/docker-compose
            dest: /usr/bin/docker-compose
            state: link

    # =============================================================================
    # KUBERNETES INSTALLATION
    # =============================================================================

    - name: Install Kubernetes tools
      block:
        - name: Add Kubernetes GPG key
          apt_key:
            url: https://packages.cloud.google.com/apt/doc/apt-key.gpg
            state: present

        - name: Add Kubernetes repository
          apt_repository:
            repo: "deb https://apt.kubernetes.io/ kubernetes-xenial main"
            state: present

        - name: Install kubectl
          apt:
            name: kubectl={{ kubectl_version }}-00
            state: present
            update_cache: true

        - name: Hold kubectl version
          dpkg_selections:
            name: kubectl
            selection: hold

        - name: Download and install k3s (lightweight Kubernetes)
          shell: |
            curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--disable traefik" sh -
          args:
            creates: /usr/local/bin/k3s

        - name: Wait for k3s to be ready
          wait_for:
            port: 6443
            host: localhost
            timeout: 300

        - name: Copy k3s kubeconfig for ubuntu user
          copy:
            src: /etc/rancher/k3s/k3s.yaml
            dest: /home/ubuntu/.kube/config
            owner: ubuntu
            group: ubuntu
            mode: '0600'
            remote_src: true

        - name: Create .kube directory for ubuntu user
          file:
            path: /home/ubuntu/.kube
            state: directory
            owner: ubuntu
            group: ubuntu
            mode: '0755'

        - name: Copy k3s kubeconfig for knirv user
          copy:
            src: /etc/rancher/k3s/k3s.yaml
            dest: /opt/knirv/.kube/config
            owner: knirv
            group: knirv
            mode: '0600'
            remote_src: true

        - name: Create .kube directory for knirv user
          file:
            path: /opt/knirv/.kube
            state: directory
            owner: knirv
            group: knirv
            mode: '0755'

    # =============================================================================
    # SYSTEM OPTIMIZATION
    # =============================================================================

    - name: Configure system optimization
      block:
        - name: Set kernel parameters for networking
          sysctl:
            name: "{{ item.name }}"
            value: "{{ item.value }}"
            state: present
            reload: true
          loop:
            - { name: 'net.core.rmem_max', value: '134217728' }
            - { name: 'net.core.wmem_max', value: '134217728' }
            - { name: 'net.ipv4.tcp_rmem', value: '4096 65536 134217728' }
            - { name: 'net.ipv4.tcp_wmem', value: '4096 65536 134217728' }
            - { name: 'net.core.netdev_max_backlog', value: '5000' }
            - { name: 'net.ipv4.ip_forward', value: '1' }

        - name: Configure Docker daemon
          copy:
            content: |
              {
                "log-driver": "json-file",
                "log-opts": {
                  "max-size": "10m",
                  "max-file": "3"
                },
                "storage-driver": "overlay2",
                "exec-opts": ["native.cgroupdriver=systemd"]
              }
            dest: /etc/docker/daemon.json
            mode: '0644'
          notify: restart docker

        - name: Configure fail2ban for SSH protection
          copy:
            content: |
              [sshd]
              enabled = true
              port = ssh
              filter = sshd
              logpath = /var/log/auth.log
              maxretry = 3
              bantime = 3600
              findtime = 600
            dest: /etc/fail2ban/jail.local
            mode: '0644'
          notify: restart fail2ban

    # =============================================================================
    # MONITORING AND LOGGING SETUP
    # =============================================================================

    - name: Setup monitoring and logging
      block:
        - name: Install monitoring tools
          apt:
            name:
              - htop
              - iotop
              - nethogs
              - ncdu
              - tree
              - jq
            state: present

        - name: Configure log rotation for KNIRV services
          copy:
            content: |
              /opt/knirv/logs/*.log {
                daily
                missingok
                rotate 7
                compress
                delaycompress
                notifempty
                copytruncate
                su knirv knirv
              }
            dest: /etc/logrotate.d/knirv
            mode: '0644'

        - name: Create KNIRV service monitoring script
          copy:
            content: |
              #!/bin/bash
              # KNIRV Network Health Check Script

              SERVICES=(
                "chain:8080"
                "graph:8081"
                "nexus:8082"
                "root:8083"
                "wallet:8084"
                "shell:8085"
                "router:8086"
                "gateway:8087"
              )

              echo "KNIRV Network Health Check - $(date)"
              echo "=========================================="

              for service in "${SERVICES[@]}"; do
                name=$(echo $service | cut -d: -f1)
                port=$(echo $service | cut -d: -f2)

                if curl -s -f "http://localhost:$port/health" > /dev/null 2>&1; then
                  echo "✅ KNIRV$name ($port): HEALTHY"
                else
                  echo "❌ KNIRV$name ($port): UNHEALTHY"
                fi
              done

              echo ""
              echo "System Resources:"
              echo "CPU: $(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | cut -d'%' -f1)% used"
              echo "Memory: $(free | grep Mem | awk '{printf("%.1f%%", $3/$2 * 100.0)}')"
              echo "Disk: $(df -h / | awk 'NR==2{printf "%s", $5}')"
            dest: /opt/knirv/scripts/health-check.sh
            mode: '0755'
            owner: knirv
            group: knirv

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

    - name: restart fail2ban
      systemd:
        name: fail2ban
        state: restarted

# =============================================================================
# CLOUDFLARE DNS MANAGEMENT
# =============================================================================

- name: Update Cloudflare DNS Records
  hosts: localhost
  gather_facts: false
  vars:
    public_ip: "{{ hostvars[groups['knirv_nodes'][0]]['public_ip'] }}"

  tasks:
    - name: Get current public IP if not provided
      uri:
        url: https://api.ipify.org
        method: GET
        return_content: true
      register: ip_response
      when: public_ip is not defined

    - name: Set public IP from response
      set_fact:
        public_ip: "{{ ip_response.content | trim }}"
      when: public_ip is not defined

    - name: Display public IP
      debug:
        msg: "Updating DNS records to point to: {{ public_ip }}"

    - name: Update DNS A records for KNIRV subdomains
      cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ item }}.{{ domain_name }}"
        type: A
        value: "{{ public_ip }}"
        api_token: "{{ cloudflare_api_token }}"
        state: present
      loop: "{{ knirv_subdomains }}"
      when:
        - cloudflare_api_token is defined
        - cloudflare_zone_id is defined

    - name: Update main domain A record
      cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}"
        type: A
        value: "{{ public_ip }}"
        api_token: "{{ cloudflare_api_token }}"
        state: present
      when:
        - cloudflare_api_token is defined
        - cloudflare_zone_id is defined

    - name: Create wildcard DNS record for development
      cloudflare_dns:
        zone: "{{ domain_name }}"
        record: "*.{{ domain_name }}"
        type: A
        value: "{{ public_ip }}"
        api_token: "{{ cloudflare_api_token }}"
        state: present
      when:
        - cloudflare_api_token is defined
        - cloudflare_zone_id is defined
        - environment == "development"

    - name: Display DNS update summary
      debug:
        msg: |
          DNS Records Updated:
          {% for subdomain in knirv_subdomains %}
          - {{ subdomain }}.{{ domain_name }} -> {{ public_ip }}
          {% endfor %}
          - {{ domain_name }} -> {{ public_ip }}
          {% if environment == "development" %}
          - *.{{ domain_name }} -> {{ public_ip }}
          {% endif %}

# =============================================================================
# POST-DEPLOYMENT VERIFICATION
# =============================================================================

- name: Verify Infrastructure Deployment
  hosts: knirv_nodes
  become: true
  gather_facts: false

  tasks:
    - name: Verify Docker is running
      systemd:
        name: docker
        state: started
      register: docker_status

    - name: Verify k3s is running
      systemd:
        name: k3s
        state: started
      register: k3s_status

    - name: Test Docker functionality
      command: docker run --rm hello-world
      register: docker_test
      changed_when: false

    - name: Test kubectl connectivity
      command: kubectl get nodes
      register: kubectl_test
      changed_when: false
      become_user: ubuntu

    - name: Display verification results
      debug:
        msg: |
          Infrastructure Verification Results:
          ====================================
          ✅ Docker Status: {{ docker_status.status.ActiveState }}
          ✅ K3s Status: {{ k3s_status.status.ActiveState }}
          ✅ Docker Test: {{ 'PASSED' if docker_test.rc == 0 else 'FAILED' }}
          ✅ Kubectl Test: {{ 'PASSED' if kubectl_test.rc == 0 else 'FAILED' }}

          Next Steps:
          -----------
          1. Deploy KNIRV services using existing Docker/Kubernetes infrastructure
          2. Run: cd /path/to/knirv && ./deployment/deploy.sh deploy
          3. Monitor services: /opt/knirv/scripts/health-check.sh
          4. Access services at: https://{{ ansible_host }}:PORT

          Infrastructure is ready for KNIRV application deployment!
