# KNIRV Network Ansible Configuration
# This file configures Ansible behavior for KNIRV infrastructure deployment

[defaults]
# Inventory configuration
inventory = inventory/hosts.ini
host_key_checking = False
remote_user = ubuntu

# Performance settings
forks = 10
poll_interval = 15
timeout = 30
gathering = smart
fact_caching = memory
fact_caching_timeout = 86400

# Logging and output
log_path = ./ansible.log
display_skipped_hosts = False
display_ok_hosts = True
stdout_callback = yaml
bin_ansible_callbacks = True

# SSH settings
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
control_path_dir = ~/.ansible/cp

# Privilege escalation
become = True
become_method = sudo
become_user = root
become_ask_pass = False

# Retry settings
retry_files_enabled = True
retry_files_save_path = ./retry

[inventory]
enable_plugins = host_list, script, auto, yaml, ini, toml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
retries = 3
# Note: avoid setting a global remote_tmp to a user-specific home directory
# because it can break localhost/local-connection tasks on the control node.
# For hosts that need a custom remote tmp, set `ansible_remote_tmp` per-host or
# per-group in inventory (see inventory/hosts.ini).

[persistent_connection]
connect_timeout = 30
command_timeout = 30
