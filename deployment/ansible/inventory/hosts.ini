# KNIRV Network Ansible Inventory
# This file defines the target hosts for infrastructure deployment

[knirv_nodes]
# Hosts will be dynamically added during playbook execution
# Example static entries (uncomment and modify as needed):
# knirv-node-1 ansible_host=1.2.3.4 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/knirv-network-key.pem

[knirv_nodes:vars]
# Common variables for all KNIRV nodes
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
ansible_python_interpreter=/usr/bin/python3

[local]
localhost ansible_connection=local

[all:vars]
# Global variables
ansible_ssh_pipelining=true
ansible_ssh_retries=3
