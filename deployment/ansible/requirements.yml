# Ansible Collections Requirements for KNIRV Network Infrastructure

collections:
  # AWS/Amazon Web Services
  - name: amazon.aws
    version: ">=6.0.0"
    
  # Community General (includes Cloudflare modules)
  - name: community.general
    version: ">=7.0.0"
    
  # Community Crypto (for SSL/TLS management)
  - name: community.crypto
    version: ">=2.0.0"
    
  # Kubernetes management
  - name: kubernetes.core
    version: ">=2.4.0"
    
  # Google Cloud Platform (optional)
  - name: google.cloud
    version: ">=1.0.0"
    
  # Microsoft Azure (optional)
  - name: azure.azcollection
    version: ">=1.0.0"
    
  # DigitalOcean (optional)
  - name: community.digitalocean
    version: ">=1.0.0"

# Install with: ansible-galaxy collection install -r requirements.yml
