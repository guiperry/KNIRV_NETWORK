# KNIRV Network Staging Environment Configuration

# =============================================================================
# STAGING ENVIRONMENT SETTINGS
# =============================================================================

environment: staging
debug_mode: false

# =============================================================================
# INFRASTRUCTURE CONFIGURATION
# =============================================================================

# Staging instance sizing (between dev and prod)
instance_type: t3.medium
region: us-east-1

# Limited high availability for staging
enable_ha: false
min_instances: 1
max_instances: 2

# =============================================================================
# DOMAIN CONFIGURATION
# =============================================================================

domain_name: knirv.com
subdomain_prefix: "staging"

# Staging subdomains with staging prefix
knirv_subdomains:
  - staging-chain      # staging-chain.knirv.com
  - staging-graph      # staging-graph.knirv.com
  - staging-nexus      # staging-nexus.knirv.com
  - staging-root       # staging-root.knirv.com
  - staging-wallet     # staging-wallet.knirv.com
  - staging-shell      # staging-shell.knirv.com
  - staging-router     # staging-router.knirv.com
  - staging-gateway    # staging-gateway.knirv.com
  - staging-api        # staging-api.knirv.com

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Production-like security for staging
firewall_enabled: true
fail2ban_enabled: true
enable_intrusion_detection: false

# SSL/TLS configuration
ssl_config:
  enable_letsencrypt: true
  cert_email: staging@knirv.com
  force_https: true
  hsts_enabled: false

# SSH hardening (production-like)
ssh_hardening:
  disable_root_login: true
  disable_password_auth: true
  max_auth_tries: 3
  client_alive_interval: 300
  client_alive_count_max: 2

# =============================================================================
# RESOURCE CONFIGURATION
# =============================================================================

# Staging resource limits (moderate)
resource_limits:
  cpu_limit: "2000m"
  memory_limit: "4Gi"
  cpu_request: "500m"
  memory_request: "1Gi"

# Storage configuration
storage_config:
  data_volume_size: "50Gi"
  backup_volume_size: "100Gi"
  storage_class: "gp2"

# =============================================================================
# MONITORING AND ALERTING
# =============================================================================

# Enhanced monitoring for staging
monitoring:
  enabled: true
  prometheus_port: 9090
  grafana_port: 3000
  alertmanager_port: 9093
  retention_days: 14

# Limited alerting for staging
alerting:
  enabled: true
  slack_webhook: "{{ vault_staging_slack_webhook }}"
  email_alerts: "staging@knirv.com"

# Standard health checks
health_check:
  interval: 30
  timeout: 10
  retries: 3
  critical_threshold: 85

# =============================================================================
# BACKUP CONFIGURATION
# =============================================================================

backup_config:
  enabled: true
  retention_days: 14
  schedule: "0 3 * * *"  # Daily at 3 AM
  s3_bucket: "knirv-staging-backups"
  encryption_enabled: true

# =============================================================================
# PERFORMANCE OPTIMIZATION
# =============================================================================

# Staging performance settings
performance:
  enable_caching: true
  cache_size: "1Gi"
  connection_pooling: true
  max_connections: 500
  worker_processes: 2

# Database configuration
database:
  type: postgresql
  host: postgres-staging
  port: 5432
  name: knirv_staging
  user: knirv_staging
  max_connections: 100
  shared_buffers: "1GB"
  effective_cache_size: "3GB"

# =============================================================================
# STAGING FEATURES
# =============================================================================

# Staging-specific features
staging_features:
  enable_performance_testing: true
  enable_load_testing: true
  enable_integration_tests: true
  enable_security_scanning: true
  data_refresh_enabled: true

# Testing configuration
testing:
  enable_integration_tests: true
  enable_load_tests: true
  enable_security_tests: true
  test_data_refresh: "weekly"

# =============================================================================
# CLOUDFLARE CONFIGURATION
# =============================================================================

# Staging Cloudflare settings
cloudflare:
  proxy_enabled: true
  ssl_mode: "strict"
  security_level: "medium"
  cache_level: "standard"
  minify_enabled: true
  brotli_enabled: true

# Basic WAF rules for staging
waf_rules:
  - "Block known bad IPs"
  - "Rate limit API endpoints"

# =============================================================================
# INTEGRATION SETTINGS
# =============================================================================

# Staging integrations (production-like but separate)
integrations:
  xion_rpc: "https://testnet.xion.burnt.com:443"
  enable_blockchain_bridge: true
  enable_ai_services: true
  enable_analytics: true
  enable_error_tracking: true

# Staging external services
external_services:
  sentry_dsn: "{{ vault_staging_sentry_dsn }}"
  datadog_api_key: "{{ vault_staging_datadog_api_key }}"
  use_staging_endpoints: true

# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================

# Staging deployment settings
deployment:
  auto_deploy_enabled: true
  deploy_on_push: true
  branch: "staging"
  rollback_enabled: true
  canary_deployment: false

# CI/CD integration
cicd:
  enable_automated_tests: true
  enable_performance_tests: true
  enable_security_scans: true
  notification_channels:
    - slack
    - email
