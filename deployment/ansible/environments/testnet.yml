# KNIRVTESTNET Environment Configuration
# Dedicated testnet deployment separate from production/development/staging

# =============================================================================
# ENVIRONMENT IDENTIFICATION
# =============================================================================

environment: testnet
debug_mode: true
enable_metrics: true
enable_tracing: true

# =============================================================================
# CLOUD PROVIDER CONFIGURATION
# =============================================================================

cloud_provider: aws
region: us-east-2

# Instance configuration for testnet
instance_type: t2.micro  # Larger instance for running full testnet
ami_id: ami-0cfde0ea8edd312d4  # Ubuntu 22.04 LTS
key_pair_name: AEGONG

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================

vpc_cidr: 10.1.0.0/16
subnet_cidr: 10.1.1.0/24

# KNIRVTESTNET specific ports (matching docker-compose.yml)
testnet_ports:
  ipfs_api: 5001
  ipfs_gateway: 8080
  knirvoracle_api: 1317
  knirvoracle_rpc: 26657
  knirvoracle_p2p: 26656
  knirvchain: 8080
  knirvgraph: 8081
  knirvnexus_1: 8082
  knirvnexus_2: 8083
  knirvrouter: 8086
  knirvgateway: 8087
  knirvana: 3000

# =============================================================================
# DNS CONFIGURATION
# =============================================================================

domain_name: knirv.network
testnet_subdomain: testnet

# Testnet-specific subdomains
testnet_subdomains:
  - testnet
  - api-testnet
  - chain-testnet
  - graph-testnet
  - nexus-testnet
  - root-testnet
  - router-testnet
  - gateway-testnet
  - oracle-testnet
  - shell-testnet
  - knirvana-testnet
  - controller-testnet


# =============================================================================
# INSTANCE TAGS
# =============================================================================

instance_tags:
  Name: "knirv-testnet-node"
  Project: "KNIRV-TESTNET"
  Environment: "testnet"
  ManagedBy: "ansible"
  Purpose: "blockchain-testnet"
  AutoShutdown: "false"  # Keep testnet running

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================

# Firewall configuration for testnet
firewall_enabled: true
fail2ban_enabled: true

# SSH configuration
ssh_hardening:
  disable_root_login: true
  disable_password_auth: true
  max_auth_tries: 5  # More lenient for testnet
  client_alive_interval: 300
  client_alive_count_max: 3

# =============================================================================
# TESTNET SPECIFIC CONFIGURATION
# =============================================================================

# Docker configuration for testnet
docker_config:
  log_driver: json-file
  log_max_size: 50m  # Larger logs for testnet debugging
  log_max_files: 5
  storage_driver: overlay2

# Testnet data directories
testnet_directories:
  - /opt/knirv-testnet
  - /opt/knirv-testnet/data
  - /opt/knirv-testnet/logs
  - /opt/knirv-testnet/config
  - /opt/knirv-testnet/backups

# Resource limits for testnet
resource_limits:
  cpu_limit: "4000m"
  memory_limit: "8Gi"
  cpu_request: "1000m"
  memory_request: "2Gi"

# =============================================================================
# MONITORING AND LOGGING
# =============================================================================

# Enhanced logging for testnet
log_retention_days: 14  # Longer retention for debugging
log_max_size: "50m"
log_max_files: 5

# Health check configuration
health_check:
  interval: 15  # More frequent checks
  timeout: 30
  retries: 5

# Monitoring configuration
monitoring:
  prometheus_port: 9090
  grafana_port: 3000
  alertmanager_port: 9093
  enable_node_exporter: true
  enable_cadvisor: true

# =============================================================================
# BACKUP CONFIGURATION
# =============================================================================

backup_config:
  enabled: false  # Disabled for testnet
  retention_days: 7  # Shorter retention for testnet
  schedule: "0 4 * * *"  # Daily at 4 AM
  s3_bucket: "knirv-testnet-backups"

# =============================================================================
# INTEGRATION SETTINGS
# =============================================================================

# External service integrations for testnet
integrations:
  xion_rpc: "https://rpc.xion.burnt.com:443"
  enable_blockchain_bridge: true
  enable_ai_services: true
  testnet_mode: true

# Database configuration for testnet
database:
  type: postgresql
  host: postgres-testnet
  port: 5432
  name: knirv_testnet_db
  user: knirv_testnet_db_user
  password: "{{ database_password | default('') }}"

# =============================================================================
# FRONTEND INTEGRATION
# =============================================================================

# Netlify frontend integration
frontend_config:
  netlify_site_id: "{{ netlify_site_id | default('') }}"
  frontend_repo: "https://github.com/guiperry/KNIRV_NETWORK.git"
  frontend_branch: main
  frontend_build_dir: KNIRVGATEWAY
  testnet_frontend_dir: knirvtestnet

# API endpoints for frontend (testnet automatically updates KNIRVGATEWAY)
api_endpoints:
  testnet_base: "https://testnet.knirv.network"
  chain_api: "https://chain-api-testnet.knirv.network:8080"
  graph_api: "https://graph-api-testnet.knirv.network:8081"
  server_api: "https://nexus-api-testnet.knirv.network:8082"
  oracle_api: "https://oracle-api-testnet.knirv.network:1317"
  router_api: "https://router-api-testnet.knirv.network:8086"
  gateway_api: "https://gateway-api-testnet.knirv.network:8087"
  knirvana_api: "https://knirvana-api-testnet.knirv.network:3000"
  wallet_pwa: "https://wallet-testnet.knirv.network"

# KNIRVGATEWAY endpoint configuration (auto-updated for testnet)
gateway_endpoints:
  KNIRVCHAIN_API: "https://chain-api-testnet.knirv.network:8080"
  KNIRVGRAPH_API: "https://graph-api-testnet.knirv.network:8081"
  KNIRVSERVER_API: "https://nexus-api-testnet.knirv.network:8082"
  KNIRVORACLE_API: "https://oracle-api-testnet.knirv.network:1317"
  KNIRVROUTER_API: "https://router-api-testnet.knirv.network:8086"
  KNIRVANA_API: "https://knirvana-api-testnet.knirv.network:3000"
  KNIRVWALLET_PWA: "https://wallet-testnet.knirv.network"
  
# =============================================================================
# DEPLOYMENT CONFIGURATION
# =============================================================================

# Deployment settings
deployment:
  strategy: rolling
  max_unavailable: 1
  health_check_grace_period: 60
  startup_timeout: 300
  
# Service startup order
service_startup_order:
  - ipfs
  - knirvoracle
  - knirvchain
  - knirvgraph
  - knirvserver-1
  - knirvserver-2
  - knirvrouter
  - knirvana
  - knirvgateway

# =============================================================================
# DEVELOPMENT FEATURES
# =============================================================================

# Development and testing features enabled for testnet
dev_features:
  enable_debug_endpoints: true
  enable_test_tokens: true
  enable_mock_services: false  # Use real services
  enable_cors_all: true
  enable_swagger_ui: true
  log_level: debug

# =============================================================================
# KNIRVWALLET PWA TESTNET CONFIGURATION
# =============================================================================

# PWA deployment configuration for testnet
wallet_pwa_testnet:
  enabled: true
  domain: "wallet-testnet.knirv.network"
  beta_domain: "beta-wallet-testnet.knirv.network"
  build_dir: "dist"
  packages_dir: "packages"

# CloudFlare Pages configuration for testnet PWA
cloudflare_pages_testnet:
  project_name: "knirv-controller-pwa-testnet"
  production_branch: "main"
  preview_branch: "develop"
  build_command: "npm run build:pwa:testnet"
  build_output_directory: "dist"

# Mobile app distribution for testnet
mobile_distribution_testnet:
  android_package: "knirvcontroller-android-testnet.zip"
  ios_package: "knirvcontroller-ios-testnet.zip"
  max_package_size: "50MB"

# PWA authentication configuration for testnet
pwa_auth_testnet:
  enable_biometric: true
  enable_device_storage: true
  session_timeout: 7200  # 2 hours for testnet
  enable_offline_mode: true
  enable_debug_mode: true
