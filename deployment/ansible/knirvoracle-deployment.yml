---
# KNIRVORACLE Deployment Playbook
# Purpose: Deploy KNIRVORACLE with embedded services to KNIRV Network infrastructure
# Integrates with network-wide deployment process

- name: Deploy KNIRVORACLE to KNIRV Network Infrastructure
  hosts: knirv_nodes
  become: true
  gather_facts: true
  vars:
    # KNIRVORACLE Configuration
    knirvoracle_version: "{{ knirvoracle_version | default('latest') }}"
    knirvoracle_home: "/opt/knirv/knirvoracle"
    knirvoracle_user: "knirv"
    knirvoracle_binary: "knirvoracle"
    
    # Source path - uses packages/ if exists, otherwise legacy path
    knirvoracle_src_base: "{{ playbook_dir }}/../../packages/KNIRVORACLE"
    knirvoracle_legacy_src: "{{ playbook_dir }}/../../KNIRVORACLE"
    
    # Service Configuration
    oracle_main_port: "{{ oracle_main_port | default('1317', true) }}"
    bootnode_registry_port: "{{ bootnode_registry_port | default('3006', true) }}"
    tunnel_registry_port: "{{ tunnel_registry_port | default('3003', true) }}"
    notary_system_port: "{{ notary_system_port | default('3007', true) }}"
    network_monitor_port: "{{ network_monitor_port | default('3008', true) }}"
    nanda_ans_port: "{{ nanda_ans_port | default('3009', true) }}"
    
    # Environment Configuration
    env_name: "{{ env | default('production', true) }}"
    zone_name: "{{ cloudflare_zone | default('knirv.com', true) }}"
    
    # KNIRVORACLE Embedded Services
    knirvoracle_services:
      - name: "bootnode-registry"
        port: "{{ bootnode_registry_port }}"
        enabled: true
        script_path: "operator-registry/registry-service.js"
      - name: "tunnel-registry"
        port: "{{ tunnel_registry_port }}"
        enabled: true
        script_path: "agent-tunnel-registry/server.js"
      - name: "notary-system"
        port: "{{ notary_system_port }}"
        enabled: true
        script_path: "agent-notary-system/server.js"
      - name: "network-monitor"
        port: "{{ network_monitor_port }}"
        enabled: true
        script_path: "agent-network-monitor/server.js"
      - name: "nanda-ans"
        port: "{{ nanda_ans_port }}"
        enabled: true
        static_files: true

  tasks:
    # =============================================================================
    # KNIRVORACLE INSTALLATION AND SETUP
    # =============================================================================
    
    - name: Create KNIRVORACLE directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ knirvoracle_user }}"
        group: "{{ knirvoracle_user }}"
        mode: '0755'
      loop:
        - "{{ knirvoracle_home }}"
        - "{{ knirvoracle_home }}/bin"
        - "{{ knirvoracle_home }}/config"
        - "{{ knirvoracle_home }}/data"
        - "{{ knirvoracle_home }}/logs"
        - "{{ knirvoracle_home }}/scripts"
        - "{{ knirvoracle_home }}/nodejs-services"

    - name: Install Node.js and npm for embedded services
      block:
        - name: Add NodeSource GPG key
          apt_key:
            url: https://deb.nodesource.com/gpgkey/nodesource.gpg.key
            state: present

        - name: Add NodeSource repository
          apt_repository:
            repo: "deb https://deb.nodesource.com/node_18.x {{ ansible_distribution_release }} main"
            state: present

        - name: Install Node.js
          apt:
            name:
              - nodejs
              - npm
            state: present
            update_cache: true

        - name: Install global npm packages for KNIRVORACLE services
          npm:
            name: "{{ item }}"
            global: true
            state: present
          loop:
            - pm2
            - typescript
            - ts-node

    - name: Copy KNIRVORACLE binary
      copy:
        src: "{{ knirvoracle_src_base }}/bin/{{ knirvoracle_binary }}"
        dest: "{{ knirvoracle_home }}/bin/{{ knirvoracle_binary }}"
        owner: "{{ knirvoracle_user }}"
        group: "{{ knirvoracle_user }}"
        mode: '0755'
      notify: restart knirvoracle

    - name: Copy KNIRVORACLE configuration
      template:
        src: "{{ playbook_dir }}/templates/knirvoracle-config.toml.j2"
        dest: "{{ knirvoracle_home }}/config/config.toml"
        owner: "{{ knirvoracle_user }}"
        group: "{{ knirvoracle_user }}"
        mode: '0644'
      notify: restart knirvoracle

    - name: Copy Node.js services for KNIRVORACLE
      synchronize:
        src: "{{ knirvoracle_src_base }}/nodejs-services/"
        dest: "{{ knirvoracle_home }}/nodejs-services/"
        delete: true
        recursive: true
      become_user: "{{ knirvoracle_user }}"
      notify: restart knirvoracle

    - name: Install Node.js dependencies for embedded services
      npm:
        path: "{{ knirvoracle_home }}/nodejs-services/{{ item.script_path | dirname }}"
        state: present
      loop: "{{ knirvoracle_services }}"
      when: item.enabled and not item.static_files | default(false)
      become_user: "{{ knirvoracle_user }}"

    # =============================================================================
    # SYSTEMD SERVICE CONFIGURATION
    # =============================================================================

    - name: Create KNIRVORACLE systemd service
      template:
        src: "{{ playbook_dir }}/templates/knirvoracle.service.j2"
        dest: /etc/systemd/system/knirvoracle.service
        mode: '0644'
      notify:
        - reload systemd
        - restart knirvoracle

    - name: Create KNIRVORACLE environment file
      template:
        src: "{{ playbook_dir }}/templates/knirvoracle.env.j2"
        dest: "{{ knirvoracle_home }}/config/knirvoracle.env"
        owner: "{{ knirvoracle_user }}"
        group: "{{ knirvoracle_user }}"
        mode: '0600'
      notify: restart knirvoracle

    # =============================================================================
    # FIREWALL CONFIGURATION FOR KNIRVORACLE SERVICES
    # =============================================================================

    - name: Configure firewall for KNIRVORACLE services
      ufw:
        rule: allow
        port: "{{ item.port }}"
        proto: tcp
        comment: "KNIRVORACLE {{ item.name }}"
      loop: "{{ knirvoracle_services }}"
      when: item.enabled

    - name: Allow KNIRVORACLE main port
      ufw:
        rule: allow
        port: "{{ oracle_main_port }}"
        proto: tcp
        comment: "KNIRVORACLE Main Service"

    # =============================================================================
    # SERVICE MANAGEMENT
    # =============================================================================

    - name: Enable and start KNIRVORACLE service
      systemd:
        name: knirvoracle
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for KNIRVORACLE to be ready
      wait_for:
        port: "{{ oracle_main_port }}"
        host: localhost
        timeout: 120
        delay: 10

    - name: Verify KNIRVORACLE embedded services
      uri:
        url: "http://localhost:{{ item.port }}/health"
        method: GET
        timeout: 10
      loop: "{{ knirvoracle_services }}"
      when: item.enabled and not item.static_files | default(false)
      register: service_health_check
      retries: 3
      delay: 5

    # =============================================================================
    # MONITORING AND LOGGING SETUP
    # =============================================================================

    - name: Create KNIRVORACLE monitoring script
      template:
        src: "{{ playbook_dir }}/templates/knirvoracle-monitor.sh.j2"
        dest: "{{ knirvoracle_home }}/scripts/monitor.sh"
        owner: "{{ knirvoracle_user }}"
        group: "{{ knirvoracle_user }}"
        mode: '0755'

    - name: Configure log rotation for KNIRVORACLE
      copy:
        content: |
          {{ knirvoracle_home }}/logs/*.log {
            daily
            missingok
            rotate 14
            compress
            delaycompress
            notifempty
            copytruncate
            su {{ knirvoracle_user }} {{ knirvoracle_user }}
          }
        dest: /etc/logrotate.d/knirvoracle
        mode: '0644'

    - name: Create KNIRVORACLE health check cron job
      cron:
        name: "KNIRVORACLE health check"
        minute: "*/5"
        job: "{{ knirvoracle_home }}/scripts/monitor.sh >> {{ knirvoracle_home }}/logs/health-check.log 2>&1"
        user: "{{ knirvoracle_user }}"

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true

    - name: restart knirvoracle
      systemd:
        name: knirvoracle
        state: restarted

# =============================================================================
# CLOUDFLARE DNS INTEGRATION
# =============================================================================

- name: Update CloudFlare DNS Records for KNIRVORACLE Services
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - community.general
  vars:
    # Use effective vars to avoid self-referential issues
    zone_name: "{{ cloudflare_zone | default('knirv.com', true) }}"
    env_name: "{{ env | default('production', true) }}"
    cf_server_ip: "{{ server_ip | default(oracle_server_ip | default(hostvars[groups['knirv_nodes'][0]]['public_ip'], true), true) }}"
    
    # KNIRVORACLE DNS Records
    knirvoracle_dns_records:
      # Main KNIRVORACLE service
      - name: "oracle"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE Main Service"

      # Environment-specific main record
      - name: "{{ env_name }}.oracle"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: false
        comment: "KNIRVORACLE {{ env_name | title }} Environment"

      # Embedded services
      - name: "bootnode-registry"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE Agent Bootnode Registry Service"

      - name: "tunnel-registry"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE Agent Tunnel Registry Service"

      - name: "notary-system"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE Agent Notary System Service"

      - name: "network-monitor"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE Network Monitor Service"

      - name: "nanda-ans"
        type: "A"
        content: "{{ cf_server_ip }}"
        ttl: 300
        proxied: true
        comment: "KNIRVORACLE NANDA-ANS Agent Registry Service"

  tasks:
    - name: Validate required variables for DNS
      assert:
        that:
          - cloudflare_api_token | default('', true) | length > 0
          - zone_name | default('', true) | length > 0
          - cf_server_ip | default('', true) | length > 0
        fail_msg: "cloudflare_api_token, zone_name, and cf_server_ip are required for DNS updates."

    - name: Create/Update CloudFlare DNS records for KNIRVORACLE services
      no_log: true
      community.general.cloudflare_dns:
        zone: "{{ zone_name }}"
        record: "{{ item.name }}"
        type: "{{ item.type }}"
        value: "{{ item.content }}"
        ttl: "{{ item.ttl }}"
        proxied: "{{ item.proxied | default(false) }}"
        api_token: "{{ cloudflare_api_token }}"
        state: present
      loop: "{{ knirvoracle_dns_records }}"
      register: dns_results
      delegate_to: localhost

    - name: Display KNIRVORACLE DNS update results
      debug:
        msg: "Updated DNS record: {{ item.item.name }}.{{ zone_name }} -> {{ item.item.content }}"
      loop: "{{ dns_results.results }}"
      when: item.changed

    - name: Summary of KNIRVORACLE deployment
      debug:
        msg: |
          KNIRVORACLE Deployment Complete:
          ===============================
          🚀 Main Service: oracle.{{ zone_name }} -> {{ cf_server_ip }}:{{ oracle_main_port }}
          🔗 Bootnode Registry: bootnode-registry.{{ zone_name }} -> {{ cf_server_ip }}:{{ bootnode_registry_port }}
          🌐 Tunnel Registry: tunnel-registry.{{ zone_name }} -> {{ cf_server_ip }}:{{ tunnel_registry_port }}
          📋 Notary System: notary-system.{{ zone_name }} -> {{ cf_server_ip }}:{{ notary_system_port }}
          📊 Network Monitor: network-monitor.{{ zone_name }} -> {{ cf_server_ip }}:{{ network_monitor_port }}
          🎯 NANDA-ANS: nanda-ans.{{ zone_name }} -> {{ cf_server_ip }}:{{ nanda_ans_port }}
          🌍 Environment: {{ env_name }}
          
          Next Steps:
          -----------
          1. Verify services: curl https://oracle.{{ zone_name }}/health
          2. Monitor logs: journalctl -u knirvoracle -f
          3. Check embedded services: {{ knirvoracle_home }}/scripts/monitor.sh
