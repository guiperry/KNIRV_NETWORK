---
# KNIRVGATEWAY Endpoint Update Playbook
# Purpose: Update KNIRVGATEWAY endpoints for different deployment environments

- name: Update KNIRVGATEWAY Endpoints
  hosts: localhost
  gather_facts: false
  vars:
    gateway_root: "{{ playbook_dir }}/../../packages/KNIRVGATEWAY"
    
  tasks:
    # =============================================================================
    # TESTNET ENDPOINT UPDATE (Automatic)
    # =============================================================================
    
    - name: Update KNIRVGATEWAY for Testnet Deployment
      block:
        - name: Create testnet environment file
          copy:
            content: |
              # KNIRVGATEWAY Testnet Environment Configuration
              # Auto-generated by ansible deployment
              
              # Service Endpoints (Testnet)
              KNIRVCHAIN_API={{ gateway_endpoints.KNIRVCHAIN_API }}
              KNIRVGRAPH_API={{ gateway_endpoints.KNIRVGRAPH_API }}
              KNIRVSERVER_API={{ gateway_endpoints.KNIRVSERVER_API }}
              KNIRVORACLE_API={{ gateway_endpoints.KNIRVORACLE_API }}
              KNIRVROUTER_API={{ gateway_endpoints.KNIRVROUTER_API }}
              KNIRVANA_API={{ gateway_endpoints.KNIRVANA_API }}
              KNIRVANA_INTERACTIVE_GRAPH={{ gateway_endpoints.KNIRVANA_INTERACTIVE_GRAPH }}
              
              # Environment
              NODE_ENV=testnet
              DEPLOYMENT_ENV=testnet
              
              # Testnet Configuration
              TESTNET_MODE=true
              DEBUG_MODE=true
              ENABLE_CORS=true
            dest: "{{ gateway_root }}/.env.testnet"
            mode: '0644'
            
        - name: Update GraphChain Explorer config for testnet
          copy:
            content: |
              // KNIRVGATEWAY GraphChain Explorer Configuration (Testnet)
              // Auto-generated by ansible deployment
              
              window.KNIRV_CONFIG = {
                environment: 'testnet',
                apiEndpoints: {
                  chain: '{{ gateway_endpoints.KNIRVCHAIN_API }}',
                  graph: '{{ gateway_endpoints.KNIRVGRAPH_API }}',
                  nexus: '{{ gateway_endpoints.KNIRVSERVER_API }}',
                  oracle: '{{ gateway_endpoints.KNIRVORACLE_API }}',
                  router: '{{ gateway_endpoints.KNIRVROUTER_API }}',
                  knirvana: '{{ gateway_endpoints.KNIRVANA_API }}'
                },
                features: {
                  interactiveGraph: true,
                  interactiveGraphUrl: '{{ gateway_endpoints.KNIRVANA_INTERACTIVE_GRAPH }}',
                  testnetMode: true,
                  debugMode: true
                }
              };
            dest: "{{ gateway_root }}/graphchain-explorer/js/config.js"
            mode: '0644'
            
        - name: Update Nexus Portal config for testnet
          copy:
            content: |
              // KNIRVGATEWAY Nexus Portal Configuration (Testnet)
              // Auto-generated by ansible deployment
              
              window.NEXUS_CONFIG = {
                environment: 'testnet',
                apiEndpoints: {
                  nexus: '{{ gateway_endpoints.KNIRVSERVER_API }}',
                  chain: '{{ gateway_endpoints.KNIRVCHAIN_API }}',
                  oracle: '{{ gateway_endpoints.KNIRVORACLE_API }}',
                  router: '{{ gateway_endpoints.KNIRVROUTER_API }}'
                },
                features: {
                  testnetMode: true,
                  debugMode: true,
                  enableMockData: false
                }
              };
            dest: "{{ gateway_root }}/nexus-portal/public/config.js"
            mode: '0644'
            
        - name: Update Interactive Graph View for testnet
          lineinfile:
            path: "{{ gateway_root }}/graphchain-explorer/interactive-graph.html"
            regexp: '// loadInteractiveGraph\(url\)'
            line: '        loadInteractiveGraph("{{ gateway_endpoints.KNIRVANA_INTERACTIVE_GRAPH }}");'
            
        - name: Display testnet update summary
          debug:
            msg: |
              ✅ KNIRVGATEWAY Updated for Testnet Deployment
              ================================================
              
              Updated Files:
              - .env.testnet
              - graphchain-explorer/js/config.js
              - nexus-portal/public/config.js
              - interactive-graph.html
              
              Endpoints:
              - KNIRVCHAIN: {{ gateway_endpoints.KNIRVCHAIN_API }}
              - KNIRVGRAPH: {{ gateway_endpoints.KNIRVGRAPH_API }}
              - KNIRVSERVER: {{ gateway_endpoints.KNIRVSERVER_API }}
              - KNIRVORACLE: {{ gateway_endpoints.KNIRVORACLE_API }}
              - KNIRVROUTER: {{ gateway_endpoints.KNIRVROUTER_API }}
              - KNIRVANA: {{ gateway_endpoints.KNIRVANA_API }}
              
              Next: Deploy to Netlify with 'make deploy-testnet-gateway'
              
      when: environment is defined and environment == 'testnet'
      
    # =============================================================================
    # PRODUCTION ENDPOINT GENERATION (Manual Control)
    # =============================================================================
    
    - name: Generate Production Endpoints File
      block:
        - name: Create production endpoints.yaml
          copy:
            content: |
              # KNIRVGATEWAY Production Endpoints Configuration
              # Generated by ansible deployment - DO NOT EDIT MANUALLY
              # Use 'make deploy-production-gateway' to apply these endpoints
              
              environment: production
              generated_at: "{{ ansible_date_time.iso8601 }}"
              
              # Production Service Endpoints
              endpoints:
                KNIRVCHAIN_API: "{{ production_endpoints.KNIRVCHAIN_API | default('https://chain.knirv.com') }}"
                KNIRVGRAPH_API: "{{ production_endpoints.KNIRVGRAPH_API | default('https://graph.knirv.com') }}"
                KNIRVSERVER_API: "{{ production_endpoints.KNIRVSERVER_API | default('https://nexus.knirv.com') }}"
                KNIRVORACLE_API: "{{ production_endpoints.KNIRVORACLE_API | default('https://oracle.knirv.com') }}"
                KNIRVROUTER_API: "{{ production_endpoints.KNIRVROUTER_API | default('https://router.knirv.com') }}"
                KNIRVANA_API: "{{ production_endpoints.KNIRVANA_API | default('https://knirvana.knirv.com') }}"
                KNIRVANA_INTERACTIVE_GRAPH: "{{ production_endpoints.KNIRVANA_INTERACTIVE_GRAPH | default('https://knirvana.knirv.com') }}"
              
              # Production Configuration
              config:
                NODE_ENV: production
                DEPLOYMENT_ENV: production
                TESTNET_MODE: false
                DEBUG_MODE: false
                ENABLE_CORS: false
                
              # Features
              features:
                interactiveGraph: true
                testnetMode: false
                debugMode: false
                enableMockData: false
            dest: "{{ gateway_root }}/config/endpoints.yaml"
            mode: '0644'
            
        - name: Create config directory if it doesn't exist
          file:
            path: "{{ gateway_root }}/config"
            state: directory
            mode: '0755'
            
        - name: Display production endpoints summary
          debug:
            msg: |
              ✅ Production Endpoints File Generated
              =====================================
              
              File: KNIRVGATEWAY/config/endpoints.yaml
              
              Production Endpoints:
              - KNIRVCHAIN: {{ production_endpoints.KNIRVCHAIN_API | default('https://chain.knirv.com') }}
              - KNIRVGRAPH: {{ production_endpoints.KNIRVGRAPH_API | default('https://graph.knirv.com') }}
              - KNIRVSERVER: {{ production_endpoints.KNIRVSERVER_API | default('https://nexus.knirv.com') }}
              - KNIRVORACLE: {{ production_endpoints.KNIRVORACLE_API | default('https://oracle.knirv.com') }}
              - KNIRVROUTER: {{ production_endpoints.KNIRVROUTER_API | default('https://router.knirv.com') }}
              - KNIRVANA: {{ production_endpoints.KNIRVANA_API | default('https://knirvana.knirv.com') }}
              
              ⚠️  IMPORTANT: Use 'make deploy-production-gateway' to apply these endpoints
              ⚠️  DO NOT deploy directly - production requires manual verification
              
      when: environment is defined and environment == 'production'
