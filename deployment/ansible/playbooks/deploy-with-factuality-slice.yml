---
# KNIRV Network Deployment with Factuality Slice Capability Node
# This playbook deploys the full KNIRV network and initializes the factuality slice
# capability node as a final step with comprehensive health validation

- name: Deploy KNIRV Network Infrastructure
  hosts: knirv_servers
  become: yes
  gather_facts: yes
  vars:
    deployment_timestamp: "{{ ansible_date_time.iso8601 }}"
    
  pre_tasks:
    - name: Create deployment log entry
      lineinfile:
        path: "{{ knirv_home | default('/opt/knirv') }}/logs/deployment.log"
        line: "{{ deployment_timestamp }} - Starting KNIRV Network deployment with Factuality Slice"
        create: yes
        mode: '0644'
      tags: always

    - name: Ensure required directories exist
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ knirv_home | default('/opt/knirv') }}/logs"
        - "{{ knirv_home | default('/opt/knirv') }}/config"
        - "{{ knirv_home | default('/opt/knirv') }}/scripts"
        - "{{ knirv_home | default('/opt/knirv') }}/status"
      tags: always

  roles:
    # Core KNIRV infrastructure deployment
    - role: infrastructure
      tags: 
        - infrastructure
        - core
    
    # KNIRV service deployment
    - role: knirv-services
      tags:
        - services
        - core
    
    # Monitoring and logging setup
    - role: monitoring
      tags:
        - monitoring
        - optional
      when: enable_monitoring | default(true)

  post_tasks:
    - name: Wait for core services to stabilize
      pause:
        seconds: 30
        prompt: "Waiting for core KNIRV services to stabilize before capability initialization"
      tags: always

    - name: Log core deployment completion
      lineinfile:
        path: "{{ knirv_home | default('/opt/knirv') }}/logs/deployment.log"
        line: "{{ ansible_date_time.iso8601 }} - Core KNIRV Network deployment completed"
      tags: always

- name: Initialize Factuality Slice Capability Node
  hosts: knirv_servers
  become: yes
  gather_facts: yes
  vars:
    knirv_home: "{{ knirv_home | default('/opt/knirv') }}"
    
  pre_tasks:
    - name: Log factuality slice initialization start
      lineinfile:
        path: "{{ knirv_home }}/logs/deployment.log"
        line: "{{ ansible_date_time.iso8601 }} - Starting Factuality Slice Capability Node initialization"
      tags: always

  roles:
    - role: factuality-slice
      tags:
        - factuality-slice
        - capability
        - health-check

  post_tasks:
    - name: Generate deployment summary
      template:
        src: deployment-summary.j2
        dest: "{{ knirv_home }}/status/deployment-summary-{{ ansible_date_time.epoch }}.json"
        mode: '0644'
      vars:
        deployment_summary:
          timestamp: "{{ ansible_date_time.iso8601 }}"
          deployment_host: "{{ ansible_hostname }}"
          deployment_ip: "{{ ansible_default_ipv4.address }}"
          knirv_version: "{{ knirv_version | default('latest') }}"
          environment: "{{ env | default('production') }}"
          factuality_slice_status: "{{ factuality_slice_status | default('unknown') }}"
          services_deployed: "{{ groups['knirv_servers'] | length }}"
          monitoring_enabled: "{{ enable_monitoring | default(true) }}"
      tags: always

    - name: Display deployment completion message
      debug:
        msg: |
          ================================================================
          KNIRV Network Deployment with Factuality Slice Completed
          ================================================================
          
          Deployment Host: {{ ansible_hostname }}
          Deployment IP: {{ ansible_default_ipv4.address }}
          Timestamp: {{ ansible_date_time.iso8601 }}
          Environment: {{ env | default('production') }}
          
          Core Services Status: Deployed
          Factuality Slice Status: {{ factuality_slice_status | default('unknown') }}
          Monitoring Enabled: {{ enable_monitoring | default(true) }}
          
          Configuration Files:
          - Main Config: {{ knirv_home }}/config/
          - Factuality Slice: {{ factuality_slice_config_path | default('N/A') }}
          
          Log Files:
          - Deployment Log: {{ knirv_home }}/logs/deployment.log
          - Factuality Slice Log: {{ knirv_home }}/logs/factuality-slice-init.log
          
          Status Files:
          - Deployment Summary: {{ knirv_home }}/status/deployment-summary-{{ ansible_date_time.epoch }}.json
          - Factuality Slice Status: {{ knirv_home }}/status/factuality-slice-status.json
          
          Next Steps:
          1. Verify all services are running: systemctl status knirv-*
          2. Check health endpoints: curl http://{{ ansible_default_ipv4.address }}:3000/health
          3. Review logs for any warnings or errors
          4. Run integration tests to validate full functionality
          
          ================================================================
      tags: always

    - name: Final deployment log entry
      lineinfile:
        path: "{{ knirv_home }}/logs/deployment.log"
        line: "{{ ansible_date_time.iso8601 }} - KNIRV Network deployment with Factuality Slice completed successfully"
      tags: always
