openapi: 3.1.0
info:
  title: KNIRVORACLE API
  description: |
    KNIRVORACLE - Rust-based governance and economic orchestrator for the KNIRV network.

    This API provides:
    - Cross-chain asset transfers (IBC-based)
    - Network-wide governance authority
    - NRN token economics and staking
    - Multi-chain fee collection and reward distribution
    - Emergency network controls
    - Bridge management and validation
    - Registry event listening (registries now handled by KNIRVCHAIN)
  version: "2.0.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.knirvoracle.com
    description: Production API server

tags:
  - name: blockchain
    description: Core blockchain operations
  - name: tokens
    description: NRN token management
  - name: cross-chain
    description: Cross-chain transfer operations
  - name: governance
    description: Network-wide governance
  - name: economics
    description: Economic operations and metrics
  - name: bridges
    description: Bridge management and monitoring
  - name: health
    description: System health and status
  - name: deprecated
    description: Deprecated endpoints (registries moved to KNIRVCHAIN)

paths:
  # Health and Status
  /health:
    get:
      tags:
        - health
      summary: Basic health check
      description: Check if the KNIRVORACLE service is running
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: integer

  /v3/status:
    get:
      tags:
        - health
      summary: Full system status
      description: Get comprehensive system status including connections and metrics
      responses:
        '200':
          description: Full system status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  # Cross-Chain Transfers
  /v3/transfer/initiate:
    post:
      tags:
        - cross-chain
      summary: Initiate cross-chain transfer
      description: Start a cross-chain asset transfer via IBC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrossChainTransferRequest'
      responses:
        '201':
          description: Transfer initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferReceipt'
        '400':
          description: Invalid transfer parameters
        '403':
          description: Insufficient balance or permissions

  /v3/transfer/{transfer_id}:
    get:
      tags:
        - cross-chain
      summary: Get transfer status
      description: Get the status of a specific cross-chain transfer
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Transfer status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrossChainTransfer'
        '404':
          description: Transfer not found

  /v3/transfer/history/{address}:
    get:
      tags:
        - cross-chain
      summary: Get transfer history
      description: Get transfer history for a specific address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Transfer history retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferHistory'

  # Bridge Management
  /v3/bridge/config:
    get:
      tags:
        - bridges
      summary: Get bridge configurations
      description: Get all bridge configurations and supported chains
      responses:
        '200':
          description: Bridge configurations retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridges:
                    type: array
                    items:
                      $ref: '#/components/schemas/BridgeConfig'

  /v3/bridge/status:
    get:
      tags:
        - bridges
      summary: Get bridge health status
      description: Get health status for all bridges
      responses:
        '200':
          description: Bridge health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  bridges:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/BridgeStatus'

  # Governance (Network-wide)
  /v3/governance/propose:
    post:
      tags:
        - governance
      summary: Submit governance proposal
      description: Submit a new network governance proposal (requires NRN stake)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GovernanceProposal'
      responses:
        '201':
          description: Proposal submitted successfully
        '400':
          description: Invalid proposal parameters
        '403':
          description: Insufficient stake or permissions

  /v3/governance/vote:
    post:
      tags:
        - governance
      summary: Cast governance vote
      description: Vote on an active governance proposal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteRequest'
      responses:
        '200':
          description: Vote cast successfully
        '400':
          description: Invalid vote parameters

  /v3/governance/proposals:
    get:
      tags:
        - governance
      summary: List governance proposals
      description: Get list of active governance proposals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, passed, failed, executed]
      responses:
        '200':
          description: List of proposals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GovernanceProposal'

  /v3/governance/proposal/{id}:
    get:
      tags:
        - governance
      summary: Get proposal details
      description: Get detailed information about a specific proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GovernanceProposal'
        '404':
          description: Proposal not found

  /v3/governance/tally/{id}:
    get:
      tags:
        - governance
      summary: Get proposal vote tally
      description: Get current vote tally for a proposal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Vote tally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoteTally'

  /v3/governance/execute/{id}:
    post:
      tags:
        - governance
      summary: Execute passed proposal
      description: Execute a proposal that has passed voting (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Proposal executed successfully
        '403':
          description: Not authorized to execute proposals

  /v3/governance/parameters:
    get:
      tags:
        - governance
      summary: Get network parameters
      description: Get current network governance parameters
      responses:
        '200':
          description: Network parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkParameters'

  /v3/governance/validators:
    get:
      tags:
        - governance
      summary: List validators
      description: Get list of active validators and their stakes
      responses:
        '200':
          description: List of validators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ValidatorInfo'

  /v3/governance/delegate:
    post:
      tags:
        - governance
      summary: Delegate stake
      description: Delegate NRN tokens to a validator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRequest'
      responses:
        '200':
          description: Delegation successful

  /v3/governance/undelegate:
    post:
      tags:
        - governance
      summary: Undelegate stake
      description: Undelegate NRN tokens from a validator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UndelegationRequest'
      responses:
        '200':
          description: Undelegation initiated

  # Economics
  /v3/economics/metrics:
    get:
      tags:
        - economics
      summary: Get network economic metrics
      description: Get comprehensive economic metrics for the network
      responses:
        '200':
          description: Economic metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EconomicMetrics'

  /v3/economics/supply:
    get:
      tags:
        - economics
      summary: Get token supply info
      description: Get NRN token supply information
      responses:
        '200':
          description: Token supply information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSupply'

  /v3/economics/fees:
    get:
      tags:
        - economics
      summary: Get current fee structure
      description: Get current network fee structure
      responses:
        '200':
          description: Fee structure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeStructure'

  /v3/economics/rewards:
    get:
      tags:
        - economics
      summary: Get reward distribution
      description: Get current reward distribution parameters
      responses:
        '200':
          description: Reward distribution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardDistribution'

  /v3/economics/stake:
    post:
      tags:
        - economics
      summary: Stake tokens
      description: Stake NRN tokens for validation or development rewards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StakeRequest'
      responses:
        '200':
          description: Staking successful

  /v3/economics/unstake:
    post:
      tags:
        - economics
      summary: Unstake tokens
      description: Unstake NRN tokens (subject to unbonding period)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnstakeRequest'
      responses:
        '200':
          description: Unstaking initiated

  /v3/economics/staking/{address}:
    get:
      tags:
        - economics
      summary: Get staking info
      description: Get staking information for an address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Staking information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakingInfo'

  /v3/economics/burns:
    get:
      tags:
        - economics
      summary: Get burn history
      description: Get history of NRN token burns
      responses:
        '200':
          description: Burn history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BurnRecord'

  # IBC Status
  /v3/ibc/connections:
    get:
      tags:
        - health
      summary: Get IBC connection status
      description: Get status of all IBC connections
      responses:
        '200':
          description: IBC connection status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connections:
                    type: array
                    items:
                      $ref: '#/components/schemas/IBCConnection'

  # Legacy/Blockchain Operations (for compatibility)
  /blocks:
    get:
      tags:
        - blockchain
      summary: Get blockchain blocks
      description: Retrieve all blocks in the blockchain
      deprecated: true
      responses:
        '200':
          description: List of blocks

  /send_txn:
    post:
      tags:
        - blockchain
      summary: Send transaction
      description: Submit a new transaction to the blockchain
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Transaction submitted successfully

  # Legacy Token Management
  /nrn/mint:
    post:
      tags:
        - tokens
      summary: Mint NRN tokens
      description: Mint new NRN tokens to an address
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - from
                - amount
              properties:
                to:
                  type: string
                from:
                  type: string
                amount:
                  type: string
      responses:
        '201':
          description: Tokens minted successfully

  /nrn/transfer:
    post:
      tags:
        - tokens
      summary: Transfer NRN tokens
      description: Transfer NRN tokens between addresses
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - to
                - from
                - amount
              properties:
                to:
                  type: string
                from:
                  type: string
                amount:
                  type: string
      responses:
        '200':
          description: Transfer completed successfully

  /nrn/balance:
    post:
      tags:
        - tokens
      summary: Get NRN balance
      description: Get NRN token balance for an address
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  type: string
      responses:
        '200':
          description: Balance retrieved successfully

  /nrn/info:
    get:
      tags:
        - tokens
      summary: Get NRN token info
      description: Get NRN token information (total supply, owner, etc.)
      deprecated: true
      responses:
        '200':
          description: Token information

  # Deprecated Registry Endpoints
  /llm/register:
    post:
      tags:
        - deprecated
      summary: Register LLM (DEPRECATED)
      description: |
        DEPRECATED: LLM registration has been moved to KNIRVCHAIN.
        Use IBC events from KNIRVCHAIN for LLM registration fees.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '400':
          description: Endpoint deprecated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "LLM registration has been moved to KNIRVCHAIN"

  /skill/register:
    post:
      tags:
        - deprecated
      summary: Register skill (DEPRECATED)
      description: |
        DEPRECATED: Skill registration has been moved to KNIRVCHAIN.
        Use IBC events from KNIRVCHAIN for skill registration fees.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '400':
          description: Endpoint deprecated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Skill registration has been moved to KNIRVCHAIN"

  /skill/invoke:
    post:
      tags:
        - deprecated
      summary: Invoke skill (DEPRECATED)
      description: |
        DEPRECATED: Skill invocation fees are now collected via IBC from KNIRVCHAIN.
        Use cross-chain transfer endpoints for fee collection.
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '400':
          description: Endpoint deprecated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: "Skill invocation fees are now collected via IBC from KNIRVCHAIN"

  # Legacy Advanced Features (deprecated)
  /v3/models/list:
    get:
      tags:
        - deprecated
      summary: List registered models (DEPRECATED)
      description: "DEPRECATED: Model management moved to KNIRVCHAIN"
      deprecated: true
      responses:
        '200':
          description: List of models

  /v3/models/switch:
    post:
      tags:
        - deprecated
      summary: Switch active model (DEPRECATED)
      description: "DEPRECATED: Model switching moved to KNIRVCHAIN"
      deprecated: true
      responses:
        '200':
          description: Model switched successfully

  /v3/tee/prepare:
    post:
      tags:
        - deprecated
      summary: Prepare LoRA execution (DEPRECATED)
      description: "DEPRECATED: LoRA preparation moved to KNIRVCHAIN"
      deprecated: true
      responses:
        '200':
          description: LoRA preparation completed

components:
  schemas:
    # Cross-Chain Transfer Schemas
    CrossChainTransferRequest:
      type: object
      required:
        - sender
        - recipient
        - amount
        - denom
        - dest_chain
      properties:
        sender:
          type: string
          description: Sender address
        recipient:
          type: string
          description: Recipient address on destination chain
        amount:
          type: string
          description: Amount to transfer (in smallest unit)
        denom:
          type: string
          description: Token denomination (NRN, USDC, etc.)
        dest_chain:
          $ref: '#/components/schemas/ChainId'
        memo:
          type: string
          description: Optional memo for the transfer

    CrossChainTransfer:
      type: object
      properties:
        transfer_id:
          type: string
        source_chain:
          $ref: '#/components/schemas/ChainId'
        dest_chain:
          $ref: '#/components/schemas/ChainId'
        sender:
          type: string
        recipient:
          type: string
        amount:
          type: integer
        denom:
          type: string
        timeout_height:
          type: integer
        timeout_timestamp:
          type: integer
        memo:
          type: string
        status:
          $ref: '#/components/schemas/TransferStatus'
        created_at:
          type: integer
        completed_at:
          type: integer

    TransferReceipt:
      type: object
      properties:
        transfer_id:
          type: string
        status:
          $ref: '#/components/schemas/TransferStatus'
        timestamp:
          type: integer
        fee_amount:
          type: integer
        fee_denom:
          type: string
        transaction_hash:
          type: string

    TransferHistory:
      type: object
      properties:
        transfers:
          type: array
          items:
            $ref: '#/components/schemas/CrossChainTransfer'
        total_count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer

    ChainId:
      type: string
      enum:
        - knirv-chain
        - knirv-oracle
        - knirv-nexus
        - knirv-router
        - knirv-graph
        - xion
      description: Supported chain identifiers

    TransferStatus:
      type: string
      enum:
        - Pending
        - SourceLocked
        - InTransit
        - DestReceived
        - Completed
        - Failed
        - Refunded
        - TimedOut

    # Bridge Schemas
    BridgeConfig:
      type: object
      properties:
        chain_id:
          $ref: '#/components/schemas/ChainId'
        channel_id:
          type: string
        port_id:
          type: string
        connection_id:
          type: string
        client_id:
          type: string
        trust_level:
          type: number
        max_transfer_amount:
          type: integer
        min_transfer_amount:
          type: integer
        transfer_fee_basis_points:
          type: integer
        enabled:
          type: boolean

    BridgeStatus:
      type: object
      properties:
        chain_id:
          $ref: '#/components/schemas/ChainId'
        operational:
          type: boolean
        trust_level:
          type: number
        total_transfers:
          type: integer
        pending_transfers:
          type: integer
        failed_transfers:
          type: integer
        last_block_height:
          type: integer
        last_update:
          type: integer

    # Governance Schemas
    GovernanceProposal:
      type: object
      properties:
        id:
          type: string
        proposer:
          type: string
        proposal_type:
          $ref: '#/components/schemas/ProposalType'
        title:
          type: string
        description:
          type: string
        deposit_amount:
          type: integer
        status:
          type: string
          enum: [deposit, voting, passed, failed, executed]
        submit_time:
          type: integer
        voting_start_time:
          type: integer
        voting_end_time:
          type: integer

    ProposalType:
      type: string
      enum:
        - ModelTransition
        - NetworkParameter
        - ValidatorUpdate
        - Emergency
        - ChainRegistration
        - ChainDeregistration
        - BridgeParameterUpdate
        - CrossChainEmergencyHalt
        - TokenomicsUpdate
        - FeeStructureUpdate
        - RewardDistributionUpdate
        - ProtocolUpgrade
        - ChainFork

    VoteRequest:
      type: object
      required:
        - proposal_id
        - voter
        - option
      properties:
        proposal_id:
          type: string
        voter:
          type: string
        option:
          type: string
          enum: [yes, no, abstain, veto]

    VoteTally:
      type: object
      properties:
        yes_votes:
          type: integer
        no_votes:
          type: integer
        abstain_votes:
          type: integer
        veto_votes:
          type: integer
        total_voting_power:
          type: integer
        quorum_reached:
          type: boolean

    NetworkParameters:
      type: object
      properties:
        base_transaction_fee:
          type: integer
        skill_invocation_fee:
          type: integer
        llm_registration_fee:
          type: integer
        validation_reward:
          type: integer
        proposal_deposit:
          type: integer
        voting_period_blocks:
          type: integer
        quorum_threshold:
          type: number
        pass_threshold:
          type: number
        veto_threshold:
          type: number
        max_transfer_amount:
          type: integer
        transfer_timeout_blocks:
          type: integer
        bridge_fee_basis_points:
          type: integer
        min_validator_stake:
          type: integer
        min_developer_stake:
          type: integer
        unbonding_period_days:
          type: integer
        slashing_penalty_percent:
          type: integer

    ValidatorInfo:
      type: object
      properties:
        address:
          type: string
        stake_amount:
          type: integer
        voting_power:
          type: integer
        commission_rate:
          type: number
        status:
          type: string
          enum: [active, inactive, jailed]

    DelegationRequest:
      type: object
      required:
        - delegator
        - validator
        - amount
      properties:
        delegator:
          type: string
        validator:
          type: string
        amount:
          type: integer

    UndelegationRequest:
      type: object
      required:
        - delegator
        - validator
        - amount
      properties:
        delegator:
          type: string
        validator:
          type: string
        amount:
          type: integer

    # Economics Schemas
    EconomicMetrics:
      type: object
      properties:
        total_supply:
          type: integer
        circulating_supply:
          type: integer
        total_staked:
          type: integer
        staking_ratio:
          type: number
        total_fees_collected:
          type: integer
        total_rewards_distributed:
          type: integer
        active_validators:
          type: integer
        total_transactions:
          type: integer
        average_fee_per_transaction:
          type: number

    TokenSupply:
      type: object
      properties:
        total_supply:
          type: integer
        max_supply:
          type: integer
        circulating_supply:
          type: integer
        burned_supply:
          type: integer
        staked_supply:
          type: integer

    FeeStructure:
      type: object
      properties:
        base_transaction_fee:
          type: integer
        cross_chain_transfer_fee:
          type: integer
        skill_invocation_fee:
          type: integer
        capability_mint_fee:
          type: integer
        property_mint_fee:
          type: integer
        llm_registration_fee:
          type: integer
        skill_registration_fee:
          type: integer
        proposal_deposit:
          type: integer
        emergency_proposal_deposit:
          type: integer
        min_validator_stake:
          type: integer
        min_developer_stake:
          type: integer

    RewardDistribution:
      type: object
      properties:
        validator_block_reward:
          type: integer
        developer_block_reward:
          type: integer
        community_pool_reward:
          type: integer
        validation_reward:
          type: integer
        skill_creator_share:
          type: number
        network_share:
          type: number
        high_performance_multiplier:
          type: number
        consistent_user_multiplier:
          type: number
        early_adopter_multiplier:
          type: number
        community_leader_multiplier:
          type: number

    StakeRequest:
      type: object
      required:
        - address
        - amount
        - stake_type
      properties:
        address:
          type: string
        amount:
          type: integer
        stake_type:
          type: string
          enum: [validator, developer]

    UnstakeRequest:
      type: object
      required:
        - address
        - amount
      properties:
        address:
          type: string
        amount:
          type: integer

    StakingInfo:
      type: object
      properties:
        address:
          type: string
        total_staked:
          type: integer
        validator_stake:
          type: integer
        developer_stake:
          type: integer
        rewards_earned:
          type: integer
        unbonding_amount:
          type: integer
        unbonding_end_time:
          type: integer

    BurnRecord:
      type: object
      properties:
        amount:
          type: integer
        burner:
          type: string
        timestamp:
          type: integer
        reason:
          type: string
        transaction_hash:
          type: string

    # System Status Schemas
    SystemStatus:
      type: object
      properties:
        version:
          type: string
        uptime:
          type: integer
        active_connections:
          type: integer
        pending_transfers:
          type: integer
        active_proposals:
          type: integer
        total_validators:
          type: integer
        network_health:
          type: string
          enum: [healthy, degraded, unhealthy]
        last_block_height:
          type: integer
        last_block_time:
          type: integer

    IBCConnection:
      type: object
      properties:
        connection_id:
          type: string
        client_id:
          type: string
        counterparty_client_id:
          type: string
        counterparty_connection_id:
          type: string
        state:
          type: string
          enum: [Init, TryOpen, Open, Closed]
        delay_period:
          type: integer

    # Legacy Schemas (for compatibility)
    Transaction:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
        value:
          type: string
        data:
          type: object
      deprecated: true

    Block:
      type: object
      properties:
        index:
          type: integer
        timestamp:
          type: integer
        data:
          type: string
        previous_hash:
          type: string
        hash:
          type: string
      deprecated: true

    ModelInfo:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        status:
          type: string
      deprecated: true