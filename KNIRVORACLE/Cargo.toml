[package]
name = "knirvchain"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "knirvchain"
path = "src/main.rs"

[lib]
name = "knirvchain"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Web framework
actix-web = "4.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"

# Cryptography
k256 = { version = "0.13", features = ["ecdsa", "sha256"] }
sha2 = "0.10"
sha3 = "0.10"
hex = "0.4"
rand = "0.8"

# Database
sled = "0.34"

# Networking
reqwest = { version = "0.11", features = ["json"] }

# P2P and DHT
libp2p = { version = "0.52", features = ["kad", "gossipsub", "tcp", "noise", "yamux", "identify", "ping", "mdns", "macros", "tokio"] }
libp2p-kad = "0.44"
libp2p-gossipsub = "0.45"
libp2p-swarm = { version = "0.43", features = ["macros"] }
libp2p-tcp = { version = "0.40", features = ["tokio"] }
multihash = "0.18"
cid = "0.10"
void = "1.0"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Environment
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
log = "0.4"

# Configuration
toml = "0.8"

# Async traits
async-trait = "0.1"

# Math
num-bigint = { version = "0.4", features = ["serde"] }

# Encoding
base64 = "0.21"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# WASM dependencies (optional)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4", optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
default = []
testnet = []
wasm = ["wasm-bindgen", "js-sys", "web-sys", "console_error_panic_hook", "wee_alloc", "getrandom"]
