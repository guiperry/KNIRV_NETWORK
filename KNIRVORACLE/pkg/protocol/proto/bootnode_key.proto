syntax = "proto3";

package KNIRVORACLE;

option go_package = "./;proto";

message BootnodeKeyFileContentProto {
  string master_wallet_key = 1;
  // Add any other sensitive bootnode-specific config here
}

message EncryptedBootnodeKeyFile {
  bytes encrypted_content = 1;
  bytes salt = 2;
  bytes nonce = 3;
}