openapi: 3.1.0
info:
  title: KNIRVORACLE Root/Admin API
  description: |
    KNIRVORACLE Root/Administrative API for internal oracle management.

    **⚠️ This is the ROOT/ADMIN API only - for internal oracle administration.**

    This API provides administrative functions for:
    - Gateway health monitoring and status
    - DHT (Distributed Hash Table) control and management
    - Node.js service lifecycle management
    - Session management for controller connections
    - Service discovery and provisioning

    **For public API access to services, see the Unified Public API.**
  version: "1.0.0"
  contact:
    name: KNIRV Network Support
    email: support@knirv.com

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://oracle.knirv.network
    description: Production oracle

tags:
  - name: admin
    description: Administrative oracle operations
  - name: dht
    description: DHT control and management
  - name: services
    description: Node.js service lifecycle management
  - name: session
    description: Session and controller management
  - name: discovery
    description: Service discovery and provisioning

paths:
  # Gateway Health & Status
  /health:
    get:
      tags:
        - oracle
      summary: Gateway health check
      description: Returns the overall health status of the oracle and connected services
      responses:
        '200':
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  mode:
                    type: string
                    example: "persistent"
                  timestamp:
                    type: number
                    example: 1703123456789
                  dhtInitialized:
                    type: boolean
                    example: true

  # DHT Management
  /dht/status:
    get:
      tags:
        - dht
      summary: DHT status
      description: Returns the current status of the Distributed Hash Table
      responses:
        '200':
          description: DHT status information

  /dht/start:
    post:
      tags:
        - dht
      summary: Start DHT
      description: Initialize and start the DHT in persistent mode
      responses:
        '200':
          description: DHT started successfully

  /dht/stop:
    post:
      tags:
        - dht
      summary: Stop DHT
      description: Stop the DHT service
      responses:
        '200':
          description: DHT stopped successfully

  # Service Management
  /services/status:
    get:
      tags:
        - services
      summary: Node.js services status
      description: Returns the status of all managed Node.js services
      responses:
        '200':
          description: Services status information

  /services/endpoints:
    get:
      tags:
        - services
      summary: Service endpoints
      description: Returns the available endpoints for all services
      responses:
        '200':
          description: Service endpoints information

  /services/start:
    post:
      tags:
        - services
      summary: Start all services
      description: Start all managed Node.js services
      responses:
        '200':
          description: Services start initiated

  /services/stop:
    post:
      tags:
        - services
      summary: Stop all services
      description: Stop all managed Node.js services
      responses:
        '200':
          description: Services stop initiated

  # Session Management
  /session/controller:
    get:
      tags:
        - session
      summary: Get controller URL
      description: Retrieve the controller URL for the current session
      responses:
        '200':
          description: Session controller information

    post:
      tags:
        - session
      summary: Set controller URL
      description: Set the controller URL for the current session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - controllerUrl
              properties:
                controllerUrl:
                  type: string
                  example: "https://controller.example.com"
      responses:
        '200':
          description: Controller URL set successfully


components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: string

    ServiceStatus:
      type: object
      properties:
        status:
          type: string
          enum: [running, stopped, error]
        port:
          type: integer
        uptime:
          type: number
        version:
          type: string