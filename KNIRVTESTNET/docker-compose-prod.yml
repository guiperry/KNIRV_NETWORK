networks:
  knirv-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.0.0/16

volumes:
  ipfs_data:
  knirvoracle_data:
  knirvchain_data:
  knirvgraph_data:
  knirvnexus_data:
  knirvrouter_data:
  knirvgateway_data:
