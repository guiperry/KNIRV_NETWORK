# Docker Compose Configuration for KNIRV Testnet Production Deployment
# This configuration uses pre-built Docker images for production deployment
version: '3.8'

services:
  # NGINX Network Manager - Handles all port routing and load balancing
  nginx:
    image: nginx:alpine
    container_name: knirv-testnet-nginx
    ports:
      - "80:80"
      - "1317:1317"
      - "8090:8090"
      - "8082:8082"
      - "8084:8084"
      - "8085:8085"
      - "8086:8086"
      - "3000:3000"
      - "8088:8088"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - knirvoracle
      - knirvchain
      - knirvgraph
      - knirvnexus-1
      - knirvnexus-2
      - knirvrouter
    networks:
      - knirv-testnet
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # IPFS for distributed storage
  ipfs:
    image: ipfs/kubo:latest
    container_name: knirv-testnet-ipfs
    ports:
      - "5001:5001"
      - "8081:8080"  # Changed from 8080 to 8081 to avoid conflict
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    networks:
      - knirv-testnet
    restart: unless-stopped

  # KNIRV Oracle - Network coordinator
  knirvoracle:
    image: knirvoracle:latest
    container_name: knirv-testnet-oracle
    expose:
      - "1317"  # Internal port only, NGINX handles external routing
    volumes:
      - ./data/knirvoracle:/app/data
      - ./config/knirvoracle-config.yaml:/app/config.yaml
    depends_on:
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  # KNIRV Chain - Blockchain service
  knirvchain:
    image: knirvchain:latest
    container_name: knirv-testnet-chain
    expose:
      - "8090"  # Internal port only, NGINX handles external routing
    volumes:
      - ./data/knirvchain:/app/data
      - ./config/knirvchain-config.toml:/app/config.toml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  # KNIRV Graph - Graph processing service
  knirvgraph:
    image: knirvgraph:latest
    container_name: knirv-testnet-graph
    expose:
      - "8082"  # Internal port only, NGINX handles external routing
      - "4001"
    volumes:
      - ./data/knirvgraph:/app/data
      - ./config/knirvgraph-config.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  # KNIRV Nexus - Development environment (instance 1)
  knirvnexus-1:
    image: knirvnexus:latest
    container_name: knirv-testnet-nexus-1
    expose:
      - "8084"  # Internal port only, NGINX handles external routing
    volumes:
      - ./data/knirvnexus:/app/data
      - ./config/knirv-nexus.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
      - NEXUS_INSTANCE=1
    restart: unless-stopped

  # KNIRV Nexus - Development environment (instance 2)
  knirvnexus-2:
    image: knirvnexus:latest
    container_name: knirv-testnet-nexus-2
    expose:
      - "8084"  # Internal port only, NGINX handles external routing
    volumes:
      - ./data/knirvnexus:/app/data
      - ./config/knirv-nexus-minimal.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
      - NEXUS_INSTANCE=2
    restart: unless-stopped

  # KNIRV Router - Network routing service
  knirvrouter:
    image: knirvrouter:latest
    container_name: knirv-testnet-router
    expose:
      - "8086"  # Internal port only, NGINX handles external routing
    volumes:
      - ./data/knirvrouter:/app/data
      - ./config/knirvrouter-config.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
    restart: unless-stopped

  # KNIRV Gateway - Web interface (WASM)
  knirvgateway:
    image: knirvgateway:latest
    container_name: knirv-testnet-gateway
    ports:
      - "10000:10000"
    volumes:
      - ./data/testnet-gateway:/app/data
    depends_on:
      - knirvoracle
      - knirvchain
      - knirvgraph
      - knirvnexus-1
      - knirvrouter
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info
      - GATEWAY_PORT=10000
    restart: unless-stopped
    command: ["./wasmtime", "knirv-server.wasm"]

