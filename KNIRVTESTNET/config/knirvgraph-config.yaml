# KNIRVGRAPH Testnet Configuration
network:
  chain_id: "knirvgraph-testnet-1"
  consensus: "tendermint"
  validators: 1
  block_time: "2s"

graph:
  max_nodes: 10000
  max_edges: 50000
  pre_populate: true
  sample_data: true

dht:
  enabled: true
  bootstrap_nodes: []
  port: 4001
  protocol: "/knirv/kad/1.0.0"

storage:
  backend: "bluntdb"
  path: "./data/knirvgraph/graph.db"
  cache_size: "100MB"

api:
  host: "0.0.0.0"
  port: 8081
  graphql_enabled: true
  rest_enabled: true

nrv:
  announcement_interval: "30s"
  discovery_timeout: "60s"
  max_concurrent: 100

skill_nodes:
  validation_required: true
  dvr_threshold: 1
  auto_mint: true

error_nodes:
  auto_create: true
  categorization: true
  similarity_threshold: 0.8
