# KNIRV-NEXUS Testnet Configuration
mode: headless
environment: testnet
chain_id: knirv-nexus-testnet
node_role: dve-manager
testnet: true

# Service configuration
api:
  port: 8082
  bind_address: "0.0.0.0"
  address: "0.0.0.0"

# GUI mode configuration (disabled for testnet)
gui:
  enabled: false
  port: 9082
  frontend_path: "./dist"
  bind_address: "127.0.0.1"

# Security configuration
security:
  auth_required: false  # Simplified for testnet
  tls_enabled: false
  audit_logging: false
  jwt_secret: "testnet-jwt-secret-key-for-development-only"

# Authentication configuration
auth:
  jwt_secret: "testnet-jwt-secret-key-for-development-only"
  token_expiry: "24h"
  enable_oauth: false
  oauth_providers: []

# Database configuration
database:
  path: "./data/knirvnexus/testnet.db"

# Validation configuration
validation:
  timeout: "30s"
  max_concurrent: 5
  enable_tee: false

# TEE configuration (simulation mode)
tee:
  type: "software"
  software:
    enable_attestation: false
    key_file: ""

# Network configuration
network:
  chain_id: "knirv-nexus-testnet"
  p2p_port: 4001
  discovery_enabled: false

# P2P configuration
p2p:
  port: 4001
  bootstraps: []

# Reports configuration
reports:
  storage_path: "./data/knirvnexus/reports"
  max_file_size: 10485760  # 10MB
  retention_days: 7
  enable_sharing: true
  enable_scheduling: false

# Logging configuration
log:
  level: "info"
  format: "text"
  output: "./logs/knirvnexus.log"
