services:
  # KNIRVTESTNET Wizened Web Service
  #
  # DEPLOYMENT MODES:
  # - Render.com: Uses Docker with pre-built native binaries (npm run build:render)
  # - Local Development: Uses Podman containers (npm run build:podman && npm run podman:start)
  #
  # NOTE: Render.com doesn't support Podman directly, so we use Docker for cloud deployment
  # For local Podman development setup: npm run build:podman
  # For local Podman usage: npm run podman:start
  # Root directory is set to KNIRVTESTNET in Render dashboard
  - type: web
    name: knirvtestnet-wizened
    runtime: docker  # Render only supports Docker, not Podman
    plan: starter
    region: oregon

    envVars:
      - key: NODE_VERSION
        value: "v18.18.0"
      - key: WASMTIME_VERSION
        value: v22.0.0
      - key: KNIRV_ENV
        value: wizened-testnet
      - key: DEPLOYMENT_ENV
        value: testnet
      - key: TESTNET_MODE
        value: "true"
      - key: DEBUG_MODE
        value: "true"
      - key: ENABLE_CORS
        value: "true"
      # Service endpoints (internal to WASM module)
      - key: KNIRVCHAIN_API
        value: http://localhost:8080
      - key: KNIRVGRAPH_API
        value: http://localhost:8081
      - key: KNIRVNEXUS_API
        value: http://localhost:8082
      - key: KNIRVORACLE_API
        value: http://localhost:1317
      - key: KNIRVROUTER_API
        value: http://localhost:8086

    # BUILD COMMANDS:
    # - npm run build:render  → Prepare for Render deployment (verify pre-built binaries)
    # - npm run build:podman  → Install Podman + dependencies for local development
    # - npm run build:wizened → Build all binaries locally (run before committing)
    #
    # Docker build uses the Dockerfile which implements the WizenedEnvironmentGuide approach
    # The Dockerfile expects pre-built artifacts from running build-local-release.sh locally

    healthCheckPath: /health

databases:
  # PostgreSQL for NEXUS Portal and API functions
  - name: knirvtestnet-postgres
    plan: starter
    region: oregon
    
  # Redis for caching and sessions
  - name: knirvtestnet-redis
    plan: starter
    region: oregon
