version: '3.8'

services:
  ipfs:
    image: ipfs/go-ipfs:latest
    container_name: knirv-testnet-ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ./data/ipfs:/data/ipfs
    environment:
      - IPFS_PROFILE=server
    networks:
      - knirv-testnet

  knirvoracle:
    build:
      context: ../KNIRVORACLE
      dockerfile: Dockerfile
    container_name: knirv-testnet-root
    ports:
      - "1317:1317"
      - "26657:26657"
      - "26656:26656"
    volumes:
      - ./data/knirvoracle:/root/.knirvoracle
      - ./config/knirvoracle-config.yaml:/root/config.yaml
    depends_on:
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - KNIRV_NETWORK=testnet
      - KNIRV_CHAIN_ID=knirv-testnet-1

  knirvchain:
    build:
      context: ../KNIRVCHAIN
      dockerfile: Dockerfile
    container_name: knirv-testnet-chain
    ports:
      - "8080:8080"
    volumes:
      - ./data/knirvchain:/app/data
      - ./config/knirvchain-config.toml:/app/config.toml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - RUST_LOG=info

  knirvgraph:
    build:
      context: ../KNIRVGRAPH
      dockerfile: Dockerfile
    container_name: knirv-testnet-graph
    ports:
      - "8081:8081"
      - "4001:4001"
    volumes:
      - ./data/knirvgraph:/app/data
      - ./config/knirvgraph-config.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
      - ipfs
    networks:
      - knirv-testnet
    environment:
      - GO_ENV=testnet

  knirvnexus-1:
    build:
      context: ../KNIRVNEXUS
      dockerfile: Dockerfile
    container_name: knirv-testnet-nexus-1
    ports:
      - "8082:8082"
    volumes:
      - ./data/knirvnexus/node-1:/app/data
      - ./config/knirvnexus-config.yaml:/app/config.yaml
    environment:
      - NODE_ID=1
      - MOCK_TEE=true
    depends_on:
      - knirvoracle
    networks:
      - knirv-testnet

  knirvnexus-2:
    build:
      context: ../KNIRVNEXUS
      dockerfile: Dockerfile
    container_name: knirv-testnet-nexus-2
    ports:
      - "8083:8083"
    volumes:
      - ./data/knirvnexus/node-2:/app/data
      - ./config/knirvnexus-config.yaml:/app/config.yaml
    environment:
      - NODE_ID=2
      - MOCK_TEE=true
    depends_on:
      - knirvoracle
    networks:
      - knirv-testnet

  knirvrouter:
    build:
      context: ../KNIRVROUTER
      dockerfile: Dockerfile
    container_name: knirv-testnet-router
    ports:
      - "8086:8086"
      - "3478:3478"
    volumes:
      - ./data/knirvrouter:/app/data
      - ./config/knirvrouter-config.yaml:/app/config.yaml
    depends_on:
      - knirvoracle
    networks:
      - knirv-testnet

  knirvgateway:
    build:
      context: ../KNIRVGATEWAY
      dockerfile: Dockerfile
    container_name: knirv-testnet-gateway
    ports:
      - "8087:8087"
    volumes:
      - ./config/knirvgateway-config.json:/app/config.json
    depends_on:
      - knirvoracle
      - knirvchain
      - knirvgraph
      - knirvnexus-1
      - knirvnexus-2
      - knirvrouter
    networks:
      - knirv-testnet
    environment:
      - NODE_ENV=testnet

networks:
  knirv-testnet:
    name: knirv-testnet
    driver: bridge
