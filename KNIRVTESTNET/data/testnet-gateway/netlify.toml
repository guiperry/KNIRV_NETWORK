# KNIRV TESTNET Gateway Netlify Configuration
# Optimized for local developer use

[build]
  functions = "netlify/functions"
  publish = "."

[dev]
  functions = "netlify/functions"
  publish = "."
  port = 8888
  targetPort = 3999
  framework = "#static"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Environment variables for testnet
[context.testnet.environment]
  NODE_ENV = "testnet"
  TESTNET_MODE = "true"
  KNIRVORACLE_URL = "http://localhost:1317"
  KNIRVCHAIN_URL = "http://localhost:8090"
  KNIRVGRAPH_URL = "http://localhost:8082"
  KNIRVNEXUS_URL = "http://localhost:8084"
  KNIRVNEXUS_API_URL = "http://localhost:8084/api"
  KNIRVROUTER_URL = "http://localhost:8086"

# Headers for CORS
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Function-specific headers
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
