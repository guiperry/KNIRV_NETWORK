apiVersion: apps/v1
kind: Deployment
metadata:
  name: dve-manager
  namespace: knirv-nexus
  labels:
    app: dve-manager
    component: management
    version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: dve-manager
  template:
    metadata:
      labels:
        app: dve-manager
        component: management
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: knirv-nexus-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: dve-manager
        image: knirv/nexus-dve-manager:latest
        imagePullPolicy: Always
        ports:
        - name: api
          containerPort: 8080
          protocol: TCP
        - name: p2p
          containerPort: 4001
          protocol: TCP
        env:
        - name: KNIRV_NODE_ROLE
          value: "dve-manager"
        - name: KNIRV_CHAIN_ID
          value: "knirv-nexus-mainnet"
        - name: KNIRV_DATABASE_PATH
          value: "/app/data/dve-manager.db"
        - name: KNIRV_API_PORT
          value: "8080"
        - name: KNIRV_P2P_PORT
          value: "4001"
        - name: KNIRV_LOG_LEVEL
          value: "info"
        - name: KNIRV_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: knirv-nexus-secrets
              key: jwt-secret
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: scripts
          mountPath: /app/scripts
          readOnly: true
        - name: tee-keys
          mountPath: /app/keys
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: dve-manager-data
      - name: config
        configMap:
          name: knirv-nexus-config
          defaultMode: 0644
      - name: scripts
        configMap:
          name: knirv-nexus-scripts
          defaultMode: 0755
      - name: tee-keys
        secret:
          secretName: knirv-nexus-secrets
          defaultMode: 0600
          items:
          - key: tee-private-key
            path: tee.key
      imagePullSecrets:
      - name: knirv-nexus-registry
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
      - key: "knirv.io/tee-enabled"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - dve-manager
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: dve-manager-service
  namespace: knirv-nexus
  labels:
    app: dve-manager
spec:
  type: ClusterIP
  ports:
  - name: api
    port: 8080
    targetPort: api
    protocol: TCP
  - name: p2p
    port: 4001
    targetPort: p2p
    protocol: TCP
  selector:
    app: dve-manager
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dve-manager-data
  namespace: knirv-nexus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
