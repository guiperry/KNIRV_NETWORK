apiVersion: v1
kind: Namespace
metadata:
  name: knirv-nexus
  labels:
    name: knirv-nexus
    environment: production
    project: knirv-network
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: knirv-nexus-quota
  namespace: knirv-nexus
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    persistentvolumeclaims: "10"
    pods: "50"
    services: "20"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: knirv-nexus-limits
  namespace: knirv-nexus
spec:
  limits:
  - default:
      cpu: "1"
      memory: "2Gi"
    defaultRequest:
      cpu: "100m"
      memory: "256Mi"
    type: Container
  - default:
      storage: "10Gi"
    type: PersistentVolumeClaim
