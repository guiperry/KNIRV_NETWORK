# KNIRV-NEXUS Development Configuration

# Server settings (wrapper frontend)
host: "0.0.0.0"
port: 8081
database_path: "data/nexus.db"
serve_frontend: true
log_level: "debug"
log_file: "logs/nexus.log"

# API Configuration
api:
  port: 8082
  host: "0.0.0.0"
  enable_cors: true
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:8080"
    - "https://nexus.knirv.com"
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  rate_limit_rps: 1000
  request_timeout: "30s"

# Host Controller Configuration
host_controller:
  enable_monitoring: true
  monitoring_interval: "30s"
  enable_p2p: true
  p2p_port: 4001
  enable_tee: false
  tee_type: "none"
  container_runtime: "podman"
  enable_security_monitoring: true

# Data Engine Configuration
data_engine:
  retention_days: 30
  max_events_per_collection: 10000
  enable_compression: true
  backup_interval: "24h"
  backup_retention: 7

# Agent Server Configuration
agent_server:
  max_agents: 100
  agent_timeout: "5m"
  enable_isolation: true
  resource_limits:
    max_cpu_per_agent: 1.0
    max_memory_per_agent: 512000000  # 512MB
    max_disk_per_agent: 1073741824   # 1GB
  health_check_interval: "30s"

# Inference Service Configuration
inference:
  max_concurrent_requests: 10
  request_timeout: "30s"
  model_cache_size: 5
  enable_fine_tuning: true
  fine_tuning_config:
    max_concurrent_jobs: 2
    default_epochs: 3
    learning_rate: 0.0001
    batch_size: 8

# CDE (Cloud Development Environment) Configuration
cde:
  base_image_path: "images"
  workspace_root: "workspaces"
  max_environments: 50
  default_timeout: "1h"
  max_cpu_per_env: 2.0
  max_memory_per_env: 2147483648    # 2GB
  max_disk_per_env: 10737418240     # 10GB
  enable_sandboxing: true
  enable_network_isolation: false
  allowed_ports:
    - 8080
    - 3000
    - 5000
  session_timeout: "2h"
  max_sessions_per_user: 5
  max_projects_per_user: 20
  project_storage_path: "projects"

# Authentication Configuration
auth:
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  password_min_length: 8
  password_require_upper: true
  password_require_lower: true
  password_require_digit: true
  password_require_special: false
  token_expiration: "24h"
  refresh_token_expiration: "168h"  # 7 days
  max_login_attempts: 5
  lockout_duration: "15m"
  session_timeout: "30m"
  enable_two_factor: false

# Logging Configuration
logging:
  level: "debug"
  format: "json"
  output: "stdout"
  file: "logs/nexus.log"
  max_size: 100    # MB
  max_backups: 5
  max_age: 30      # days
  compress: true

# Security Configuration
security:
  enable_tls: false
  tls_cert_file: ""
  tls_key_file: ""
  jwt_secret: "dev-jwt-secret-key-for-development-only"
  enable_rate_limiting: true
  rate_limit_requests_per_minute: 1000
  enable_request_logging: true
  enable_security_headers: true

# Monitoring Configuration
monitoring:
  enable_metrics: true
  metrics_port: 9090
  enable_health_checks: true
  health_check_interval: "30s"
  enable_alerts: true
  alert_webhook_url: ""

# Development Configuration
development:
  enable_debug: true
  enable_profiling: false
  profiling_port: 6060
  enable_hot_reload: false
  mock_external_services: false

# Production Configuration
production:
  enable_clustering: false
  cluster_nodes: []
  enable_load_balancing: false
  enable_auto_scaling: false
  min_replicas: 1
  max_replicas: 10
